# Ambiente local completo: banco, armazenamento compatível com S3 e a
# aplicação. Nada aqui é serviço pago; tudo pode ser trocado por equivalente.
services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: estudos
      POSTGRES_PASSWORD: estudos
      POSTGRES_DB: estudos_musicais
    ports: ['5432:5432']
    volumes:
      - dados-do-banco:/var/lib/postgresql/data
      # Cria os bancos auxiliares e o papel da aplicação no primeiro start.
      - ./prisma/infra/inicializacao:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U estudos -d estudos_musicais']
      interval: 5s
      timeout: 5s
      retries: 10

  armazenamento:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: estudos
      MINIO_ROOT_PASSWORD: estudos-segredo
    ports: ['9000:9000', '9001:9001']
    volumes:
      - dados-do-armazenamento:/data

  aplicacao:
    build: .
    depends_on:
      banco:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://estudos_app:estudos_app@banco:5432/estudos_musicais?schema=public
      DATABASE_URL_MIGRACAO: postgresql://estudos:estudos@banco:5432/estudos_musicais?schema=public
      SEGREDO_SESSAO: desenvolvimento-trocar-em-producao
      ARMAZENAMENTO_DRIVER: s3
      S3_ENDPOINT: http://armazenamento:9000
      S3_BUCKET: estudos-musicais
      S3_CHAVE: estudos
      S3_SEGREDO: estudos-segredo
    ports: ['3000:3000']

volumes:
  dados-do-banco:
  dados-do-armazenamento:
