__modulos['servicos/relatorios'] = (function () {
// Relatórios do administrador.
//
// Números que respondem perguntas de gestão: quantos estão estudando de
// verdade, o método está sendo vencido ou está travando gente, quantos
// certificados saíram.
//
// Cada número aqui é contado a partir de registro real. Nenhum é estimado.

const R = __modulos['dados/repositorios'];
const eventos = __modulos['servicos/eventos'];
const progresso = __modulos['servicos/progresso'];

const DIA = 86400000;
const diasDesde = (iso, agora) => (iso ? Math.floor((Date.parse(agora) - Date.parse(iso)) / DIA) : Infinity);

function panorama({ agora = new Date().toISOString(), janelaDeAtividade = 14 } = {}) {
  const alunos = R.alunos.listar();
  const resultados = R.resultados.listar();
  const aprovados = resultados.filter((r) => r.aprovado);

  const ativos = alunos.filter((a) => diasDesde(eventos.ultimaAtividade(a.id), agora) <= janelaDeAtividade);
  const semAtividade = alunos.filter((a) => !eventos.ultimaAtividade(a.id));

  const fasesConcluidas = R.progressos.listar((p) => p.aprovadoEm).length;

  return {
    alunos: alunos.length,
    alunosAtivos: ativos.length,
    alunosSemAtividade: semAtividade.length,
    janelaDeAtividade,
    instrumentos: R.instrumentos.listar((i) => i.ativo !== false).length,
    metodos: R.metodos.listar((m) => m.ativo !== false).length,
    versoes: R.versoes.contar(),
    fases: R.fases.listar((f) => f.ativo !== false).length,
    matriculas: R.matriculas.contar(),
    matriculasEmCurso: R.matriculas.listar((m) => m.situacao === 'em_curso').length,
    matriculasConcluidas: R.matriculas.listar((m) => m.situacao === 'concluida').length,
    fasesConcluidas,
    avaliacoes: resultados.length,
    aprovacoes: aprovados.length,
    taxaDeAprovacao: resultados.length ? Math.round((aprovados.length / resultados.length) * 100) : 0,
    certificados: R.certificados.contar(),
    mediaDasNotas: resultados.length
      ? Math.round(resultados.reduce((s, r) => s + r.nota, 0) / resultados.length) : 0,
  };
}

// Como cada método está indo: quantos estudam, quantos concluíram, e — o que
// mais interessa — em que fase as pessoas empacam.
function porMetodo() {
  return R.metodos.listar((m) => m.ativo !== false).map((metodo) => {
    const matriculas = R.matriculas.listar((m) => m.metodoId === metodo.id);
    const fases = R.fasesDoMetodo(metodo.id).filter((f) => f.ativo !== false);
    const resultados = R.resultados.listar((r) => fases.some((f) => f.id === r.faseId));
    const aprovados = resultados.filter((r) => r.aprovado);

    // A fase que mais reprova, com evidência mínima para não apontar uma fase
    // por causa de duas tentativas.
    const porFase = fases.map((fase) => {
      const daFase = resultados.filter((r) => r.faseId === fase.id);
      const passaram = daFase.filter((r) => r.aprovado).length;
      return {
        faseId: fase.id, ordem: fase.ordem, titulo: fase.titulo,
        tentativas: daFase.length,
        taxa: daFase.length ? Math.round((passaram / daFase.length) * 100) : null,
        alunosNaFase: matriculas.filter((m) => m.faseAtualId === fase.id).length,
      };
    });
    const gargalo = porFase.filter((f) => f.tentativas >= 5 && f.taxa !== null)
      .sort((a, b) => a.taxa - b.taxa)[0] || null;

    return {
      metodo,
      versaoVigente: R.versaoVigente(metodo.id),
      totalDeFases: fases.length,
      matriculas: matriculas.length,
      emCurso: matriculas.filter((m) => m.situacao === 'em_curso').length,
      concluidas: matriculas.filter((m) => m.situacao === 'concluida').length,
      taxaDeAprovacao: resultados.length ? Math.round((aprovados.length / resultados.length) * 100) : null,
      porFase,
      gargalo,
    };
  });
}

// Distribuição dos alunos por instrumento — para saber que naipe está
// crescendo e onde falta instrutor.
function porInstrumento() {
  const contagem = new Map();
  for (const aluno of R.alunos.listar()) {
    const id = aluno.instrumentoId || '(sem instrumento)';
    contagem.set(id, (contagem.get(id) || 0) + 1);
  }
  return [...contagem.entries()].map(([id, alunos]) => {
    const instrumento = R.instrumentos.buscar(id);
    return { id, nome: instrumento ? instrumento.nome : 'Sem instrumento definido', alunos };
  }).sort((a, b) => b.alunos - a.alunos);
}

// Lista do painel: um aluno por linha, com o que o instrutor precisa ver.
function quadroDeAlunos({ agora = new Date().toISOString() } = {}) {
  return R.alunos.listar().map((aluno) => {
    const situacao = progresso.situacaoDoAluno(aluno.id);
    const principal = situacao.matriculas[0] || null;
    const instrumento = aluno.instrumentoId ? R.instrumentos.buscar(aluno.instrumentoId) : null;
    const ultima = eventos.ultimaAtividade(aluno.id);
    return {
      aluno,
      instrumento: instrumento ? instrumento.nome : '',
      metodo: principal && principal.metodo ? principal.metodo.nome : '',
      fase: principal && principal.faseAtual ? principal.faseAtual.numero : null,
      tituloDaFase: principal && principal.faseAtual ? principal.faseAtual.titulo : '',
      percentual: situacao.percentual,
      concluidas: situacao.concluidas,
      total: situacao.total,
      ultimaAtividade: ultima,
      diasParado: ultima ? diasDesde(ultima, agora) : null,
    };
  });
}

return { panorama, porMetodo, porInstrumento, quadroDeAlunos };
})();

__modulos['servicos/importacao'] = (function () {
// Importação de métodos.
//
// Um método de ensino chega como arquivo e vira cadastro. O caminho é
// deliberadamente em quatro passos — validar, prever, confirmar, criar — e
// não em um só, por uma razão simples: um arquivo errado importado direto
// suja o cadastro de todo mundo, e desfazer isso depois é pior do que
// conferir antes.
//
// Duas garantias desta camada:
//
//   Nada é gravado antes da confirmação. `analisar()` não toca no depósito.
//
//   Erro tem endereço. Não adianta dizer "arquivo inválido": o retorno diz
//   "Fase 4 › Lição 2 › Questão 7 — sem alternativa correta", que é o que
//   permite a alguém corrigir o arquivo.

const R = __modulos['dados/repositorios'];
const auditoria = __modulos['servicos/auditoria'];
const { novoId } = __modulos['dados/ids'];

const texto = (v) => String(v === undefined || v === null ? '' : v).trim();
const vazio = (v) => texto(v) === '';

const erro = (onde, mensagem) => ({ onde, mensagem, gravidade: 'impede' });
const aviso = (onde, mensagem) => ({ onde, mensagem, gravidade: 'aviso' });

// ---------------------------------------------------------------- análise

// Lê o arquivo e devolve o que ele criaria, o que está errado e onde.
// Função pura: não grava nada.
function analisar(bruto) {
  const problemas = [];
  let dados = bruto;

  if (typeof bruto === 'string') {
    try {
      dados = JSON.parse(bruto);
    } catch (e) {
      return { valido: false, problemas: [erro('Arquivo', `Não é um JSON válido: ${e.message}`)], previa: null };
    }
  }
  if (!dados || typeof dados !== 'object') {
    return { valido: false, problemas: [erro('Arquivo', 'Conteúdo vazio ou em formato desconhecido.')], previa: null };
  }

  const metodo = dados.metodo || {};
  const instrumento = dados.instrumento || null;
  const fases = Array.isArray(dados.fases) ? dados.fases : [];
  const licoes = Array.isArray(dados.licoes) ? dados.licoes : [];
  const exercicios = Array.isArray(dados.exercicios) ? dados.exercicios : [];
  const jogos = Array.isArray(dados.jogos) ? dados.jogos : [];
  const avaliacoes = Array.isArray(dados.avaliacoes) ? dados.avaliacoes : [];

  // ------ método
  if (vazio(metodo.id)) problemas.push(erro('Método', 'Sem identificador (campo "id").'));
  if (vazio(metodo.nome)) problemas.push(erro('Método', 'Sem nome.'));
  if (!vazio(metodo.id) && R.metodos.buscar(texto(metodo.id))) {
    problemas.push(erro('Método', `Já existe um método com o identificador "${texto(metodo.id)}". Escolha outro ou publique uma versão nova do existente.`));
  }
  if (!vazio(metodo.nome) && R.metodos.listar().some((m) => m.nome.toLowerCase() === texto(metodo.nome).toLowerCase())) {
    problemas.push(erro('Método', `Já existe um método chamado "${texto(metodo.nome)}".`));
  }

  // ------ instrumentos atendidos
  const instrumentoIds = Array.isArray(metodo.instrumentoIds) ? metodo.instrumentoIds.map(texto) : [];
  const universal = Boolean(metodo.universal);
  if (instrumento && !vazio(instrumento.id)) instrumentoIds.push(texto(instrumento.id));

  if (!universal && !instrumentoIds.length) {
    problemas.push(erro('Método', 'Não diz a quem serve: informe "instrumentoIds" ou marque "universal".'));
  }
  for (const id of instrumentoIds) {
    const jaExiste = R.instrumentos.buscar(id);
    const vemNoArquivo = instrumento && texto(instrumento.id) === id;
    if (!jaExiste && !vemNoArquivo) {
      problemas.push(erro('Método', `Cita o instrumento "${id}", que não está cadastrado e não vem no arquivo.`));
    }
  }
  if (instrumento) {
    if (vazio(instrumento.nome)) problemas.push(erro('Instrumento', 'Sem nome.'));
    if (R.instrumentos.buscar(texto(instrumento.id))) {
      problemas.push(aviso('Instrumento', `"${texto(instrumento.id)}" já está cadastrado — o do arquivo será ignorado.`));
    }
  }

  // ------ fases
  if (!fases.length) problemas.push(erro('Fases', 'O método não traz nenhuma fase.'));
  const idsDeFase = new Set();
  const ordens = new Set();
  fases.forEach((fase, i) => {
    const onde = `Fase ${fase.ordem ?? i + 1}`;
    if (vazio(fase.id)) problemas.push(erro(onde, 'Sem identificador.'));
    else if (idsDeFase.has(texto(fase.id))) problemas.push(erro(onde, `Identificador "${texto(fase.id)}" repetido no arquivo.`));
    else if (R.fases.buscar(texto(fase.id))) problemas.push(erro(onde, `Já existe uma fase "${texto(fase.id)}" no cadastro.`));
    else idsDeFase.add(texto(fase.id));

    if (vazio(fase.titulo)) problemas.push(erro(onde, 'Sem título.'));
    const ordem = Number(fase.ordem);
    if (!Number.isInteger(ordem) || ordem < 1) problemas.push(erro(onde, 'Ordem ausente ou inválida (precisa ser 1, 2, 3…).'));
    else if (ordens.has(ordem)) problemas.push(erro(onde, `Duas fases com a ordem ${ordem}.`));
    else ordens.add(ordem);

    if (fase.notaMinima !== undefined) {
      const nota = Number(fase.notaMinima);
      if (!Number.isFinite(nota) || nota < 0 || nota > 100) problemas.push(erro(onde, 'Nota mínima fora de 0 a 100.'));
    }
  });

  const nomeDaFase = (faseId) => {
    const fase = fases.find((f) => texto(f.id) === texto(faseId));
    return fase ? `Fase ${fase.ordem}` : `Fase "${texto(faseId)}"`;
  };

  // ------ lições
  const licoesPorFase = new Map();
  licoes.forEach((licao, i) => {
    const onde = `${nomeDaFase(licao.faseId)} › Lição ${licao.ordem ?? i + 1}`;
    if (vazio(licao.faseId)) problemas.push(erro(onde, 'Lição sem fase.'));
    else if (!idsDeFase.has(texto(licao.faseId))) problemas.push(erro(onde, `Aponta para a fase "${texto(licao.faseId)}", que não está neste arquivo.`));
    if (vazio(licao.titulo)) problemas.push(erro(onde, 'Sem título.'));
    if (vazio(licao.corpo)) problemas.push(erro(onde, 'Sem conteúdo (campo "corpo").'));
    const lista = licoesPorFase.get(texto(licao.faseId)) || [];
    lista.push(licao);
    licoesPorFase.set(texto(licao.faseId), lista);
  });
  for (const faseId of idsDeFase) {
    if (!licoesPorFase.has(faseId)) problemas.push(aviso(nomeDaFase(faseId), 'Nenhuma lição — a fase entra vazia.'));
  }

  // ------ exercícios
  exercicios.forEach((exercicio, i) => {
    const onde = `${nomeDaFase(exercicio.faseId)} › Exercício ${exercicio.ordem ?? i + 1}`;
    const temPai = !vazio(exercicio.licaoId) || !vazio(exercicio.faseId);
    if (!temPai) problemas.push(erro(onde, 'Exercício sem lição nem fase.'));
    if (!vazio(exercicio.faseId) && !idsDeFase.has(texto(exercicio.faseId))) {
      problemas.push(erro(onde, `Aponta para a fase "${texto(exercicio.faseId)}", que não está neste arquivo.`));
    }
    if (vazio(exercicio.titulo)) problemas.push(erro(onde, 'Sem título.'));
  });

  // ------ jogos
  const TIPOS_DE_JOGO = ['ouvido', 'memoria', 'pentagrama', 'ritmo', 'pulso', 'teclado', 'armadura'];
  jogos.forEach((jogo, i) => {
    const onde = `${nomeDaFase(jogo.faseId)} › Jogo ${i + 1}`;
    if (!idsDeFase.has(texto(jogo.faseId))) problemas.push(erro(onde, `Aponta para a fase "${texto(jogo.faseId)}", que não está neste arquivo.`));
    if (!TIPOS_DE_JOGO.includes(texto(jogo.tipo))) {
      problemas.push(erro(onde, `Tipo de jogo "${texto(jogo.tipo)}" desconhecido. Os disponíveis são: ${TIPOS_DE_JOGO.join(', ')}.`));
    }
    if (vazio(jogo.titulo)) problemas.push(erro(onde, 'Sem título.'));
  });

  // ------ avaliações e questões
  let totalDeQuestoes = 0;
  avaliacoes.forEach((avaliacao, i) => {
    const onde = `${nomeDaFase(avaliacao.faseId)} › Avaliação`;
    if (!idsDeFase.has(texto(avaliacao.faseId))) {
      problemas.push(erro(onde, `Aponta para a fase "${texto(avaliacao.faseId)}", que não está neste arquivo.`));
    }
    const questoes = Array.isArray(avaliacao.questoes) ? avaliacao.questoes : [];
    if (!questoes.length) problemas.push(erro(onde, 'Avaliação sem questões.'));

    const quantidade = Number(avaliacao.quantidadeDeQuestoes || questoes.length);
    if (questoes.length && quantidade > questoes.length) {
      problemas.push(aviso(onde, `Pede ${quantidade} questões por prova mas traz ${questoes.length}: as perguntas vão se repetir.`));
    }

    questoes.forEach((questao, j) => {
      const ondeQ = `${nomeDaFase(avaliacao.faseId)} › Avaliação › Questão ${j + 1}`;
      totalDeQuestoes += 1;
      if (vazio(questao.enunciado)) problemas.push(erro(ondeQ, 'Sem enunciado.'));
      const alternativas = Array.isArray(questao.alternativas) ? questao.alternativas.map(texto) : [];
      if (alternativas.length < 2) problemas.push(erro(ondeQ, 'Precisa de pelo menos duas alternativas.'));
      if (new Set(alternativas).size !== alternativas.length) problemas.push(erro(ondeQ, 'Alternativas repetidas.'));
      if (vazio(questao.correta)) problemas.push(erro(ondeQ, 'Não diz qual é a resposta correta.'));
      else if (alternativas.length && !alternativas.includes(texto(questao.correta))) {
        problemas.push(erro(ondeQ, `A resposta correta ("${texto(questao.correta)}") não está entre as alternativas.`));
      }
    });
  });

  const impedimentos = problemas.filter((p) => p.gravidade === 'impede');

  return {
    valido: impedimentos.length === 0,
    problemas,
    impedimentos: impedimentos.length,
    avisos: problemas.length - impedimentos.length,
    previa: {
      metodo: { id: texto(metodo.id), nome: texto(metodo.nome), descricao: texto(metodo.descricao),
        universal, instrumentoIds: [...new Set(instrumentoIds)], fonte: texto(metodo.fonte) },
      versao: texto((dados.versao || {}).rotulo) || '1.0',
      instrumento: instrumento ? { id: texto(instrumento.id), nome: texto(instrumento.nome) } : null,
      fases: fases.length,
      licoes: licoes.length,
      exercicios: exercicios.length,
      jogos: jogos.length,
      avaliacoes: avaliacoes.length,
      questoes: totalDeQuestoes,
      listaDeFases: fases.map((f) => ({
        ordem: Number(f.ordem), titulo: texto(f.titulo),
        licoes: (licoesPorFase.get(texto(f.id)) || []).length,
        jogos: jogos.filter((j) => texto(j.faseId) === texto(f.id)).length,
        questoes: avaliacoes.filter((a) => texto(a.faseId) === texto(f.id))
          .reduce((s, a) => s + (Array.isArray(a.questoes) ? a.questoes.length : 0), 0),
      })).sort((a, b) => a.ordem - b.ordem),
    },
    dados,
  };
}

// ------------------------------------------------------------ importação

// Grava o que a análise aprovou. Recusa-se a rodar se a análise não passou —
// não existe "importar assim mesmo".
function importar(bruto) {
  const analise = analisar(bruto);
  if (!analise.valido) {
    const erro = new Error('O arquivo tem problemas que impedem a importação.');
    erro.analise = analise;
    throw erro;
  }

  const dados = analise.dados;
  const metodo = dados.metodo;
  const criados = { instrumentos: 0, fases: 0, licoes: 0, exercicios: 0, jogos: 0, avaliacoes: 0, questoes: 0 };

  if (dados.instrumento && !R.instrumentos.buscar(texto(dados.instrumento.id))) {
    R.instrumentos.criar({ ...dados.instrumento, id: texto(dados.instrumento.id), ativo: true });
    criados.instrumentos += 1;
  }

  const metodoCriado = R.metodos.criar({
    id: texto(metodo.id),
    nome: texto(metodo.nome),
    descricao: texto(metodo.descricao),
    instrumentoIds: analise.previa.metodo.instrumentoIds,
    universal: analise.previa.metodo.universal,
    porInstrumento: Boolean(metodo.porInstrumento),
    ordem: Number(metodo.ordem) || (R.metodos.contar() + 1),
    fonte: texto(metodo.fonte),
    ativo: true,
  });

  const versao = R.versoes.criar({
    id: `${metodoCriado.id}-${analise.previa.versao}`,
    metodoId: metodoCriado.id,
    rotulo: analise.previa.versao,
    situacao: 'publicada',
    publicadaEm: new Date().toISOString(),
    notas: texto((dados.versao || {}).notas),
    ordem: 1,
  });

  const fasesOrdenadas = [...dados.fases].sort((a, b) => Number(a.ordem) - Number(b.ordem));
  fasesOrdenadas.forEach((fase, i) => {
    R.fases.criar({
      id: texto(fase.id),
      metodoId: metodoCriado.id,
      versaoId: versao.id,
      ordem: Number(fase.ordem),
      titulo: texto(fase.titulo),
      subtitulo: texto(fase.subtitulo),
      resumo: texto(fase.resumo),
      icone: texto(fase.icone) || '🎵',
      cor: texto(fase.cor) || '#2f9e6b',
      paginas: fase.paginas || null,
      anteriorId: i > 0 ? texto(fasesOrdenadas[i - 1].id) : null,
      conteudoRef: texto(fase.conteudoRef),
      notaMinima: Number(fase.notaMinima) || 0,
      ativo: true,
    });
    criados.fases += 1;
  });

  for (const [i, licao] of (dados.licoes || []).entries()) {
    R.licoes.criar({
      id: texto(licao.id) || `${texto(licao.faseId)}-l${i + 1}`,
      faseId: texto(licao.faseId),
      ordem: Number(licao.ordem) || i + 1,
      titulo: texto(licao.titulo),
      pagina: licao.pagina ?? null,
      corpo: texto(licao.corpo),
    });
    criados.licoes += 1;
  }

  for (const [i, exercicio] of (dados.exercicios || []).entries()) {
    R.exercicios.criar({
      id: texto(exercicio.id) || novoId('e'),
      licaoId: texto(exercicio.licaoId) || null,
      faseId: texto(exercicio.faseId) || null,
      ordem: Number(exercicio.ordem) || i + 1,
      titulo: texto(exercicio.titulo),
      enunciado: texto(exercicio.enunciado),
      tipo: texto(exercicio.tipo),
      corpo: texto(exercicio.corpo),
    });
    criados.exercicios += 1;
  }

  for (const [i, jogo] of (dados.jogos || []).entries()) {
    R.jogos.criar({
      id: texto(jogo.id) || `${texto(jogo.faseId)}-j${i + 1}`,
      faseId: texto(jogo.faseId),
      ordem: Number(jogo.ordem) || i + 1,
      tipo: texto(jogo.tipo),
      modo: texto(jogo.modo),
      baralho: texto(jogo.baralho),
      titulo: texto(jogo.titulo),
      descricao: texto(jogo.descricao),
    });
    criados.jogos += 1;
  }

  for (const avaliacao of (dados.avaliacoes || [])) {
    const questoes = Array.isArray(avaliacao.questoes) ? avaliacao.questoes : [];
    const criada = R.avaliacoes.criar({
      id: texto(avaliacao.id) || `av-${texto(avaliacao.faseId)}`,
      faseId: texto(avaliacao.faseId),

    id: idDoAcesso(id), login: atualizado.nome, papel: 'ALUNO',
    ...guardarSenha(SENHA_INICIAL, id), exigeSenha: true, alunoId: id, ativo: true,

  const linhas = R.progressoDeTodasAsFases(alvo);

function registrarTentativa(faseId, tentativa) {
  const alvo = idDoAlunoNaSessao();

  const fase = R.fases.buscar(String(faseId));

// ------------------------------------------------------------- jogo: memória
function jogoMemoria(config, alvo, aoTerminar) {
  const baralho = BARALHOS[config.baralho] || BARALHOS.figuras;
  const rnd = criarAleatorio(novaSemente());
  const cartas = embaralhar(baralho.pares.flatMap(([a, b], i) => [
    { par: i, face: a }, { par: i, face: b },
  ]), rnd);
  let viradas = [];
  let encontrados = 0;
  let jogadas = 0;
  let travado = false;

  alvo.innerHTML = `<p class="instrucao">Toque nas cartas e junte cada par. Quanto menos tentativas, maior a pontuação.</p>
    <div class="placar-jogo"><span id="jogadas">0 tentativas</span><span id="pares">0 de ${baralho.pares.length} pares</span></div>
    <div class="grade-memoria"></div>`;
  const grade = alvo.querySelector('.grade-memoria');

  cartas.forEach((carta, indice) => {
    const botao = criar(`<button class="carta" data-indice="${indice}" aria-label="carta ${indice + 1}">
      <span class="verso">♪</span><span class="frente">${carta.face}</span></button>`);
    botao.addEventListener('click', () => {
      if (travado || botao.classList.contains('aberta') || botao.classList.contains('achada')) return;
      botao.classList.add('aberta');
      viradas.push({ botao, carta });
      if (viradas.length < 2) return;
      jogadas++;
      alvo.querySelector('#jogadas').textContent = `${jogadas} tentativa${jogadas > 1 ? 's' : ''}`;
      const [a, b] = viradas;
      if (a.carta.par === b.carta.par) {
        a.botao.classList.add('achada');
        b.botao.classList.add('achada');
        encontrados++;
        efeito('acerto');
        alvo.querySelector('#pares').textContent = `${encontrados} de ${baralho.pares.length} pares`;
        viradas = [];
        if (encontrados === baralho.pares.length) {
          efeito('vitoria');
          const pontos = Math.max(20, 100 - Math.max(0, jogadas - baralho.pares.length) * 8);
          aoTerminar(pontos, `${jogadas} tentativas para ${baralho.pares.length} pares`);
        }
      } else {
        travado = true;
        setTimeout(() => {
          a.botao.classList.remove('aberta');
          b.botao.classList.remove('aberta');
          viradas = [];
          travado = false;
        }, 750);
      }
    });
    grade.appendChild(botao);
  });
}

// -------------------------------------------------- jogo: leitura no pentagrama
function jogoPentagrama(config, alvo, aoTerminar) {
  const claves = config.claves || ['sol'];
  const rnd = criarAleatorio(novaSemente());
  const segundos = 60;
  let restante = segundos;
  let acertos = 0;
  let erros = 0;
  let atual = null;

  alvo.innerHTML = `<p class="instrucao">Diga o nome da nota antes que o tempo acabe.</p>
    <div class="placar-jogo"><span id="relogio">${segundos}s</span><span id="pontos">0 acertos</span></div>
    <div class="palco"></div><div class="botoes-notas"></div>`;
  const palco = alvo.querySelector('.palco');
  const botoes = alvo.querySelector('.botoes-notas');

  const sortearNota = () => {
    const clave = sortear(claves, rnd);
    const posicao = inteiro(rnd, -1, 10);
    const nota = T.notaDaPosicao(clave, posicao);
    atual = { clave, nota };
    palco.innerHTML = `<div class="etiqueta-clave">${T.CLAVES[clave].nome}</div>
      ${pentagrama({ clave, notas: [{ ...nota, figura: 'semibreve' }], largura: 280 })}`;
  };

  T.LETRAS.forEach((letra) => {
    const botao = criar(`<button class="botao-nota">${letra}</button>`);
    botao.addEventListener('click', () => {
      if (restante <= 0) return;
      if (letra === atual.nota.letra) {
        acertos++;
        efeito('acerto');
        botao.classList.add('certo');
        tocarNota(atual.nota.letra, atual.nota.oitava);
      } else {
        erros++;
        efeito('erro');
        botao.classList.add('errado');
      }
      setTimeout(() => botao.classList.remove('certo', 'errado'), 250);
      alvo.querySelector('#pontos').textContent = `${acertos} acerto${acertos === 1 ? '' : 's'}`;
      sortearNota();
    });
    botoes.appendChild(botao);
  });

  sortearNota();
  const relogio = setInterval(() => {
    restante--;
    alvo.querySelector('#relogio').textContent = `${restante}s`;
    if (restante <= 0) {
      clearInterval(relogio);
      efeito('vitoria');
      aoTerminar(Math.max(0, acertos * 8 - erros * 4), `${acertos} acertos e ${erros} erros em 1 minuto`);
    }
  }, 1000);
  alvo.dataset.limpar = 'sim';
  alvo._parar = () => clearInterval(relogio);
}

// ------------------------------------------------------- jogo: fecha o compasso
function jogoRitmo(config, alvo, aoTerminar) {
  const rnd = criarAleatorio(novaSemente());
  const formulas = config.composto ? ['6/8', '9/8', '12/8'] : ['2/4', '3/4', '4/4'];
  const paleta = config.comPonto
    ? ['seminima', 'seminima.', 'minima', 'minima.', 'colcheia', 'colcheia.', 'semicolcheia']
    : ['semibreve', 'minima', 'seminima', 'colcheia', 'semicolcheia'];
  const rodadasTotais = 5;
  let rodada = 0;
  let acertos = 0;
  let erros = 0;
  let escritas = [];
  let alvoTempos = 0;
  let formula = '';

  const valorDe = (id) => {
    const pontuada = id.endsWith('.');
    const base = T.figuraPorId(pontuada ? id.slice(0, -1) : id);
    return pontuada ? base.duracao * 1.5 : base.duracao;
  };
  const soma = () => escritas.reduce((total, id) => total + valorDe(id), 0);

  alvo.innerHTML = `<p class="instrucao">Escolha as figuras que fecham o compasso exatamente — sem sobrar nem faltar.</p>
    <div class="placar-jogo"><span id="rodada">Rodada 1 de ${rodadasTotais}</span><span id="soma"></span></div>
    <div class="palco"></div>
    <div class="paleta-figuras"></div>
    <div class="acoes-jogo">
      <button class="botao secundario" id="desfazer">Apagar a última</button>
      <button class="botao" id="conferir">Conferir</button>
    </div>`;
  const palco = alvo.querySelector('.palco');
  const paletaEl = alvo.querySelector('.paleta-figuras');

  const desenhar = () => {
    palco.innerHTML = pentagrama({
      clave: 'sol', compasso: formula, largura: 320,
      notas: escritas.map((id) => ({
        letra: 'Si', oitava: 4, figura: id.endsWith('.') ? id.slice(0, -1) : id, pontuada: id.endsWith('.'),
      })),
    });
    alvo.querySelector('#soma').textContent = `${T.fracaoBonita(soma())} de ${T.fracaoBonita(alvoTempos)}`;
  };

  const novaRodada = () => {
    rodada++;
    if (rodada > rodadasTotais) {
      efeito('vitoria');
      aoTerminar(Math.max(0, acertos * 20 - erros * 5), `${acertos} de ${rodadasTotais} compassos fechados`);
      return;
    }
    formula = sortear(formulas, rnd);
    const [cima, baixo] = formula.split('/').map(Number);
    alvoTempos = cima * T.FIGURAS.find((f) => f.equivalencia === baixo).duracao;
    escritas = [];
    alvo.querySelector('#rodada').textContent = `Rodada ${rodada} de ${rodadasTotais}`;
    desenhar();
  };

  paleta.forEach((id) => {
    const pontuada = id.endsWith('.');
    const base = pontuada ? id.slice(0, -1) : id;
    const botao = criar(`<button class="botao-figura" title="${T.figuraPorId(base).nome}${pontuada ? ' pontuada' : ''}">
      ${figuraSolta(base, { pontuada, tamanho: 46 })}</button>`);
    botao.addEventListener('click', () => {
      if (soma() + valorDe(id) > alvoTempos + 1e-9) {
        efeito('erro');
        botao.classList.add('errado');
        setTimeout(() => botao.classList.remove('errado'), 250);
        return;
      }
      escritas.push(id);
      tocarNota('Si', 4, { duracao: Math.min(0.5, valorDe(id) * 0.4) });
      desenhar();
    });
    paletaEl.appendChild(botao);
  });

  alvo.querySelector('#desfazer').addEventListener('click', () => { escritas.pop(); desenhar(); });
  alvo.querySelector('#conferir').addEventListener('click', () => {
    if (Math.abs(soma() - alvoTempos) < 1e-9) { acertos++; efeito('acerto'); } else { erros++; efeito('erro'); }
    novaRodada();
  });

  novaRodada();
}

// ------------------------------------------------------------- jogo: teclado
function jogoTeclado(config, alvo, aoTerminar) {
  const rnd = criarAleatorio(novaSemente());
  const rodadasTotais = config.modo === 'escala' ? 3 : 8;
  let rodada = 0;
  let acertos = 0;
  let erros = 0;
  let esperado = [];
  let passo = 0;
  let baseAtual = null;

  alvo.innerHTML = `<p class="instrucao"></p>
    <div class="placar-jogo"><span id="rodada"></span><span id="pontos">0 acertos</span></div>
    <div class="quadro-teclado"></div>`;
  const quadro = alvo.querySelector('.quadro-teclado');
  const instrucao = alvo.querySelector('.instrucao');

  const chaveDaNota = (n) => {
    const semitom = T.semitomDaNota(n);
    const brancas = { 0: 'Dó', 2: 'Ré', 4: 'Mi', 5: 'Fá', 7: 'Sol', 9: 'Lá', 11: 'Si' };
    const pretas = { 1: 'Dó#', 3: 'Ré#', 6: 'Fá#', 8: 'Sol#', 10: 'Lá#' };
    return { nome: brancas[semitom] || pretas[semitom], semitom };
  };

  const desenhar = (marcadas = {}) => {
    quadro.innerHTML = teclado({ oitavas: 1, marcadas, interativo: true });
    quadro.querySelectorAll('[data-tecla]').forEach((tecla) => {
      tecla.addEventListener('click', () => responder(tecla.dataset.tecla, tecla));
    });
  };

  const novaRodada = () => {
    rodada++;
    if (rodada > rodadasTotais) {
      efeito('vitoria');
      aoTerminar(Math.max(0, acertos * Math.round(100 / rodadasTotais) - erros * 5), `${acertos} de ${rodadasTotais}`);
      return;
    }
    alvo.querySelector('#rodada').textContent = `Rodada ${rodada} de ${rodadasTotais}`;
    passo = 0;
    if (config.modo === 'escala') {
      const tonalidade = sortear(T.TONALIDADES.filter((t) => t.acidentes <= 4 && t.tipo !== 'bemol'), rnd);
      baseAtual = null;
      const notas = T.escala(tonalidade.maior).slice(0, 8);
      esperado = notas.map((n, i) => ({ ...chaveDaNota(n), oitava: i === 7 ? 5 : 4 }));
      instrucao.innerHTML = `Toque a escala de <b>${T.nomeDaNota(tonalidade.maior)} Maior</b>, do 1º ao 8º grau, seguindo T&nbsp;T&nbsp;st&nbsp;T&nbsp;T&nbsp;T&nbsp;st.`;
    } else if (config.modo === 'semitom') {
      const base = sortear(T.LETRAS, rnd);
      baseAtual = base;
      const acima = rnd() > 0.5;
      const semitom = (T.SEMITONS_DA_LETRA[T.LETRAS.indexOf(base)] + (acima ? 1 : 11)) % 12;
      esperado = [{ nome: chaveDaNota({ letra: base, alteracao: acima ? 1 : -1 }).nome, semitom, oitava: 4 }];
      esperado[0].semitom = semitom;
      instrucao.innerHTML = `Toque a tecla <b>um semitom ${acima ? 'acima' : 'abaixo'}</b> de <b>${base}</b>.`;
    } else {
      const base = sortear(T.LETRAS, rnd);
      baseAtual = base;
      const opcoes = [['2ª maior', 2], ['3ª maior', 4], ['3ª menor', 3], ['4ª justa', 5], ['5ª justa', 7], ['8ª justa', 12]];
      const [nome, distancia] = sortear(opcoes, rnd);
      const semitom = (T.SEMITONS_DA_LETRA[T.LETRAS.indexOf(base)] + distancia) % 12;
      esperado = [{ nome, semitom, oitava: distancia === 12 ? 5 : 4 }];
      instrucao.innerHTML = `Partindo de <b>${base}</b>, toque a nota que fica uma <b>${nome}</b> acima.`;
    }
    desenhar(baseAtual ? { [`${baseAtual}4`]: 'tonica' } : {});
  };

  const semitomDaTecla = (chave) => {
    const nome = chave.replace(/\d+$/, '');
    const tabela = { 'Dó': 0, 'Dó#': 1, 'Ré': 2, 'Ré#': 3, 'Mi': 4, 'Fá': 5, 'Fá#': 6, 'Sol': 7, 'Sol#': 8, 'Lá': 9, 'Lá#': 10, 'Si': 11 };
    return tabela[nome];
  };

  function responder(chave, tecla) {
    const semitom = semitomDaTecla(chave);
    const oitava = Number(chave.slice(-1));
    const alvoAtual = esperado[passo];
    const certo = semitom === alvoAtual.semitom && (config.modo !== 'escala' || oitava === alvoAtual.oitava);
    if (certo) {
      tecla.classList.add('marcada', 'certa');
      tocarFrequencia(440 * Math.pow(2, (semitom - 9 + (oitava - 4) * 12) / 12), { duracao: 0.4 });
      passo++;
      if (passo >= esperado.length) {
        acertos++;
        efeito('acerto');
        alvo.querySelector('#pontos').textContent = `${acertos} acerto${acertos === 1 ? '' : 's'}`;
        setTimeout(novaRodada, 500);
      }
    } else {
      erros++;
      efeito('erro');
      tecla.classList.add('errada');
      setTimeout(() => tecla.classList.remove('errada'), 300);
    }
  }

  novaRodada();
}

// --------------------------------------------------------------- jogo: ouvido
function jogoOuvido(config, alvo, aoTerminar) {
  const rnd = criarAleatorio(novaSemente());
  const rodadasTotais = 8;
  let rodada = 0;
  let acertos = 0;
  let resposta = null;

  const opcoes = config.modo === 'intensidade'
    ? ['crescendo', 'diminuendo', 'sempre igual']
    : ['subiu', 'desceu', 'ficou igual'];

  alvo.innerHTML = `<p class="instrucao">${config.modo === 'intensidade'
    ? 'Ouça as três notas e diga o que aconteceu com a intensidade.'
    : 'Ouça as duas notas e diga o que aconteceu com a altura.'}</p>
    <div class="placar-jogo"><span id="rodada"></span><span id="pontos">0 acertos</span></div>
    <div class="acoes-jogo"><button class="botao" id="tocar">▶ Ouvir de novo</button></div>
    <div class="botoes-notas" id="opcoes"></div>`;

  const tocar = () => {
    if (config.modo === 'intensidade') {
      const volumes = resposta === 'crescendo' ? [0.06, 0.16, 0.3] : resposta === 'diminuendo' ? [0.3, 0.16, 0.06] : [0.2, 0.2, 0.2];
      volumes.forEach((volume, i) => tocarFrequencia(frequencia('Sol', 4), { duracao: 0.45, volume, atraso: i * 0.55 }));
    } else {
      const base = inteiro(rnd, 0, 6);
      const segunda = resposta === 'ficou igual' ? base : resposta === 'subiu' ? Math.min(6, base + inteiro(rnd, 1, 4)) : Math.max(0, base - inteiro(rnd, 1, 4));
      const ajustado = segunda === base && resposta !== 'ficou igual' ? (resposta === 'subiu' ? base + 1 : base - 1) : segunda;
      tocarSequencia([
        frequencia(T.LETRAS[base], 4), frequencia(T.LETRAS[(ajustado + 7) % 7], ajustado > 6 ? 5 : ajustado < 0 ? 3 : 4),
      ], { intervalo: 0.7, duracao: 0.6 });
    }
  };

  const novaRodada = () => {
    rodada++;
    if (rodada > rodadasTotais) {
      efeito('vitoria');
      aoTerminar(Math.round((acertos / rodadasTotais) * 100), `${acertos} de ${rodadasTotais} de ouvido`);
      return;
    }
    alvo.querySelector('#rodada').textContent = `Rodada ${rodada} de ${rodadasTotais}`;
    resposta = sortear(opcoes, rnd);
    setTimeout(tocar, 350);
  };

  alvo.querySelector('#tocar').addEventListener('click', tocar);
  const caixa = alvo.querySelector('#opcoes');
  opcoes.forEach((opcao) => {
    const botao = criar(`<button class="botao-nota largo">${opcao}</button>`);
    botao.addEventListener('click', () => {
      if (opcao === resposta) { acertos++; efeito('acerto'); botao.classList.add('certo'); } else { efeito('erro'); botao.classList.add('errado'); }
      alvo.querySelector('#pontos').textContent = `${acertos} acerto${acertos === 1 ? '' : 's'}`;
      setTimeout(() => { botao.classList.remove('certo', 'errado'); novaRodada(); }, 500);
    });
    caixa.appendChild(botao);
  });

  novaRodada();
}

// ---------------------------------------------------------------- jogo: pulso
function jogoPulso(config, alvo, aoTerminar) {
  const compasso = config.compasso || '4/4';
  const porCompasso = compasso === '6/8' ? 2 : Number(compasso.split('/')[0]);
  const bpm = inteiro(criarAleatorio(novaSemente()), 60, 120);
  const metronomo = new Metronomo({ bpm, porCompasso });
  const batidas = [];
  const toques = [];
  let rodando = false;

  alvo.innerHTML = `<p class="instrucao">Ligue o metrônomo (${bpm} bpm, compasso ${compasso}) e toque no círculo junto com cada batida.
    Depois de 16 toques o app mostra a sua precisão.</p>
    <div class="placar-jogo"><span id="toques">0 toques</span><span id="desvio">—</span></div>
    <div class="acoes-jogo"><button class="botao" id="ligar">▶ Ligar metrônomo</button></div>
    <button class="alvo-pulso" id="bater">TOQUE<br><span>aqui</span></button>`;

  metronomo.aoBater = (numero, forte, quando) => {
    batidas.push(quando);
    const bola = alvo.querySelector('#bater');
    bola.classList.add(forte ? 'forte' : 'fraco');
    setTimeout(() => bola.classList.remove('forte', 'fraco'), 120);
  };

  alvo.querySelector('#ligar').addEventListener('click', (evento) => {
    rodando = !rodando;
    if (rodando) { metronomo.comecar(); evento.target.textContent = '■ Parar'; } else { metronomo.parar(); evento.target.textContent = '▶ Ligar metrônomo'; }
  });

  alvo.querySelector('#bater').addEventListener('click', () => {
    if (!rodando) return;
    const agora = (window.performance.now() / 1000);
    toques.push(agora);
    alvo.querySelector('#toques').textContent = `${toques.length} toques`;
    if (toques.length >= 16) {
      metronomo.parar();
      rodando = false;
      // Precisão medida pela regularidade dos intervalos entre os toques.
      const intervalos = toques.slice(1).map((t, i) => t - toques[i]);
      const media = intervalos.reduce((a, b) => a + b, 0) / intervalos.length;
      const desvio = intervalos.reduce((a, b) => a + Math.abs(b - media), 0) / intervalos.length;
      const bpmDoAluno = Math.round(60 / media);
      const erroBpm = Math.abs(bpmDoAluno - bpm);
      const pontos = Math.max(0, Math.round(100 - desvio * 400 - erroBpm * 3));
      alvo.querySelector('#desvio').textContent = `${bpmDoAluno} bpm`;
      efeito(pontos > 60 ? 'vitoria' : 'erro');
      aoTerminar(pontos, `você bateu a ${bpmDoAluno} bpm (o metrônomo estava em ${bpm}), com oscilação média de ${Math.round(desvio * 1000)} ms`);
    }
  });

  alvo._parar = () => metronomo.parar();
}

    }
    alvo.querySelector('#rodada').textContent = `Rodada ${rodada} de ${rodadasTotais}`;

    const erradas = embaralhar(T.TONALIDADES.filter((t) => T.nomeDaTonalidade(t, 'maior') !== correta), rnd)
      .slice(0, 3).map((t) => T.nomeDaTonalidade(t, 'maior'));
    caixa.innerHTML = '';
    embaralhar([correta, ...erradas], rnd).forEach((opcao) => {
      const botao = criar(`<button class="botao-nota largo">${opcao}</button>`);
      botao.addEventListener('click', () => {
        if (opcao === correta) { acertos++; efeito('acerto'); botao.classList.add('certo'); } else { efeito('erro'); botao.classList.add('errado'); }
        alvo.querySelector('#pontos').textContent = `${acertos} acerto${acertos === 1 ? '' : 's'}`;
        setTimeout(novaRodada, 500);
      });
      caixa.appendChild(botao);
    });
  };

  novaRodada();
}

const JOGOS = {
  memoria: jogoMemoria,
  pentagrama: jogoPentagrama,

__modulos['plataforma'] = (function () {
// Ponte com a plataforma.
//
// O app de estudo nasceu para rodar sozinho, com cadastro próprio no aparelho.
// Servido DENTRO da plataforma, ele não pode ter cadastro próprio: a regra da
// casa é que ninguém entra sem ter sido cadastrado por alguém com permissão.
//
// Então, quando a página injeta `window.__PLATAFORMA__`, este módulo:
//   • adota a identidade já autenticada no servidor;
//   • preenche a ficha com o que o cadastro da plataforma tem, sem perguntar
//     de novo o que a instituição já sabe;
//   • e desliga as telas de entrar, cadastrar e trocar de aluno.
//
// Sem a injeção, nada muda: o app continua funcionando sozinho, offline.

const CHAVE_DO_VINCULO = 'msa.plataforma.vinculo';

const dadosDaPlataforma = () =>
  (typeof window === 'undefined' ? null : window.__PLATAFORMA__ ?? null);

const integrado = () => Boolean(dadosDaPlataforma());

function lerVinculo() {
  try {
    return JSON.parse(localStorage.getItem(CHAVE_DO_VINCULO) || '{}');
  } catch {
    return {};
  }
}

function gravarVinculo(vinculo) {
  try {
    localStorage.setItem(CHAVE_DO_VINCULO, JSON.stringify(vinculo));
  } catch {
    // Aparelho sem armazenamento local: o estudo desta sessão não persiste,
    // e o app já lida com isso em outros pontos.
  }
}

/**
 * Liga o usuário da plataforma a um aluno local, criando-o na primeira vez.
 * O mesmo aparelho pode ser usado por mais de uma pessoa: cada uma ganha o seu
 * progresso, e a chave do vínculo é o identificador do servidor.
 */
function adotar(banco) {
  const dados = dadosDaPlataforma();
  if (!dados) return null;

  const vinculo = lerVinculo();
  const ficha = { nome: dados.nome, ...(dados.ficha || {}) };
  let usuario = vinculo[dados.id] ? banco.usuarioPorId(vinculo[dados.id]) : null;

  if (usuario) {
    // O cadastro da plataforma é a fonte: o que mudou lá vale aqui.
    try {
      banco.atualizarUsuario(usuario.id, ficha);
    } catch {
      // Nome repetido por outro aluno no mesmo aparelho: mantém o que já está.
    }
    usuario = banco.usuarioPorId(usuario.id);
  } else {
    usuario = criarSemColidir(banco, ficha);
    vinculo[dados.id] = usuario.id;
    gravarVinculo(vinculo);
  }

  banco.abrirSessaoDoAluno(usuario.id);
  return usuario;
}

/** Dois alunos com o mesmo nome no mesmo aparelho: o segundo ganha um sufixo. */
function criarSemColidir(banco, ficha) {
  try {
    return banco.criarUsuario(ficha);
  } catch (erro) {
    if (!/Já existe um aluno/.test(String(erro && erro.message))) throw erro;
    for (let n = 2; n < 50; n++) {
      try {
        return banco.criarUsuario({ ...ficha, nome: `${ficha.nome} (${n})` });
      } catch {
        // tenta o próximo sufixo
      }
    }
    throw erro;
  }
}

/** Rotas que deixam de existir quando o app roda dentro da plataforma. */
const ROTAS_DA_PLATAFORMA = new Set(['entrar', 'cadastrar', 'instrutor', 'sair', 'ficha', 'senha']);

const rotaDesligada = (primeiraParte) => integrado() && ROTAS_DA_PLATAFORMA.has(primeiraParte);

/** Para onde o "Sair" aponta: quem manda na sessão é o servidor. */
const enderecoDeSaida = () => (dadosDaPlataforma() || {}).sair || '/sair';

/** Endereço de volta para o resto da plataforma. */
const enderecoDeVolta = () => (dadosDaPlataforma() || {}).voltar || '/aluno';

return { dadosDaPlataforma, integrado, adotar, rotaDesligada, enderecoDeSaida, enderecoDeVolta };
})();

const numeroDoCampo = (id, padrao = 0) => {
  const bruto = Number(valor(id));
  return Number.isFinite(bruto) ? bruto : padrao;
};

const valoresDaFase = () => ({
  titulo: valor('fase-titulo').trim(),
  subtitulo: valor('fase-subtitulo').trim(),
  resumo: valor('fase-resumo').trim(),
  paginas: valor('fase-paginas').trim(),
  notaMinima: Math.min(100, Math.max(1, numeroDoCampo('fase-nota', NOTA_MINIMA))),
});

const valoresDaTurma = () => ({
  nome: valor('turma-nome').trim(),
  metodoId: valor('turma-metodo'),
  comum: valor('turma-comum').trim(),
  responsavel: valor('turma-responsavel').trim(),
  criterio: {
    notaMinima: Math.min(100, Math.max(1, numeroDoCampo('criterio-nota', NOTA_MINIMA))),
    fasesParaConcluir: Math.max(0, numeroDoCampo('criterio-fases', 0)),
    licoesObrigatorias: marcado('criterio-licoes'),
    mediaMinima: Math.min(100, Math.max(0, numeroDoCampo('criterio-media', 0))),
  },
});

// Abrir um PDF guardado: o endereço temporário vale enquanto a aba viver, e é
// solto depois — um endereço de blob esquecido segura o arquivo na memória.
function abrirMaterial(idDoMaterial) {
  arquivos.endereco(idDoMaterial).then((endereco) => {
    if (!endereco) { avisar('Este material não está mais guardado neste aparelho.', 'erro'); desenhar(); return; }
    window.open(endereco, '_blank', 'noopener');
    setTimeout(() => URL.revokeObjectURL(endereco), 60000);
  }).catch((erro) => { avisar(erro.message, 'erro'); desenhar(); });
}

const valoresDoPedido = () => {
  const dados = {};
  for (const campo of CAMPOS_DO_PEDIDO) dados[campo.id] = valor(`campo-${campo.id}`);
  return dados;
};

// Tudo o que estiver na tela agora, seja qual for o formulário aberto. Só
// entram os campos que existem — trocar de perfil não apaga o que foi escrito
// nem inventa campos em branco por cima do que já estava guardado.
function valoresDigitados() {
  const dados = {};
  for (const campo of [...CAMPOS_DA_FICHA, ...CAMPOS_DO_PEDIDO]) {
    const elemento = document.getElementById(`campo-${campo.id}`);
    if (elemento) dados[campo.id] = elemento.value;
  }
  return dados;
}

let rascunho = null; // o que o aluno digitou, para não se perder quando dá erro

const EMAIL_SIMPLES = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

// ================================================================= entrada
// O que a pessoa digitou no campo de usuário, para não sumir quando a senha
// erra: digitar o nome completo de novo, no celular, cansa.
let loginTentado = '';

function telaEntrada() {
  return `<section class="entrada">
    <div class="marca">🎼</div>
    <h1>Estudo Musical<br><span>fase a fase</span></h1>
    <p class="sub">Teoria do <b>MSA</b> e método do <b>seu instrumento</b>, com avaliação que nunca repete
    pergunta e certificado a cada fase.</p>
    ${mostrarRecado()}
    <form class="login" id="forma-entrar" autocomplete="on" onsubmit="return false">
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" type="text" class="campo" autocomplete="username"
        autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="seu nome completo"
        value="${escapar(loginTentado)}">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" class="campo" autocomplete="current-password"
        placeholder="sua senha">
      <button class="botao grande" data-acao="entrar" type="submit">Entrar</button>
    </form>
    <p class="mini centro">O aluno entra com o <b>nome completo</b> do cadastro dele.

    ${banco.permiteAutocadastro()
      ? '<div class="acoes"><a class="botao secundario" href="#/cadastrar">Ainda não tenho cadastro</a></div>'
      : '<p class="mini centro">Só o instrutor cadastra alunos neste aparelho.</p>'}
    <p class="mini centro">Tudo fica guardado só neste aparelho, sem servidor e sem internet.</p>
  </section>`;
}

// Trocar a senha da própria conta — serve ao aluno e ao instrutor, e é para
// onde aponta o aviso de senha de fábrica.
function telaTrocarMinhaSenha() {
  if (!banco.sessao()) return telaEntrada();
  return `${cabecalho('Trocar a minha senha', banco.ehDaEquipe() ? '#/instrutor' : '#/')}
    <section class="formulario">
      ${mostrarRecado()}
      <p>O seu usuário é <b>${escapar(banco.loginDaSessao())}</b>.</p>
      <label for="senha-atual">Senha atual</label>
      <input id="senha-atual" type="password" class="campo" autocomplete="current-password">
      <label for="senha">Nova senha</label>
      <input id="senha" type="password" class="campo" autocomplete="new-password">
      <label for="senha2">Repita a nova senha</label>
      <input id="senha2" type="password" class="campo" autocomplete="new-password">
      <button class="botao grande" data-acao="trocar-minha-senha">Salvar nova senha</button>
    </section>`;
}

// Quem se apresenta como aluno entra na hora e começa a estudar. Quem se
// apresenta como instrutor, encarregado ou ministério não entra sozinho: o
// cadastro vira um pedido, e o master decide. É a regra da casa — ninguém
// alcança a turma inteira sem alguém ter deixado.
const PERFIS_DO_CADASTRO = [
  { id: 'ALUNO', rotulo: 'Aluno', explica: 'Vou estudar pelo método. Começo agora mesmo.' },
  { id: 'INSTRUTOR', rotulo: 'Instrutor', explica: 'Ensino e acompanho a turma. Preciso de liberação.' },
  { id: 'ENCARREGADO', rotulo: 'Encarregado', explica: 'Acompanho os músicos da comum. Preciso de liberação.' },
  { id: 'MINISTERIO', rotulo: 'Ministério', explica: 'Acompanho como o trabalho vai. Preciso de liberação.' },
];

// O perfil marcado agora, lido da tela. O rascunho não serve para isto: ele é
// limpo logo depois de cada desenho, e o radio marcado continua onde está.
const perfilEscolhido = () => {
  const marcado = document.querySelector('input[name="perfil"]:checked');
  return marcado ? marcado.value : 'ALUNO';
};

function seletorDePerfil(escolhido = 'ALUNO') {
  return `<h2 class="titulo-grupo">Eu sou</h2>
    <div class="perfis">
      ${PERFIS_DO_CADASTRO.map((perfil) => `<label class="perfil ${perfil.id === escolhido ? 'escolhido' : ''}">
        <input type="radio" name="perfil" value="${perfil.id}" data-perfil
          ${perfil.id === escolhido ? 'checked' : ''}>
        <span><strong>${escapar(perfil.rotulo)}</strong><small>${escapar(perfil.explica)}</small></span>
      </label>`).join('')}
    </div>`;
}

function telaCadastro() {
  const dados = rascunho || {};
  const erros = dados.erros || {};
  const perfil = dados.perfil || 'ALUNO';
  const comoAluno = perfil === 'ALUNO';

  if (comoAluno && !banco.permiteAutocadastro()) {
    return `${cabecalho('Cadastro', '#/sair')}
      ${mostrarRecado()}
      <section class="formulario">
        ${seletorDePerfil(perfil)}
        <p class="aviso">O administrador desligou o autocadastro de alunos neste aparelho.
        Peça a ele para criar o seu acesso.</p>
        <a class="botao secundario" href="#/sair">Voltar</a>
      </section>`;
  }

  return `${cabecalho('Primeiro acesso', '#/sair')}
    <section class="formulario">
      ${mostrarRecado()}
      ${seletorDePerfil(perfil)}
      ${comoAluno
        ? `<p>Preencha a sua ficha para começar. Estes dados ficam <b>só neste aparelho</b> e servem para o
           instrutor organizar a turma.</p>
           ${camposDaFicha(dados, erros, { ministerioPendente: dados.ministerioPendente })}
           ${camposDeSenha()}
           <button class="botao grande" data-acao="criar-aluno">Criar cadastro e começar</button>`
        : `<p>O acesso de <b>${escapar(NOME_DO_PAPEL[perfil])}</b> alcança a turma inteira, e por isso não é
           dado automaticamente: o seu pedido fica guardado até o administrador liberar. A senha que você
           escolher agora é a que vai valer quando isso acontecer.</p>
           ${camposDoPedido(dados, erros)}
           ${camposDeSenha()}
           <button class="botao grande" data-acao="pedir-acesso">Enviar pedido de acesso</button>`}
      <a class="botao secundario" href="#/sair">Cancelar</a>
    </section>`;
}

// O pedido de acesso pede menos que a ficha do aluno: nome, comum e contato.
// Instrumento, encarregados e ancião são da vida de quem estuda, não de quem
// ensina — pedi-los aqui seria papelada por papelada.
const CAMPOS_DO_PEDIDO = [
  { id: 'nome', rotulo: 'Nome completo', tipo: 'text', dica: 'como o administrador vai te reconhecer' },
  { id: 'comum', rotulo: 'Comum-congregação', tipo: 'text', dica: 'bairro e cidade' },
  { id: 'email', rotulo: 'E-mail', tipo: 'email' },
  { id: 'whatsapp', rotulo: 'WhatsApp', tipo: 'tel', dica: 'com DDD' },
  { id: 'observacao', rotulo: 'Quem pode confirmar quem você é', tipo: 'text',
    dica: 'opcional — o nome de quem o administrador pode perguntar' },
];

function camposDoPedido(valores = {}, erros = {}) {
  return `<h2 class="titulo-grupo">Seus dados</h2>
    ${CAMPOS_DO_PEDIDO.map((campo) => {
      const erro = erros[campo.id];
      return `<label for="campo-${campo.id}">${escapar(campo.rotulo)}</label>
        <input id="campo-${campo.id}" type="${campo.tipo}" class="campo${erro ? ' com-erro' : ''}"
          value="${escapar(valores[campo.id] || '')}" maxlength="80"
          ${campo.tipo === 'tel' ? 'inputmode="tel" data-mascara="whatsapp" placeholder="(11) 91234-5678"' : ''}>
        ${erro ? `<p class="erro-campo">${escapar(erro)}</p>`
          : campo.dica ? `<p class="mini">${escapar(campo.dica)}</p>` : ''}`;
    }).join('')}`;
}

// Quem entrou antes de a ficha existir (ou cadastrado pelo instrutor sem todos
// os campos) completa aqui antes de estudar.
function telaFicha() {
  const aluno = banco.alunoAtual();
  if (!aluno) return telaEntrada();
  const dados = rascunho || { ...aluno };
  const erros = dados.erros || {};
  const faltando = camposFaltando(aluno);
  return `${cabecalho('Complete a sua ficha', '#/sair')}
    <section class="formulario">
      ${mostrarRecado()}
      <p>Antes de começar a estudar, precisamos de ${faltando.length === 1 ? 'mais um dado' : `mais ${faltando.length} dados`}.
      Fica tudo <b>só neste aparelho</b>.</p>
      ${camposDaFicha(dados, erros, { ministerioPendente: dados.ministerioPendente })}
      <button class="botao grande" data-acao="salvar-ficha" data-id="${aluno.id}">Salvar e começar</button>
      <a class="botao secundario" href="#/sair">Sair</a>
    </section>`;
}

// ================================================================== painel
// Conferência do cadastro: o que está incompleto e de onde vieram os dados.
// Nada aqui trava o uso do app — é a lista do que ainda falta conferir, mais o
// registro da atualização (de onde os dados vieram e onde ficou a cópia).
function blocoDeConferencia() {
  const pendencias = banco.pendenciasDoCadastro();
  const migracao = banco.informacoesDaMigracao();

  const nomeDoRegistro = (p) => {
    if (p.entidade === 'alunos') {
      const aluno = banco.usuarioPorId(p.id);
      return aluno ? aluno.nome : p.id;
    }
    return p.id || '—';
  };

  const lista = pendencias.length
    ? `<ul class="lista-chave">${pendencias.slice(0, 20).map((p) => `<li><b>${escapar(nomeDoRegistro(p))}</b> — ${escapar(p.mensagem)}</li>`).join('')}
       ${pendencias.length > 20 ? `<li class="mini">e mais ${pendencias.length - 20}.</li>` : ''}</ul>`
    : '<p class="mini">Nada pendente de conferência.</p>';

  const origem = migracao && migracao.origem
    ? `<p class="mini">Os dados deste aparelho vieram da versão anterior do aplicativo
       (${escapar(migracao.origem)}), em ${data(migracao.migradoEm)}, com ${migracao.registros} registros.
       ${migracao.backup ? `A cópia de segurança de antes da atualização ficou guardada como
       <code>${escapar(migracao.backup)}</code>, e os dados antigos continuam no aparelho, intactos.` : ''}</p>`
    : '<p class="mini">Cadastro criado nesta versão do aplicativo.</p>';

  return `<h2 class="titulo-secao">Conferência</h2>
    <section class="sobre">
      <h2 class="titulo-secao">Pendente de conferência${pendencias.length ? ` (${pendencias.length})` : ''}</h2>
      ${lista}
      <h2 class="titulo-secao">De onde vêm estes dados</h2>
      ${origem}
    </section>`;
}

// O filtro da lista de alunos vive fora do desenho para sobreviver ao
// redesenho da tela — quem digitou uma busca não a perde ao clicar num filtro.
let filtroDeAlunos = { texto: '', situacao: '', instrumento: '' };

function linhaDeAluno(linha, situacao) {
  const u = linha.aluno;
  const incompleta = camposFaltando(banco.usuarioPorId(u.id) || u).length;
  return `<a class="cartao-aluno painel" href="#/instrutor/aluno/${u.id}">
    <span class="inicial" aria-hidden="true">${escapar(u.nome.trim().charAt(0).toUpperCase())}</span>
    <span class="dados">
      <strong>${escapar(u.nome)}</strong>
      <small>${escapar(linha.instrumento || 'sem instrumento')}${linha.tituloDaFase
        ? ` · Fase ${linha.fase} — ${escapar(linha.tituloDaFase)}` : ''}</small>
      ${barra(linha.percentual, `Progresso de ${u.nome}`)}
      <small>${linha.percentual}% · ${linha.concluidas} de ${linha.total} fases · última atividade ${data(linha.ultimaAtividade)}</small>
      ${incompleta ? '<small class="pendente">ficha incompleta</small>' : ''}
    </span>
    <span class="situacao ${situacao.chave}">
      <span aria-hidden="true">${situacao.icone}</span>
      <small>${escapar(situacao.texto)}</small>
    </span>
  </a>`;
}

function blocoDeAlertas() {
  const lista = alertas.doInstrutor({ limite: 12 });
  if (!lista.length) return '';
  const rotulo = { atencao: 'Atenção', aviso: 'Acompanhar', boa: 'Boa notícia' };
  return `<h2 class="titulo-secao">O que precisa de você</h2>
    <div class="lista-alertas">
      ${lista.map((a) => `<a class="cartao-alerta ${a.gravidade}" href="#/instrutor/aluno/${a.alunoId}">
        <span class="etiqueta">${rotulo[a.gravidade]}</span>
        <span>${escapar(a.texto)}</span>
      </a>`).join('')}
    </div>`;
}

// Os pedidos de acesso esperando o master. Fica no alto do painel porque uma
// pessoa esperando liberação é a coisa mais urgente que pode haver ali: ela
// não consegue trabalhar até alguém olhar.
function blocoDePedidosDeAcesso() {
  if (!banco.podeNaSessao('acesso.conceder')) return '';
  const pedidos = banco.solicitacoesPendentes();
  if (!pedidos.length) {
    return `<h2 class="titulo-secao">Pedidos de acesso</h2>
      <p class="aviso">Nenhum pedido esperando. Instrutor, encarregado e ministério que se cadastrarem
      aparecem aqui, e só entram depois que você liberar.</p>`;
  }
  return `<h2 class="titulo-secao">Pedidos de acesso · ${pedidos.length}</h2>
    <div class="pedidos">
      ${pedidos.map((pedido) => `<article class="pedido">
        <span class="etiqueta-perfil">${escapar(NOME_DO_PAPEL[pedido.papelPretendido])}</span>
        <strong>${escapar(pedido.nome)}</strong>
        <p class="mini">${escapar(pedido.comum || 'comum não informada')} · pedido em ${data(pedido.criadaEm)}</p>
        <div class="contatos">
          ${pedido.email ? `<a class="contato" href="mailto:${escapar(pedido.email)}">✉️ ${escapar(pedido.email)}</a>` : ''}
          ${pedido.whatsapp ? `<a class="contato" href="https://wa.me/55${escapar(pedido.whatsapp.replace(/\D/g, ''))}"
            target="_blank" rel="noopener">💬 ${escapar(pedido.whatsapp)}</a>` : ''}
        </div>
        ${pedido.observacao ? `<p class="mini">Quem confirma: <b>${escapar(pedido.observacao)}</b></p>` : ''}
        <p class="mini">Confira quem é a pessoa antes de liberar — este acesso alcança a turma.</p>
        <div class="acoes">
          <button class="botao" data-acao="aprovar-pedido" data-id="${escapar(pedido.id)}">Liberar acesso</button>
          <button class="botao perigo" data-acao="recusar-pedido" data-id="${escapar(pedido.id)}">Recusar</button>
        </div>
      </article>`).join('')}
    </div>`;
}

function telaAdmin() {
  const quadro = relatorios.quadroDeAlunos();
  const panorama = relatorios.panorama();
  const instrumentos = [...new Set(quadro.map((l) => l.instrumento).filter(Boolean))].sort();

  const busca = filtroDeAlunos.texto.trim().toLowerCase();
  const visiveis = quadro
    .map((linha) => ({ linha, situacao: alertas.situacaoDoAluno(linha.aluno.id) }))
    .filter(({ linha, situacao }) => {
      if (busca && !`${linha.aluno.nome} ${linha.aluno.comum || ''} ${linha.instrumento}`.toLowerCase().includes(busca)) return false;
      if (filtroDeAlunos.situacao && situacao.chave !== filtroDeAlunos.situacao) return false;
      if (filtroDeAlunos.instrumento && linha.instrumento !== filtroDeAlunos.instrumento) return false;
      return true;
    })
    .sort((a, b) => a.linha.aluno.nome.localeCompare(b.linha.aluno.nome, 'pt-BR'));

  const papel = banco.papelDaSessao();
  const podeVerAlunos = banco.podeNaSessao('aluno.ver.todos');
  const podeCadastrar = banco.podeNaSessao('aluno.cadastrar');
  const podeMexerNoAparelho = banco.podeNaSessao('configuracao.editar');

  return `<header class="topo topo-inicial">
      <div><span class="ola">Painel do ${escapar(NOME_DO_PAPEL[papel] || 'instrutor')}</span>
      <h1>${escapar(banco.loginDaSessao())}</h1></div>
      <a class="avatar" href="#/sair" aria-label="Sair">⎋</a>
    </header>
    ${avisoDeArmazenamento()}
    ${mostrarRecado()}
    ${avisoDeSenhaDeFabrica()}
    ${blocoDePedidosDeAcesso()}

    <section class="resumo-topo">
      <div><strong>${panorama.alunos}</strong><span>alunos</span></div>
      <div><strong>${panorama.alunosAtivos}</strong><span>ativos (${panorama.janelaDeAtividade} dias)</span></div>
      <div><strong>${panorama.fasesConcluidas}</strong><span>fases vencidas</span></div>
      <div><strong>${panorama.certificados}</strong><span>certificados</span></div>
    </section>

    ${blocoDeAlertas()}

    ${podeVerAlunos ? `
    <h2 class="titulo-secao">Meus alunos</h2>
    <div class="filtros">
      <label class="oculto-visual" for="busca-aluno">Buscar aluno</label>
      <input id="busca-aluno" type="search" class="campo" placeholder="Buscar por nome, comum ou instrumento…"
        value="${escapar(filtroDeAlunos.texto)}" data-filtro="texto" autocomplete="off">
      <div class="fileira-filtros">
        <label class="oculto-visual" for="filtro-situacao">Situação</label>
        <select id="filtro-situacao" class="campo" data-filtro="situacao">
          <option value="">Todas as situações</option>
          <option value="atencao" ${filtroDeAlunos.situacao === 'atencao' ? 'selected' : ''}>Precisa de atenção</option>
          <option value="aviso" ${filtroDeAlunos.situacao === 'aviso' ? 'selected' : ''}>Acompanhar</option>
          <option value="em-dia" ${filtroDeAlunos.situacao === 'em-dia' ? 'selected' : ''}>Em dia</option>
        </select>
        <label class="oculto-visual" for="filtro-instrumento">Instrumento</label>
        <select id="filtro-instrumento" class="campo" data-filtro="instrumento">
          <option value="">Todos os instrumentos</option>
          ${instrumentos.map((i) => `<option value="${escapar(i)}" ${filtroDeAlunos.instrumento === i ? 'selected' : ''}>${escapar(i)}</option>`).join('')}
        </select>
      </div>
      ${busca || filtroDeAlunos.situacao || filtroDeAlunos.instrumento
        ? `<p class="mini">Mostrando ${visiveis.length} de ${quadro.length} alunos.
           <button class="como-link" data-acao="limpar-filtros">Limpar filtros</button></p>` : ''}
    </div>

    <div class="lista-alunos">
      ${visiveis.length
        ? visiveis.map(({ linha, situacao }) => linhaDeAluno(linha, situacao)).join('')
        : quadro.length
          ? '<p class="aviso">Nenhum aluno com esses filtros.</p>'
          : '<p class="aviso">Nenhum aluno cadastrado ainda.</p>'}
    </div>` : `<p class="aviso">O seu perfil acompanha o andamento da turma pelos relatórios,
      sem a ficha individual de cada músico.</p>`}

    <div class="acoes">
      ${podeCadastrar ? '<a class="botao grande" href="#/instrutor/novo">+ Cadastrar aluno</a>' : ''}
      ${banco.podeNaSessao('turma.ver') ? '<a class="botao secundario" href="#/instrutor/turmas">🎓 Turmas</a>' : ''}
      ${banco.podeNaSessao('relatorio.ver') ? '<a class="botao secundario" href="#/instrutor/relatorios">📊 Relatórios</a>' : ''}
      ${banco.podeNaSessao('metodo.cadastrar') ? '<a class="botao secundario" href="#/instrutor/metodos">📚 Métodos</a>' : ''}
      <a class="botao secundario" href="#/senha">Trocar a minha senha</a>
    </div>

    ${podeCadastrar ? blocoDeConferencia() : ''}

    ${podeMexerNoAparelho ? `
    <h2 class="titulo-secao">Aparelho</h2>
    <section class="sobre">
      <label class="opcao"><input type="checkbox" id="autocadastro" data-acao="autocadastro"

        <button class="botao secundario" data-acao="exportar">Exportar tudo (cópia de segurança)</button>
        <button class="botao secundario" data-acao="importar">Importar cópia</button>

// ------------------------------------------------------------------ turmas

// Um método de 8 MB e um anexo de 40 KB não se leem na mesma unidade.
function tamanhoLegivel(bytes) {
  if (bytes >= 1024 * 1024) return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
  if (bytes >= 1024) return `${Math.round(bytes / 1024)} KB`;
  return `${bytes} bytes`;
}

function telaTurmas() {
  const lista = turmasServico.turmas();
  const podeCriar = banco.podeNaSessao('turma.criar');
  return `${cabecalho('Turmas', '#/instrutor')}
    ${mostrarRecado()}
    <p>A turma junta um grupo de alunos em torno de um método, guarda o material que você anexa
    e diz <b>o que é preciso para ser aprovado</b> nela. O critério não é um bilhete sobre o aluno:
    é conferido contra o que ele fez — a nota de cada avaliação, as lições lidas, as fases concluídas.</p>
    ${lista.length ? `<div class="lista-turmas">${lista.map((turma) => {
      const metodo = banco.dados.metodos.buscar(turma.metodoId);
      const quadro = turmasServico.quadroDaTurma(turma);
      const aprovados = quadro.filter((l) => l.aprovado).length;
      return `<a class="cartao-turma ${turma.situacao}" href="#/instrutor/turma/${escapar(turma.id)}">
        <div class="corpo-turma">
          <span class="etiqueta-trilha">${escapar(metodo ? metodo.nome : 'método removido')}${
            turma.situacao === 'encerrada' ? ' · encerrada' : ''}</span>
          <strong>${escapar(turma.nome)}</strong>
          <span class="mini">${quadro.length} ${quadro.length === 1 ? 'aluno' : 'alunos'} ·
          ${aprovados} ${aprovados === 1 ? 'aprovado' : 'aprovados'} ·
          ${turma.materiais.length} ${turma.materiais.length === 1 ? 'material' : 'materiais'}</span>
          <span class="mini">Aprovação: ${turma.criterio.notaMinima}% em cada avaliação</span>
        </div>
        <span class="seta" aria-hidden="true">›</span>
      </a>`;
    }).join('')}</div>` : '<p class="aviso">Nenhuma turma criada ainda.</p>'}

}

function camposDaTurma(dados = {}, erros = {}) {

  return `<h2 class="titulo-grupo">A turma</h2>
    <label for="turma-nome">Nome da turma</label>
    <input id="turma-nome" type="text" class="campo${erros.nome ? ' com-erro' : ''}"
      value="${escapar(dados.nome || '')}" maxlength="60" placeholder="Teoria — 2026, turma da quinta">
    ${erros.nome ? `<p class="erro-campo">${escapar(erros.nome)}</p>` : ''}

    <label for="turma-metodo">Método</label>
    <select id="turma-metodo" class="campo">
      ${metodos.map((m) => `<option value="${escapar(m.id)}" ${m.id === dados.metodoId ? 'selected' : ''}>
        ${escapar(m.nome)}</option>`).join('')}
    </select>
    <p class="mini">São as fases deste método que o critério conta, e é a nota mínima daqui que passa a valer
    para elas — no lugar dos ${NOTA_MINIMA}% padrão do aplicativo.</p>

    <label for="turma-comum">Comum-congregação</label>
    <input id="turma-comum" type="text" class="campo" value="${escapar(dados.comum || '')}" maxlength="60">

    <label for="turma-responsavel">Instrutor responsável</label>
    <input id="turma-responsavel" type="text" class="campo" value="${escapar(dados.responsavel || '')}" maxlength="60">

    <h2 class="titulo-grupo">Critério de aprovação</h2>
    <p class="mini">O que é preciso para um aluno ser aprovado nesta turma. Cada linha é conferida
    contra o que está gravado — mexeu aqui, a situação de todo mundo muda junto.</p>

    <label for="criterio-nota">Nota mínima em cada avaliação (%)</label>
    <input id="criterio-nota" type="number" class="campo" min="1" max="100"
      inputmode="numeric" value="${criterio.notaMinima}">
    <p class="mini">Vale para quem estiver nesta turma, nas fases deste método.</p>

    <label for="criterio-fases">Fases para concluir a turma</label>
    <input id="criterio-fases" type="number" class="campo" min="0" max="99"
      inputmode="numeric" value="${criterio.fasesParaConcluir}">
    <p class="mini">Deixe <b>0</b> para exigir todas as fases do método.</p>

    <label class="opcao"><input type="checkbox" id="criterio-licoes"
      ${criterio.licoesObrigatorias ? 'checked' : ''}> Exigir as lições dessas fases lidas</label>

    <label for="criterio-media">Média mínima nas fases concluídas (%)</label>
    <input id="criterio-media" type="number" class="campo" min="0" max="100"
      inputmode="numeric" value="${criterio.mediaMinima}">
    <p class="mini">Deixe <b>0</b> para não cobrar média — a nota de cada avaliação já é conferida acima.</p>`;
}

function telaTurmaNova() {
  const dados = rascunho || { metodoId: (banco.dados.metodos.listar()[0] || {}).id };
  return `${cabecalho('Criar turma', '#/instrutor/turmas')}

}

    ${turma.materiais.length ? `<div class="materiais">${turma.materiais.map((material) => `
      <div class="material">

        <div class="dados-material">

function telaTurma(id) {
  const turma = turmasServico.turmaPorId(id);
  if (!turma) return telaTurmas();
  const metodo = banco.dados.metodos.buscar(turma.metodoId);
  const quadro = turmasServico.quadroDaTurma(turma);
  const podeEditar = banco.podeNaSessao('turma.editar') && turma.situacao === 'ativa';
  const foraDaTurma = banco.usuarios().filter((a) => !turma.alunoIds.includes(a.id));

  return `${cabecalho(turma.nome, '#/instrutor/turmas')}
    ${mostrarRecado()}
    <p class="mini">${escapar(metodo ? metodo.nome : 'método removido')}
    ${turma.comum ? ` · ${escapar(turma.comum)}` : ''}
    ${turma.responsavel ? ` · ${escapar(turma.responsavel)}` : ''}
    ${turma.situacao === 'encerrada' ? ' · <b>turma encerrada</b>' : ''}</p>

    <section class="resumo-topo">
      <div><strong>${quadro.length}</strong><span>alunos</span></div>
      <div><strong>${quadro.filter((l) => l.aprovado).length}</strong><span>aprovados</span></div>
      <div><strong>${turma.criterio.notaMinima}%</strong><span>nota mínima</span></div>
    </section>

    <h2 class="titulo-secao">Quem já cumpre o critério</h2>
    ${quadro.length ? `<div class="lista-alunos">${quadro.map((linha) => `
      <div class="cartao-aluno painel ${linha.aprovado ? 'aprovado' : ''}">
        <span class="inicial" aria-hidden="true">${escapar(linha.aluno.nome.trim().charAt(0).toUpperCase())}</span>
        <span class="dados">
          <strong>${escapar(linha.aluno.nome)}</strong>
          ${barra(linha.percentual, `progresso de ${linha.aluno.nome} na turma`)}
          <small>${linha.itens.map((item) =>
            `${item.cumpre ? '✔' : '•'} ${escapar(item.pede)} — ${escapar(item.tem)}`).join('<br>')}</small>
        </span>
        <span class="selo-turma ${linha.aprovado ? 'ok' : ''}">${linha.aprovado ? 'aprovado' : `${linha.concluidas}/${linha.exigidas}`}</span>
        ${podeEditar ? `<button class="botao secundario estreito" data-acao="tirar-da-turma"
          data-id="${escapar(turma.id)}" data-aluno="${escapar(linha.aluno.id)}">Tirar</button>` : ''}
      </div>`).join('')}</div>`
      : '<p class="aviso">Nenhum aluno nesta turma ainda.</p>'}

    ${podeEditar && foraDaTurma.length ? `<div class="filtros">
      <label for="aluno-para-turma">Colocar um aluno na turma</label>

        ${foraDaTurma.map((a) => `<option value="${escapar(a.id)}">${escapar(a.nome)}</option>`).join('')}
      </select>

    </div>` : ''}

    ${blocoDeMaterial(turma)}

    ${podeEditar ? `<h2 class="titulo-secao">Turma e critério</h2>
      <section class="formulario">
        ${camposDaTurma(turma, {})}
        <button class="botao grande" data-acao="salvar-turma" data-id="${escapar(turma.id)}">Salvar</button>
      </section>` : ''}

    ${banco.podeNaSessao('turma.editar') ? `<div class="acoes">
      ${turma.situacao === 'ativa'
        ? `<button class="botao secundario" data-acao="encerrar-turma" data-id="${escapar(turma.id)}">Encerrar turma</button>`

      ${banco.podeNaSessao('turma.remover')
        ? `<button class="botao perigo" data-acao="remover-turma" data-id="${escapar(turma.id)}">Remover turma</button>` : ''}
    </div>` : ''}`;
}

// ------------------------------------------------------- métodos e importação

// A prévia da importação vive fora do desenho: ela é o resultado de um passo
// (analisar) que precisa sobreviver até o passo seguinte (confirmar).
let previaDeImportacao = null;

function blocoDePrevia(analise) {
  const { previa, problemas, valido } = analise;
  const porGravidade = (g) => problemas.filter((p) => p.gravidade === g);
  return `<section class="previa ${valido ? 'ok' : 'com-erro'}">
    <h3>${valido ? 'Confira antes de confirmar' : 'O arquivo não pode ser importado'}</h3>
    <p><strong>${escapar(previa.metodo.nome || '(sem nome)')}</strong> — versão ${escapar(previa.versao)}</p>
    <div class="indicadores">
      <div><strong>${previa.fases}</strong><span>fases</span></div>
      <div><strong>${previa.licoes}</strong><span>lições</span></div>
      <div><strong>${previa.jogos}</strong><span>jogos</span></div>
      <div><strong>${previa.questoes}</strong><span>questões</span></div>
    </div>
    ${previa.listaDeFases.length ? `<details><summary>Ver as fases</summary>
      <ul class="lista-chave">${previa.listaDeFases.map((f) => `<li><b>Fase ${f.ordem} — ${escapar(f.titulo)}</b>
        — ${f.licoes} ${f.licoes === 1 ? 'lição' : 'lições'}, ${f.jogos} ${f.jogos === 1 ? 'jogo' : 'jogos'},
        ${f.questoes} ${f.questoes === 1 ? 'questão' : 'questões'}</li>`).join('')}</ul></details>` : ''}
    ${porGravidade('impede').length ? `<h4>Erros que impedem a importação</h4>
      <ul class="lista-chave erros">${porGravidade('impede').map((p) =>
        `<li><b>${escapar(p.onde)}</b> — ${escapar(p.mensagem)}</li>`).join('')}</ul>` : ''}
    ${porGravidade('aviso').length ? `<h4>Avisos</h4>
      <ul class="lista-chave">${porGravidade('aviso').map((p) =>
        `<li><b>${escapar(p.onde)}</b> — ${escapar(p.mensagem)}</li>`).join('')}</ul>` : ''}
    <div class="acoes">
      ${valido ? '<button class="botao grande" data-acao="confirmar-metodo">Confirmar e criar o método</button>' : ''}
      <button class="botao secundario" data-acao="cancelar-metodo">Cancelar</button>
    </div>
  </section>`;
}

function blocoDeMateriaisDoMetodo(metodo) {
  const podeMexer = banco.podeNaSessao('metodo.editar');
  // Um método gravado por uma versão anterior não tem a lista: ela entra vazia
  // em vez de derrubar a tela.
  const materiais = metodo.materiais || [];
  return `<h2 class="titulo-secao">O método em PDF</h2>
    <p class="mini">O arquivo fica guardado neste aparelho e abre para quem estuda este método.
    É por ele que o aluno lê o conteúdo; as fases e as lições abaixo dizem em que página está cada assunto.</p>
    ${materiais.length ? `<div class="materiais">${materiais.map((material) => `
      <div class="material">
        <span class="icone-material" aria-hidden="true">📄</span>
        <div class="dados-material">
          <strong>${escapar(material.nome)}</strong>
          <small>${tamanhoLegivel(material.tamanho)} · anexado em ${data(material.adicionadoEm)}</small>
        </div>
        <button class="botao secundario estreito" data-acao="abrir-material" data-id="${escapar(material.id)}">Abrir</button>
        ${podeMexer ? `<button class="botao perigo estreito" data-acao="remover-pdf-metodo"
          data-id="${escapar(material.id)}" data-metodo="${escapar(metodo.id)}">Remover</button>` : ''}
      </div>`).join('')}</div>` : '<p class="aviso">Nenhum PDF anexado a este método.</p>'}
    ${podeMexer ? `<div class="acoes">
        <button class="botao secundario" data-acao="escolher-pdf-metodo" data-metodo="${escapar(metodo.id)}">
          📎 Anexar o método em PDF</button>

      <input type="file" id="arquivo-pdf-metodo" accept="application/pdf" hidden

function camposDoMetodo(dados = {}, erros = {}) {
  return `<label for="metodo-nome">Nome do método</label>

             ${doApp ? 'Abrir' : 'Editar'}</a></div>` : ''}
      </section>`;

      <span class="mini">${dados.licoesLidas.length} de ${fase.licoes.length} lições${fase.paginas ? ` · páginas ${fase.paginas}` : ''}</span>

}

// O cartão que abre a tela do aluno: onde ele está, quanto andou e qual é o
// próximo passo. Antes ele precisava adivinhar isso olhando a lista de fases.
function cartaoDeSituacao(aluno) {
  const situacao = progressoServico.situacaoDoAluno(aluno.id);
  const jogo = gamificacao.resumo(aluno.id);
  const seguinte = progressoServico.proximaAtividade(aluno.id);
  const principal = situacao.matriculas.find((m) => m.faseAtual) || situacao.matriculas[0] || null;
  const instrumento = aluno.instrumentoId ? instrumentoPorId(aluno.instrumentoId) : null;

  const linhas = [
    instrumento ? `🎻 ${escapar(instrumento.nome)}` : null,
    principal && principal.metodo ? `📚 ${escapar(principal.metodo.nome)}` : null,
    principal && principal.faseAtual ? `📖 Fase ${principal.faseAtual.numero} — ${escapar(principal.faseAtual.titulo)}` : null,
  ].filter(Boolean);

  return `<section class="painel-aluno">
    <div class="onde-estou">${linhas.map((l) => `<span>${l}</span>`).join('')}</div>
    ${barra(situacao.percentual, 'Progresso geral')}
    <p class="mini">${situacao.percentual}% do seu percurso · ${situacao.concluidas} de ${situacao.total} fases concluídas</p>

    ${seguinte.tipo !== 'nada' ? `<a class="proxima-atividade" href="${seguinte.destino}">
      <span class="etiqueta">Próxima atividade</span>
      <strong>${escapar(seguinte.titulo)}</strong>
      <span class="mini">${escapar(seguinte.motivo)}</span>
      <span class="seta" aria-hidden="true">›</span>
    </a>` : `<p class="recado ok">${escapar(seguinte.motivo)}</p>`}

    <div class="indicadores">
      <div><strong>${jogo.xp}</strong><span>pontos · nível ${jogo.nivel}</span></div>
      <div><strong>${jogo.sequencia.dias}</strong><span>${jogo.sequencia.dias === 1 ? 'dia seguido' : 'dias seguidos'}</span></div>
      <div><strong>${jogo.conquistas}</strong><span>de ${jogo.totalDeConquistas} conquistas</span></div>
    </div>
    <p class="mini">Faltam ${jogo.faltamParaOProximo} pontos para o nível ${jogo.nivel + 1}.</p>
  </section>`;
}

// O método impresso, para o aluno abrir. Vem do método em que ele está
// matriculado — e é por ele que se estuda um método que o aplicativo não
// traz por dentro.
function blocoDoMetodoEmPdf(aluno) {
  const materiais = metodosServico.materiaisDoAluno(aluno.id);
  if (!materiais.length) return '';
  // Agrupado por método: com dois métodos em PDF, saber de qual é cada arquivo
  // é a diferença entre uma lista útil e uma lista de nomes de arquivo.
  const porMetodo = new Map();
  for (const material of materiais) {
    if (!porMetodo.has(material.metodo.id)) porMetodo.set(material.metodo.id, { metodo: material.metodo, arquivos: [] });
    porMetodo.get(material.metodo.id).arquivos.push(material);
  }
  return `<section class="minha-turma">
    <span class="etiqueta-trilha">${porMetodo.size === 1 ? 'Meu método' : 'Meus métodos'}</span>
    ${[...porMetodo.values()].map(({ metodo, arquivos }) => `
      <strong>${escapar(metodo.nome)}</strong>
      ${metodo.fonte ? `<p class="mini"><i>${escapar(metodo.fonte)}</i></p>` : ''}
      <div class="materiais">${arquivos.map((material) => `
        <button class="botao secundario" data-acao="abrir-material" data-id="${escapar(material.id)}">
          📄 ${escapar(material.nome)}</button>`).join('')}</div>`).join('')}
    <p class="mini">O arquivo está guardado neste aparelho e abre sem internet.</p>
  </section>`;
}

// A turma do aluno, do ponto de vista dele: o que se pede para ser aprovado,
// quanto ele já cumpriu, e o método em PDF para abrir. Saber o critério é
// direito de quem está sendo avaliado por ele.
function blocoDaTurmaDoAluno(aluno) {
  const minhas = banco.dados.turmasDoAluno(aluno.id).filter((t) => t.situacao === 'ativa');
  if (!minhas.length) return '';
  return minhas.map((turma) => {
    const situacao = turmasServico.situacaoNaTurma(turma, aluno.id);
    return `<section class="minha-turma">
      <span class="etiqueta-trilha">Minha turma</span>
      <strong>${escapar(turma.nome)}</strong>
      ${barra(situacao.percentual, `progresso na turma ${turma.nome}`)}
      <p class="mini">${situacao.aprovado
        ? 'Você já cumpre o critério desta turma.'
        : `Para ser aprovado nesta turma:`}</p>
      ${situacao.aprovado ? '' : `<ul class="lista-chave">${situacao.itens.map((item) =>
        `<li>${item.cumpre ? '✔' : '○'} ${escapar(item.pede)} — <b>${escapar(item.tem)}</b></li>`).join('')}</ul>`}
      ${turma.materiais.length ? `<div class="materiais">${turma.materiais.map((material) => `
        <button class="botao secundario" data-acao="abrir-material" data-id="${escapar(material.id)}">
          📄 ${escapar(material.nome)}</button>`).join('')}</div>` : ''}
    </section>`;
  }).join('');
}
