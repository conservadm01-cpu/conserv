    campos: ['id', 'usuarioId', 'papel', 'acao', 'entidade', 'entidadeId', 'dadosAntes', 'dadosDepois', 'dataHora'],
    unicos: ['id'],
  },
  conquistas: {
    nome: 'Conquistas',
    chavePrimaria: 'id',
    campos: ['id', 'alunoId', 'chave', 'titulo', 'descricao', 'icone', 'conquistadaEm'],
    unicos: ['id'],
  },
  notificacoes: {
    nome: 'Avisos',
    chavePrimaria: 'id',
    campos: ['id', 'alunoId', 'tipo', 'titulo', 'texto', 'destino', 'lidaEm', 'criadaEm'],
    unicos: ['id'],
  },
  turmas: {
    nome: 'Turmas',
    chavePrimaria: 'id',
    campos: ['id', 'nome', 'metodoId', 'comum', 'responsavel', 'observacao', 'alunoIds',
      'criterio', 'materiais', 'situacao', 'criadaEm', 'encerradaEm'],
    unicos: ['id'],
  },
  solicitacoes: {
    nome: 'Pedidos de acesso',
    chavePrimaria: 'id',
    campos: ['id', 'nome', 'papelPretendido', 'comum', 'email', 'whatsapp', 'observacao',
      'sal', 'senhaHash', 'situacao', 'motivo', 'criadaEm', 'decididaEm', 'decididaPor'],
    unicos: ['id'],
  },
  configuracoes: {
    nome: 'Configurações',
    chavePrimaria: 'chave',
    campos: ['chave', 'valor'],
    unicos: ['chave'],
  },
};

const NOMES_DAS_ENTIDADES = Object.keys(ENTIDADES);

// -------------------------------------------------------------------- papéis

// INSTRUTOR é o nome usado no aplicativo e na conversa com quem o usa.
// PROFESSOR continua aceito porque existem cadastros gravados com ele: a
// camada de compatibilidade traduz um no outro, e nenhum acesso se perde.
// Do topo para baixo. O MASTER é quem libera acesso: instrutor, encarregado e
// ministério não entram sozinhos — alguém com esse perfil precisa deixar.
const PAPEIS = ['MASTER', 'ADMIN', 'INSTRUTOR', 'ENCARREGADO', 'MINISTERIO', 'ALUNO'];
const PAPEL_ANTIGO = { PROFESSOR: 'INSTRUTOR' };

// Quem pede acesso escolhe um destes. "Aluno" não entra na lista porque aluno
// não pede: ele se cadastra e estuda.
const PAPEIS_QUE_PEDEM = ['INSTRUTOR', 'ENCARREGADO', 'MINISTERIO'];
const SITUACOES_DA_SOLICITACAO = ['pendente', 'aprovada', 'recusada'];
const SITUACOES_DA_TURMA = ['ativa', 'encerrada'];

// O critério de aprovação da turma. Cada campo responde a uma pergunta que a
// escola faz de verdade, e todos são conferidos contra o que está gravado —
// nenhum deles é digitado à mão sobre o aluno.
const CRITERIO_PADRAO = {
  notaMinima: 70,        // nota de cada avaliação, para a fase contar
  fasesParaConcluir: 0,  // quantas fases do método fecham a turma (0 = todas)
  licoesObrigatorias: true, // as lições da fase precisam estar lidas
  mediaMinima: 0,        // média das fases concluídas (0 = não cobra média)
};

// ------------------------------------------------------------ estado inicial

function estadoVazio() {
  const estado = {
    versao: VERSAO_DO_ESQUEMA,
    migracao: null,
    sessao: null,
  };
  for (const nome of NOMES_DAS_ENTIDADES) estado[nome] = [];
  return estado;
}

// Completa um estado lido do depósito com as coleções que faltarem, sem
// mexer no que já existe. É o que permite abrir um arquivo gravado por uma
// versão anterior do V2 sem quebrar.
function completarEstado(bruto) {
  const estado = { ...estadoVazio(), ...(bruto && typeof bruto === 'object' ? bruto : {}) };
  for (const nome of NOMES_DAS_ENTIDADES) {
    if (!Array.isArray(estado[nome])) estado[nome] = [];
  }
  estado.versao = VERSAO_DO_ESQUEMA;
  return estado;
}

// ---------------------------------------------------------------- validações

const texto = (valor) => String(valor === undefined || valor === null ? '' : valor).trim();
const vazio = (valor) => texto(valor) === '';

// Um problema tem gravidade. "impede" quebra a estrutura — id repetido, fase
// sem método, senha em texto — e a gravação é recusada. "pendencia" é o
// registro incompleto: ele entra, fica marcado como pendente de conferência e
// aparece na lista de pendências do painel. Recusar estes travaria o próprio
// uso do aplicativo, em que o aluno é cadastrado antes de a ficha estar cheia.
const erro = (entidade, id, mensagem, gravidade = 'impede') =>
  ({ entidade, id: id === undefined ? null : id, mensagem, gravidade });

const impedimentos = (problemas) => problemas.filter((p) => p.gravidade === 'impede');
const pendencias = (problemas) => problemas.filter((p) => p.gravidade === 'pendencia');

function duplicados(linhas, campo) {
  const vistos = new Map();
  const repetidos = [];
  for (const linha of linhas) {
    const chave = texto(linha[campo]).toLowerCase();
    if (!chave) continue;
    if (vistos.has(chave)) repetidos.push({ linha, primeiro: vistos.get(chave), chave });
    else vistos.set(chave, linha);
  }
  return repetidos;
}

// Cada função devolve a lista de problemas encontrados. Nenhuma lança:
// quem chama decide se recusa a gravação ou só mostra o aviso.

function validarInstrumentos(instrumentos) {
  const problemas = [];
  for (const i of instrumentos) {
    if (vazio(i.id)) problemas.push(erro('instrumentos', i.id, 'Instrumento sem identificador.'));
    if (vazio(i.nome)) problemas.push(erro('instrumentos', i.id, 'Instrumento sem nome.'));
  }
  for (const campo of ['id', 'nome']) {
    for (const d of duplicados(instrumentos, campo)) {
      problemas.push(erro('instrumentos', d.linha.id, `Duplicidade de instrumentos: já existe um com ${campo} "${texto(d.linha[campo])}".`));
    }
  }
  return problemas;
}

function validarMetodos(metodos, instrumentos = []) {
  const problemas = [];
  const existentes = new Set(instrumentos.map((i) => i.id));
  for (const m of metodos) {
    if (vazio(m.id)) problemas.push(erro('metodos', m.id, 'Método sem identificador.'));
    if (vazio(m.nome)) problemas.push(erro('metodos', m.id, 'Método sem nome.'));
    const lista = Array.isArray(m.instrumentoIds) ? m.instrumentoIds : [];
    // "Método sem instrumento": todo método precisa dizer a quem serve —
    // uma lista de instrumentos ou a marca de que vale para todos.
    if (!m.universal && lista.length === 0) {
      problemas.push(erro('metodos', m.id, 'Método sem instrumento: informe os instrumentos atendidos ou marque-o como universal.'));
    }
    for (const id of lista) {
      if (!existentes.has(id)) problemas.push(erro('metodos', m.id, `Método aponta para o instrumento "${id}", que não está cadastrado.`));
    }
  }
  for (const campo of ['id', 'nome']) {
    for (const d of duplicados(metodos, campo)) {
      problemas.push(erro('metodos', d.linha.id, `Duplicidade de métodos: já existe um com ${campo} "${texto(d.linha[campo])}".`));
    }
  }
  return problemas;
}

function validarFases(fases, metodos = []) {
  const problemas = [];
  const existentes = new Set(metodos.map((m) => m.id));
  for (const f of fases) {
    if (vazio(f.id)) problemas.push(erro('fases', f.id, 'Fase sem identificador.'));
    if (vazio(f.metodoId)) problemas.push(erro('fases', f.id, 'Fase sem método.'));
    else if (existentes.size && !existentes.has(f.metodoId)) {
      problemas.push(erro('fases', f.id, `Fase aponta para o método "${f.metodoId}", que não está cadastrado.`));
    }
    if (vazio(f.titulo)) problemas.push(erro('fases', f.id, 'Fase sem título.', 'pendencia'));
  }
  for (const d of duplicados(fases, 'id')) {
    problemas.push(erro('fases', d.linha.id, `Duplicidade de fases: já existe uma com id "${texto(d.linha.id)}".`));
  }
  // Duas fases não podem disputar a mesma posição — dentro da MESMA VERSÃO.
  // Entre versões diferentes do mesmo método a repetição é esperada: a versão
  // 2.0 tem a sua fase 1 como a 1.0 tem a dela.
  const porVersao = new Map();
  for (const f of fases) {
    const escopo = f.versaoId || f.metodoId;
    const chave = `${escopo}#${f.ordem}`;
    if (porVersao.has(chave)) {
      problemas.push(erro('fases', f.id,
        `Duplicidade de fases: a ordem ${f.ordem} já é usada pela fase "${porVersao.get(chave)}" ${f.versaoId ? `na versão "${f.versaoId}"` : `no método "${f.metodoId}"`}.`));
    } else porVersao.set(chave, f.id);
  }
  return problemas;
}

const validarFilhos = (linhas, entidade, campoPai, pais, rotulo) => {
  const problemas = [];
  const existentes = new Set(pais.map((p) => p.id));
  for (const linha of linhas) {
    if (vazio(linha[campoPai])) problemas.push(erro(entidade, linha.id, rotulo));
    else if (existentes.size && !existentes.has(linha[campoPai])) {
      problemas.push(erro(entidade, linha.id, `${rotulo.replace(/:.*/, '')}: "${linha[campoPai]}" não está cadastrado.`));
    }
  }
  return problemas;
};

const validarLicoes = (licoes, fases = []) => validarFilhos(licoes, 'licoes', 'faseId', fases, 'Lição sem fase.');
const validarExercicios = (exercicios, licoes = []) => validarFilhos(exercicios, 'exercicios', 'licaoId', licoes, 'Exercício sem lição.');
const validarJogos = (jogos, fases = []) => validarFilhos(jogos, 'jogos', 'faseId', fases, 'Jogo sem fase.');
const validarAvaliacoes = (avaliacoes, fases = []) => validarFilhos(avaliacoes, 'avaliacoes', 'faseId', fases, 'Avaliação sem fase.');
const validarQuestoes = (questoes, avaliacoes = []) => validarFilhos(questoes, 'questoes', 'avaliacaoId', avaliacoes, 'Questão sem avaliação.');

function validarAlunos(alunos, instrumentos = []) {
  const problemas = [];
  const existentes = new Set(instrumentos.map((i) => i.id));
  for (const a of alunos) {
    if (vazio(a.nome)) problemas.push(erro('alunos', a.id, 'Aluno sem nome.'));
    // "Aluno sem instrumento": o instrumento define a trilha do método, então
    // é ele que não pode faltar. O aluno recém-criado, antes de preencher a
    // ficha, fica pendente — e é isso que esta validação aponta.
    if (vazio(a.instrumentoId) && vazio(a.instrumento)) {
      problemas.push(erro('alunos', a.id, 'Aluno sem instrumento.', 'pendencia'));
    } else if (!vazio(a.instrumentoId) && existentes.size && !existentes.has(a.instrumentoId)) {
      problemas.push(erro('alunos', a.id, `Aluno aponta para o instrumento "${a.instrumentoId}", que não está cadastrado.`, 'pendencia'));
    }
  }
  for (const d of duplicados(alunos, 'nome')) {
    problemas.push(erro('alunos', d.linha.id, `Já existe um aluno com o nome "${texto(d.linha.nome)}".`));
  }
  return problemas;
}

function validarTurmas(turmas, estado = {}) {
  const problemas = [];
  const metodos = new Set((estado.metodos || []).map((m) => m.id));
  const alunos = new Set((estado.alunos || []).map((a) => a.id));
  for (const t of turmas) {
    if (vazio(t.nome)) problemas.push(erro('turmas', t.id, 'Turma sem nome.'));
    if (vazio(t.metodoId)) problemas.push(erro('turmas', t.id, 'Turma sem método.'));
    else if (metodos.size && !metodos.has(t.metodoId)) {
      problemas.push(erro('turmas', t.id, `Turma aponta para o método "${t.metodoId}", que não está cadastrado.`));
    }
    if (!SITUACOES_DA_TURMA.includes(t.situacao)) {
      problemas.push(erro('turmas', t.id, `Situação inválida: "${t.situacao}".`));
    }
    const nota = Number((t.criterio || {}).notaMinima);
    if (!(nota >= 1 && nota <= 100)) {
      problemas.push(erro('turmas', t.id, 'A nota mínima da turma precisa estar entre 1 e 100.'));
    }
    const media = Number((t.criterio || {}).mediaMinima);
    if (!(media >= 0 && media <= 100)) {
      problemas.push(erro('turmas', t.id, 'A média mínima da turma precisa estar entre 0 e 100.'));
    }
    for (const alunoId of t.alunoIds || []) {
      if (alunos.size && !alunos.has(alunoId)) {
        problemas.push(erro('turmas', t.id, `Turma tem um aluno que não está cadastrado: "${alunoId}".`, 'pendencia'));
      }
    }
  }
  for (const d of duplicados(turmas, 'nome')) {
    problemas.push(erro('turmas', d.linha.id, `Já existe uma turma chamada "${texto(d.linha.nome)}".`));
  }
  return problemas;
}

// O pedido de acesso guarda a senha que a pessoa escolheu — em resumo, como
// qualquer outra. É o que faz a senha continuar valendo no dia em que o master
// aprovar, sem ninguém ter de combinar uma senha por fora.
function validarSolicitacoes(solicitacoes, usuarios = []) {
  const problemas = [];
  const logins = new Set(usuarios.map((u) => texto(u.login).trim().toLowerCase()));
  for (const s of solicitacoes) {
    if (vazio(s.nome)) problemas.push(erro('solicitacoes', s.id, 'Pedido de acesso sem nome.'));
    if (!PAPEIS_QUE_PEDEM.includes(s.papelPretendido)) {
      problemas.push(erro('solicitacoes', s.id, `Perfil que não se pede: "${s.papelPretendido}".`));
    }
    if (!SITUACOES_DA_SOLICITACAO.includes(s.situacao)) {
      problemas.push(erro('solicitacoes', s.id, `Situação inválida: "${s.situacao}".`));
    }
    if (s.senha !== undefined) problemas.push(erro('solicitacoes', s.id, 'Senha em texto puro no pedido de acesso.'));
    if (vazio(s.senhaHash)) problemas.push(erro('solicitacoes', s.id, 'Pedido de acesso sem resumo de senha.'));
    if (s.situacao === 'pendente' && logins.size && logins.has(texto(s.nome).trim().toLowerCase())) {
      problemas.push(erro('solicitacoes', s.id, `Já existe um acesso com o login "${texto(s.nome)}".`));
    }
  }
  for (const d of duplicados(solicitacoes.filter((s) => s.situacao === 'pendente'), 'nome')) {
    problemas.push(erro('solicitacoes', d.linha.id, `Já há um pedido pendente no nome "${texto(d.linha.nome)}".`));
  }
  return problemas;
}

function validarUsuarios(usuarios, alunos = []) {
  const problemas = [];
  const existentes = new Set(alunos.map((a) => a.id));
  for (const u of usuarios) {
    if (vazio(u.login)) problemas.push(erro('usuarios', u.id, 'Usuário sem login.'));
    if (!PAPEIS.includes(u.papel)) problemas.push(erro('usuarios', u.id, `Papel inválido: "${u.papel}".`));
    if (u.papel === 'ALUNO' && vazio(u.alunoId)) problemas.push(erro('usuarios', u.id, 'Acesso de aluno sem ficha de aluno vinculada.'));
    if (u.papel === 'ALUNO' && !vazio(u.alunoId) && existentes.size && !existentes.has(u.alunoId)) {
      problemas.push(erro('usuarios', u.id, `Acesso aponta para o aluno "${u.alunoId}", que não está cadastrado.`));
    }
    // A senha nunca é guardada em texto: só o resumo com sal.
    if (u.senha !== undefined) problemas.push(erro('usuarios', u.id, 'Senha em texto puro no cadastro de acesso.'));
    if (u.exigeSenha && vazio(u.senhaHash)) problemas.push(erro('usuarios', u.id, 'Acesso exige senha mas não tem resumo de senha guardado.'));
  }
  for (const d of duplicados(usuarios, 'login')) {
    problemas.push(erro('usuarios', d.linha.id, `Já existe um acesso com o login "${texto(d.linha.login)}".`));
  }
  return problemas;
}

// Passa o estado inteiro pelas validações e devolve tudo o que estiver errado.

function validarVersoes(versoes, metodos = []) {
  const problemas = [];
  const existentes = new Set(metodos.map((m) => m.id));
  for (const v of versoes) {
    if (vazio(v.metodoId)) problemas.push(erro('versoes', v.id, 'Versão sem método.'));
    else if (existentes.size && !existentes.has(v.metodoId)) {
      problemas.push(erro('versoes', v.id, `Versão aponta para o método "${v.metodoId}", que não está cadastrado.`));
    }
    if (vazio(v.rotulo)) problemas.push(erro('versoes', v.id, 'Versão sem rótulo (por exemplo "1.0").', 'pendencia'));
  }
  for (const d of duplicados(versoes, 'id')) {
    problemas.push(erro('versoes', d.linha.id, `Duplicidade de versões: já existe uma com id "${texto(d.linha.id)}".`));
  }
  return problemas;
}

function validarMatriculas(matriculas, { alunos = [], instrumentos = [], metodos = [], versoes = [] } = {}) {
  const problemas = [];
  const temAluno = new Set(alunos.map((a) => a.id));
  const temInstrumento = new Set(instrumentos.map((i) => i.id));
  const temMetodo = new Set(metodos.map((m) => m.id));
  const temVersao = new Set(versoes.map((v) => v.id));

  for (const m of matriculas) {
    if (vazio(m.alunoId)) problemas.push(erro('matriculas', m.id, 'Matrícula sem aluno.'));
    else if (temAluno.size && !temAluno.has(m.alunoId)) {
      problemas.push(erro('matriculas', m.id, `Matrícula aponta para o aluno "${m.alunoId}", que não está cadastrado.`));
    }
    if (vazio(m.metodoId)) problemas.push(erro('matriculas', m.id, 'Matrícula sem método.'));
    else if (temMetodo.size && !temMetodo.has(m.metodoId)) {
      problemas.push(erro('matriculas', m.id, `Matrícula aponta para o método "${m.metodoId}", que não está cadastrado.`));
    }
    // O instrumento é o que define a trilha; sem ele a matrícula fica pendente,
    // não recusada, porque o aluno pode ser cadastrado antes de escolher.
    if (vazio(m.instrumentoId)) problemas.push(erro('matriculas', m.id, 'Matrícula sem instrumento.', 'pendencia'));
    else if (temInstrumento.size && !temInstrumento.has(m.instrumentoId)) {
      problemas.push(erro('matriculas', m.id, `Matrícula aponta para o instrumento "${m.instrumentoId}", que não está cadastrado.`, 'pendencia'));
    }
    if (!vazio(m.versaoId) && temVersao.size && !temVersao.has(m.versaoId)) {
      problemas.push(erro('matriculas', m.id, `Matrícula aponta para a versão "${m.versaoId}", que não está cadastrada.`));
    }
  }
  // O mesmo aluno não se matricula duas vezes no mesmo método com o mesmo
  // instrumento enquanto a primeira matrícula estiver em curso.
  const vistas = new Map();
  for (const m of matriculas.filter((x) => x.situacao === 'em_curso')) {
    const chave = `${m.alunoId}#${m.metodoId}#${m.instrumentoId}`;
    if (vistas.has(chave)) {
      problemas.push(erro('matriculas', m.id, 'Já existe uma matrícula em curso deste aluno neste método e instrumento.'));
    } else vistas.set(chave, m.id);
  }
  return problemas;
}

function validarEstado(estado) {
  const e = completarEstado(estado);
  return [
    ...validarInstrumentos(e.instrumentos),
    ...validarMetodos(e.metodos, e.instrumentos),
    ...validarFases(e.fases, e.metodos),
    ...validarLicoes(e.licoes, e.fases),
    ...validarExercicios(e.exercicios, e.licoes),
    ...validarJogos(e.jogos, e.fases),
    ...validarAvaliacoes(e.avaliacoes, e.fases),
    ...validarQuestoes(e.questoes, e.avaliacoes),
    ...validarAlunos(e.alunos, e.instrumentos),
    ...validarUsuarios(e.usuarios, e.alunos),
    ...validarSolicitacoes(e.solicitacoes, e.usuarios),
    ...validarTurmas(e.turmas, e),
    ...validarVersoes(e.versoes, e.metodos),
    ...validarMatriculas(e.matriculas, e),
  ];
}

return { VERSAO_DO_ESQUEMA, ENTIDADES, NOMES_DAS_ENTIDADES, PAPEIS, PAPEL_ANTIGO, PAPEIS_QUE_PEDEM, SITUACOES_DA_SOLICITACAO, SITUACOES_DA_TURMA, CRITERIO_PADRAO, validarSolicitacoes, validarTurmas, estadoVazio, completarEstado, impedimentos, pendencias, validarInstrumentos, validarMetodos, validarFases, validarLicoes, validarExercicios, validarJogos, validarAvaliacoes, validarQuestoes, validarAlunos, validarUsuarios, validarVersoes, validarMatriculas, validarEstado };

__modulos['dados/compatibilidade'] = (function () {
// Camada de compatibilidade.
//
// Dados gravados por versões anteriores do aplicativo não têm todos os campos
// que o V2 espera. Em vez de recusá-los — ou pior, de espalhar "if (campo)"

function matricularNosMetodos(estado, aluno) {
  const criadas = [];
  const metodos = estado.metodos.filter((m) => m.ativo !== false
    && (m.universal || (m.instrumentoIds || []).includes(aluno.instrumentoId)));

  for (const metodo of metodos) {
    const versoesDele = estado.versoes.filter((v) => v.metodoId === metodo.id)
      .sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    const publicadas = versoesDele.filter((v) => v.situacao === 'publicada');
    const versao = publicadas[publicadas.length - 1] || versoesDele[versoesDele.length - 1] || null;

    const matricula = normalizeMatricula({
      id: novoId('mt'),
      alunoId: aluno.id,
      instrumentoId: aluno.instrumentoId || '',
      metodoId: metodo.id,
      versaoId: versao ? versao.id : null,
      dataInicio: aluno.criadoEm || agora(),
      situacao: 'em_curso',
    });
    estado.matriculas.push(matricula);
    criadas.push(matricula);

// A qual matrícula pertence uma fase: à do método dono daquela fase.
function matriculaDaFase(estado, matriculasDoAluno, faseId) {
  const fase = estado.fases.find((f) => f.id === String(faseId));
  if (!fase) return matriculasDoAluno[0] || null;
  return matriculasDoAluno.find((m) => m.metodoId === fase.metodoId) || matriculasDoAluno[0] || null;

// Liga progresso, resultados e certificados às matrículas recém-criadas.
// Registro cuja fase não pertence a nenhum método conhecido fica sem matrícula:
// não se apaga nada e o painel mostra como pendente de conferência.
function ligarRegistrosAsMatriculas(estado) {
  for (const aluno of estado.alunos) {
    const minhas = estado.matriculas.filter((m) => m.alunoId === aluno.id);
    if (!minhas.length) continue;
    const ligar = (linha) => {
      if (linha.matriculaId) return;
      const m = matriculaDaFase(estado, minhas, linha.faseId);
      if (m) linha.matriculaId = m.id;
    };
    estado.progressos.filter((p) => p.alunoId === aluno.id).forEach(ligar);
    estado.resultados.filter((r) => r.alunoId === aluno.id).forEach(ligar);
    estado.certificados.filter((c) => c.alunoId === aluno.id).forEach(ligar);

    // A fase atual da matrícula: a primeira ainda não aprovada, na ordem.
    for (const matricula of minhas) {
      const fases = estado.fases.filter((f) => f.metodoId === matricula.metodoId)
        .sort((a, b) => a.ordem - b.ordem);
      const aprovadas = new Set(estado.progressos
        .filter((p) => p.alunoId === aluno.id && p.aprovadoEm).map((p) => p.faseId));

}

  // única vez, por mais vezes que o aplicativo seja aberto.

  if (!origem && !atual) {

    estado.migracao = { versao: VERSAO_DA_MIGRACAO, migradoEm: agora(), origem: null, backup: null, registros: 0 };

  // versão da migração, sem converter nada de novo.

    const estado = completarEstado(atual);

    estado.migracao = { ...(estado.migracao || {}), versao: VERSAO_DA_MIGRACAO, migradoEm: agora() };

    versao: VERSAO_DA_MIGRACAO,
    migradoEm: agora(),

    // intacto e o aplicativo roda esta sessão com o estado convertido em
    // memória, sem perder nada do que já estava guardado.

    porCampo(campo, valor) {

    umPorCampo(campo, valor) {
      return colecao().find((r) => r[campo] === valor) || null;

    contar(filtro = null) {

          const posicao = colecao().findIndex((r) => r[chave] === id);
          if (posicao >= 0) colecao().splice(posicao, 1);

      gravar();
      return registro;

//
// É aqui que mora a resposta para as perguntas que o aluno faz sem falar:

const porcentagem = (parte, total) => (total > 0 ? Math.round((parte / total) * 100) : 0);

// A nota mínima que vale para uma fase, na ordem em que se pergunta:
//
//   1. a da TURMA do aluno naquele método — o critério de aprovação é decisão
//      de quem ensina a turma, e por isso vem antes de tudo;
//   2. a da própria fase, quando ela declara uma;
//   3. a da avaliação da fase;
//   4. a do aplicativo.

// é o que acontece quando alguém olha uma fase sem olhar um aluno.
function notaMinimaDaFase(fase, alunoId = null) {
  if (alunoId && fase && fase.metodoId) {

  const linha = R.progressos.buscar(`${alunoId}#${fase.id}`);

    R.progressoDeTodasAsFases(alunoId).filter((p) => p.aprovadoEm).map((p) => p.faseId));

// A pergunta que o aluno faz ao abrir o aplicativo: "e agora?".
//
// A resposta segue uma ordem deliberada, e cada passo tem um porquê:
//
//   1. Lição não lida da fase atual — estudar vem antes de ser avaliado.
//   2. Jogo ainda não jogado da fase atual — fixa o que acabou de ler.
//   3. Avaliação, quando as lições já foram lidas — é o que conclui a fase.
//   4. A próxima fase liberada, quando a atual acabou.

      return {
        tipo: 'jogo',
        titulo: jogo.titulo,
        metodo: matricula.metodo ? matricula.metodo.nome : '',
        fase,

        motivo: 'Você já leu as lições desta fase — este exercício fixa o que leu.',
      };
    }

    return {
      tipo: 'avaliacao',
      titulo: `Avaliação da Fase ${fase.numero}`,
      metodo: matricula.metodo ? matricula.metodo.nome : '',
      fase,

        : `Lições e exercícios em dia. A aprovação é a partir de ${alvo.notaMinima}%.`,

    tipo: 'nada',
    titulo: 'Tudo em dia',
    destino: '#/',
    motivo: situacao.total && situacao.concluidas === situacao.total
      ? 'Você concluiu todas as fases dos seus métodos. Parabéns!'
      : 'Não há atividade liberada no momento.',

__modulos['servicos/desempenho'] = (function () {
// Análise de desempenho.
//
// "Você errou 3 de 10" não ajuda ninguém a estudar melhor. O que ajuda é
// saber ONDE se erra. Como cada questão respondida fica guardada com o
// gerador que a produziu, dá para somar acertos por assunto e dizer, com
// número, em que o aluno vai bem e em que ele tropeça.
//
// Cuidado deliberado: nada disso é afirmado com pouca evidência. Um assunto
// só é apontado como ponto fraco depois de um mínimo de questões — senão o
// aplicativo estaria chamando de dificuldade o que foi azar em duas
// perguntas.

const R = __modulos['dados/repositorios'];
const catalogo = __modulos['servicos/catalogo'];

const MINIMO_DE_QUESTOES = 6;   // abaixo disso não se conclui nada
const LIMITE_FRACO = 60;               // % de acerto que caracteriza dificuldade
const LIMITE_FORTE = 85;               // % de acerto que caracteriza domínio

const porcentagem = (parte, total) => (total > 0 ? Math.round((parte / total) * 100) : 0);

// Acertos e erros por fase, a partir do detalhe guardado em cada tentativa.
function porFase(alunoId) {
  const contagem = new Map();
  for (const resultado of R.resultadosDoAluno(alunoId)) {
    const atual = contagem.get(resultado.faseId) || { certas: 0, total: 0, tentativas: 0, notas: [] };
    atual.tentativas += 1;
    atual.notas.push({ data: resultado.data, nota: resultado.nota });
    for (const r of resultado.respostas || []) {
      atual.total += 1;
      if (r.certa) atual.certas += 1;
    }
    // Tentativa antiga, gravada antes de existir o detalhe por questão: usa
    // o total da prova, que é o que ela tem.
    if (!(resultado.respostas || []).length) {
      atual.total += resultado.total || 0;
      atual.certas += resultado.acertos || 0;
    }
    contagem.set(resultado.faseId, atual);
  }

  const aluno = R.alunos.buscar(alunoId);
  const fases = new Map(catalogo.trilhasDoAluno(aluno ? aluno.instrumentoId : '',
    { matriculas: R.matriculasDoAluno(alunoId) }).todas.map((f) => [f.id, f]));

  return [...contagem.entries()].map(([faseId, dados]) => {
    const fase = fases.get(faseId) || R.fases.buscar(faseId);
    return {
      faseId,
      assunto: fase ? `${fase.titulo}` : `Fase ${faseId}`,
      detalhe: fase ? (fase.subtitulo || '') : '',
      metodo: fase ? (fase.nomeTrilha || '') : '',
      certas: dados.certas,
      total: dados.total,
      acerto: porcentagem(dados.certas, dados.total),
      tentativas: dados.tentativas,
      notas: dados.notas.sort((a, b) => String(a.data).localeCompare(String(b.data))),
    };
  }).sort((a, b) => a.acerto - b.acerto);
}

// Acertos por gerador — o corte mais fino, para o instrutor. O gerador é a
// pergunta específica ("ler nota na clave", "completar o compasso"), então é
// aqui que aparece a dificuldade pontual.
function porAssunto(alunoId) {
  const contagem = new Map();
  for (const resultado of R.resultadosDoAluno(alunoId)) {
    for (const r of resultado.respostas || []) {
      if (!r.gerador) continue;
      const atual = contagem.get(r.gerador) || { certas: 0, total: 0, faseId: resultado.faseId };
      atual.total += 1;
      if (r.certa) atual.certas += 1;
      contagem.set(r.gerador, atual);
    }
  }
  return [...contagem.entries()]
    .map(([gerador, d]) => ({ gerador, ...d, acerto: porcentagem(d.certas, d.total) }))
    .sort((a, b) => a.acerto - b.acerto);
}

// O que dizer ao aluno. Só entra o que tem evidência suficiente.
function pontos(alunoId) {
  const fases = porFase(alunoId).filter((f) => f.total >= MINIMO_DE_QUESTOES);
  return {
    fracos: fases.filter((f) => f.acerto < LIMITE_FRACO),
    fortes: fases.filter((f) => f.acerto >= LIMITE_FORTE).sort((a, b) => b.acerto - a.acerto),
    // Sem evidência bastante ainda: dito assim, sem fingir conclusão.
    semEvidencia: porFase(alunoId).filter((f) => f.total < MINIMO_DE_QUESTOES).length,
  };
}

// A evolução das notas ao longo do tempo, para o gráfico e para a conversa
// com o instrutor.
function evolucao(alunoId, faseId = null) {
  return R.resultadosDoAluno(alunoId, faseId)
    .slice()
    .sort((a, b) => String(a.data).localeCompare(String(b.data)))
    .map((r) => ({ data: r.data, nota: r.nota, faseId: r.faseId, aprovado: r.aprovado }));
}

// Está melhorando? Compara a média das três primeiras tentativas com a das
// três últimas. Com menos de quatro tentativas, não se afirma nada.
function tendencia(alunoId) {
  const notas = evolucao(alunoId).map((e) => e.nota);
  if (notas.length < 4) return { conclusiva: false, variacao: 0 };
  const media = (lista) => Math.round(lista.reduce((s, n) => s + n, 0) / lista.length);
  const inicio = media(notas.slice(0, 3));
  const fim = media(notas.slice(-3));
  return {
    conclusiva: true,
    inicio,
    fim,
    variacao: fim - inicio,
    sentido: fim - inicio >= 5 ? 'subindo' : fim - inicio <= -5 ? 'caindo' : 'estável',
  };
}

function resumo(alunoId) {
  const resultados = R.resultadosDoAluno(alunoId);
  const comTempo = resultados.filter((r) => r.duracaoSegundos > 0);
  const eventos = R.eventosDoAluno(alunoId);
  const dias = new Set(eventos.map((e) => String(e.dataHora).slice(0, 10)));

  return {
    tentativas: resultados.length,
    aprovacoes: resultados.filter((r) => r.aprovado).length,
    melhorNota: resultados.reduce((maior, r) => Math.max(maior, r.nota), 0),
    mediaDasNotas: resultados.length
      ? Math.round(resultados.reduce((s, r) => s + r.nota, 0) / resultados.length) : 0,
    tempoMedioSegundos: comTempo.length
      ? Math.round(comTempo.reduce((s, r) => s + r.duracaoSegundos, 0) / comTempo.length) : 0,
    diasDeEstudo: dias.size,
    ultimaAtividade: eventos.length ? eventos[0].dataHora : null,
  };
}

return { MINIMO_DE_QUESTOES, porFase, porAssunto, pontos, evolucao, tendencia, resumo };
})();

__modulos['servicos/gamificacao'] = (function () {
// Gamificação.
//
// Um aviso que vale estar escrito no código, porque muda o que se pode
// acrescentar aqui depois: isto existe para sustentar a CONSTÂNCIA do estudo,
// não para criar disputa. Por isso não há placar entre alunos, não há nada
// que compare um com o outro e nenhuma conquista premia velocidade. O que se
// premia é voltar, insistir e concluir.
//
// Também não se inventa hierarquia: os níveis são numerados. Num contexto em
// que existem designações reais no ministério, dar nomes de patente a níveis
// de aplicativo confundiria coisas que não se confundem.

const R = __modulos['dados/repositorios'];
const eventos = __modulos['servicos/eventos'];

// ---------------------------------------------------------------- níveis

// A escada cresce devagar no começo, para o aluno sentir progresso cedo, e
// vai abrindo depois, para que o nível continue significando alguma coisa.
const XP_DO_NIVEL = (nivel) => Math.round(100 * nivel * (nivel + 1) / 2);

function nivelDoXp(xp) {
  let nivel = 1;
  while (xp >= XP_DO_NIVEL(nivel)) nivel += 1;
  const anterior = nivel > 1 ? XP_DO_NIVEL(nivel - 1) : 0;
  const proximo = XP_DO_NIVEL(nivel);
  return {
    nivel,
    xp,
    faltamParaOProximo: proximo - xp,
    percentualNoNivel: Math.round(((xp - anterior) / (proximo - anterior)) * 100),
  };
}

function xpDoAluno(alunoId) {
  const aluno = R.alunos.buscar(alunoId);
  const linhas = R.progressoDeTodasAsFases(alunoId);
  return (aluno ? aluno.xpHistorico || 0 : 0) + linhas.reduce((soma, l) => soma + (l.xp || 0), 0);
}

// -------------------------------------------------------------- sequência

const DIA = 86400000;
const somenteData = (iso) => String(iso).slice(0, 10);
const diasEntre = (a, b) => Math.round((Date.parse(`${a}T00:00:00Z`) - Date.parse(`${b}T00:00:00Z`)) / DIA);

// Dias seguidos de estudo. Conta até ontem, não até hoje: quem estudou ontem
// e ainda não abriu o aplicativo hoje não perdeu a sequência — ainda dá tempo.
function sequencia(alunoId, hoje = new Date().toISOString()) {
  const dias = eventos.diasComAtividade(alunoId);
  if (!dias.length) return { dias: 0, ativaHoje: false, ultimoDia: null };

  const hojeData = somenteData(hoje);
  const distanciaDoUltimo = diasEntre(hojeData, dias[0]);
  if (distanciaDoUltimo > 1) return { dias: 0, ativaHoje: false, ultimoDia: dias[0] };

  let contagem = 1;
  for (let i = 1; i < dias.length; i++) {
    if (diasEntre(dias[i - 1], dias[i]) !== 1) break;
    contagem += 1;
  }
  return { dias: contagem, ativaHoje: distanciaDoUltimo === 0, ultimoDia: dias[0] };
}

// -------------------------------------------------------------- conquistas

// Cada conquista sabe dizer sozinha se foi alcançada. Acrescentar uma nova é
// acrescentar uma linha aqui — nenhuma tela precisa saber que ela existe.
const CONQUISTAS = [
  { chave: 'primeira-licao', icone: '📖', titulo: 'Primeira lição',
    descricao: 'Você leu a sua primeira lição.',
    alcancada: (d) => d.licoesLidas >= 1 },
  { chave: 'primeira-fase', icone: '🎯', titulo: 'Primeira fase concluída',
    descricao: 'Você foi aprovado na avaliação de uma fase.',
    alcancada: (d) => d.fasesAprovadas >= 1 },
  { chave: 'cinco-fases', icone: '🏔️', titulo: 'Cinco fases',
    descricao: 'Cinco fases concluídas.',
    alcancada: (d) => d.fasesAprovadas >= 5 },
  { chave: 'metodo-completo', icone: '🎓', titulo: 'Método concluído',
    descricao: 'Você concluiu todas as fases de um método.',
    alcancada: (d) => d.metodosConcluidos >= 1 },
  { chave: 'constancia-3', icone: '🔥', titulo: 'Três dias seguidos',
    descricao: 'Você estudou três dias seguidos.',
    alcancada: (d) => d.sequencia >= 3 },
  { chave: 'constancia-7', icone: '🔥', titulo: 'Uma semana seguida',
    descricao: 'Sete dias seguidos de estudo.',
    alcancada: (d) => d.sequencia >= 7 },
  { chave: 'constancia-30', icone: '🔥', titulo: 'Um mês seguido',
    descricao: 'Trinta dias seguidos de estudo.',
    alcancada: (d) => d.sequencia >= 30 },
  { chave: 'sem-erro', icone: '💯', titulo: 'Prova sem erro',
    descricao: 'Você acertou todas as questões de uma avaliação.',
    alcancada: (d) => d.provaPerfeita },
  // A que mais importa: não desistir depois de não conseguir.
  { chave: 'superacao', icone: '💪', titulo: 'Superação',
    descricao: 'Você não passou numa avaliação, voltou e passou.',
    alcancada: (d) => d.superou },
  { chave: 'persistente', icone: '🧗', titulo: 'Persistente',
    descricao: 'Dez avaliações feitas.',
    alcancada: (d) => d.tentativas >= 10 },
  { chave: 'todos-os-jogos', icone: '🎲', titulo: 'Todos os exercícios de uma fase',
    descricao: 'Você jogou todos os exercícios de uma fase.',
    alcancada: (d) => d.faseComTodosOsJogos },
];

function retratoDoAluno(alunoId) {
  const linhas = R.progressoDeTodasAsFases(alunoId);
  const resultados = R.resultadosDoAluno(alunoId);

  // Superação: houve reprovação numa fase antes da aprovação dela.
  const porFase = new Map();
  for (const r of resultados.slice().sort((a, b) => String(a.data).localeCompare(String(b.data)))) {
    if (!porFase.has(r.faseId)) porFase.set(r.faseId, []);
    porFase.get(r.faseId).push(r);
  }
  const superou = [...porFase.values()].some((lista) => {
    const primeiraAprovacao = lista.findIndex((r) => r.aprovado);
    return primeiraAprovacao > 0 && lista.slice(0, primeiraAprovacao).some((r) => !r.aprovado);
  });

  const matriculas = R.matriculasDoAluno(alunoId);

  return {
    licoesLidas: linhas.reduce((s, l) => s + l.licoesLidas.length, 0),
    fasesAprovadas: linhas.filter((l) => l.aprovadoEm).length,
    metodosConcluidos: matriculas.filter((m) => m.situacao === 'concluida').length,
    sequencia: sequencia(alunoId).dias,
    provaPerfeita: resultados.some((r) => r.total > 0 && r.acertos === r.total),
    superou,
    tentativas: resultados.length,
    faseComTodosOsJogos: linhas.some((l) => Object.keys(l.jogos).length >= 2),
  };
}

// Confere as conquistas e grava as que acabaram de ser alcançadas. Devolve só
// as novas, para que a tela possa comemorar uma vez — e não a cada desenho.
function conferir(alunoId) {
  const retrato = retratoDoAluno(alunoId);
  const jaTem = new Set(R.conquistasDoAluno(alunoId).map((c) => c.chave));
  const novas = [];

  for (const conquista of CONQUISTAS) {
    if (jaTem.has(conquista.chave)) continue;
    if (!conquista.alcancada(retrato)) continue;
    const gravada = R.conquistas.criar({
      alunoId, chave: conquista.chave, titulo: conquista.titulo,
      descricao: conquista.descricao, icone: conquista.icone,
    });
    eventos.registrar({
      alunoId, tipo: eventos.TIPOS.CONQUISTA, titulo: `Conquista: ${conquista.titulo}`,
      detalhe: conquista.descricao,
    });
    novas.push(gravada);
  }
  return novas;
}

// O painel de conquistas: as ganhas e as que faltam, para que o aluno veja o
// que ainda dá para alcançar.
function painel(alunoId) {
  const ganhas = new Map(R.conquistasDoAluno(alunoId).map((c) => [c.chave, c]));
  return CONQUISTAS.map((c) => ({
    ...c,
    ganha: ganhas.has(c.chave),
    conquistadaEm: ganhas.has(c.chave) ? ganhas.get(c.chave).conquistadaEm : null,
  }));
}

function resumo(alunoId) {
  const xp = xpDoAluno(alunoId);
  return {
    ...nivelDoXp(xp),
    sequencia: sequencia(alunoId),
    conquistas: R.conquistasDoAluno(alunoId).length,
    totalDeConquistas: CONQUISTAS.length,
  };
}

return { XP_DO_NIVEL, nivelDoXp, xpDoAluno, sequencia, CONQUISTAS, conferir, painel, resumo };
})();

__modulos['servicos/auditoria'] = (function () {
// Auditoria.
//
// Registra o que foi feito, por quem, e o que mudou — para as ações que têm
// consequência para alguém: nota, aprovação, certificado, matrícula, método,
// conteúdo, entrada no painel, migração, rollback.
//
// Uma regra dura: senha nunca entra aqui. Nem em `dadosAntes`, nem em
// `dadosDepois`, nem por descuido de quem chama. Os campos de senha são
// retirados na entrada, pela camada de compatibilidade — porque um registro
// de auditoria é feito para ser lido depois por outra pessoa.

const R = __modulos['dados/repositorios'];

const ACOES = {
  NOTA_ALTERADA: 'nota.alterar',
  APROVACAO: 'fase.aprovar',
  REPROVACAO: 'fase.reprovar',
  CERTIFICADO: 'certificado.emitir',
  MATRICULA_CRIADA: 'matricula.criar',
  MATRICULA_ALTERADA: 'matricula.alterar',
  METODO_ALTERADO: 'metodo.alterar',
  METODO_IMPORTADO: 'metodo.importar',
  VERSAO_PUBLICADA: 'versao.publicar',
  CONTEUDO_ALTERADO: 'conteudo.alterar',
  LOGIN_ADMIN: 'acesso.login',
  ROLLBACK: 'dados.rollback',
  MIGRACAO: 'dados.migracao',
  DADOS_APAGADOS: 'dados.apagar',
};

function quemEsta() {
  const sessao = R.sessaoAtual();
  if (!sessao) return { usuarioId: null, papel: null };
  return { usuarioId: sessao.usuarioId, papel: sessao.papel };
}

function registrar({ acao, entidade, entidadeId = null, dadosAntes = null, dadosDepois = null, usuarioId = null, papel = null }) {
  const quem = quemEsta();
  return R.auditorias.criar({
    usuarioId: usuarioId || quem.usuarioId,
    papel: papel || quem.papel,
    acao, entidade, entidadeId, dadosAntes, dadosDepois,
    dataHora: new Date().toISOString(),
  });
}

function listar({ limite = 100, acao = null, entidade = null } = {}) {
  return R.auditorias.listar()
    .filter((a) => (acao ? a.acao === acao : true))
    .filter((a) => (entidade ? a.entidade === entidade : true))
    .sort((a, b) => String(b.dataHora).localeCompare(String(a.dataHora)))
    .slice(0, limite);
}

const doRegistro = (entidade, entidadeId) =>
  R.auditorias.listar((a) => a.entidade === entidade && a.entidadeId === entidadeId)
    .sort((a, b) => String(b.dataHora).localeCompare(String(a.dataHora)));

return { ACOES, registrar, listar, doRegistro };
})();

__modulos['servicos/avaliacoes'] = (function () {
// Avaliações.
//
// Duas mudanças de fundo em relação a como isto funcionava antes:
//
//   1. Toda tentativa fica guardada, e agora COM O DETALHE de cada questão:
//      qual gerador a produziu e se o aluno acertou. Sem esse detalhe é
//      impossível dizer a ele onde está errando — só dá para dizer que
//      errou. Guardamos o mínimo para a análise (gerador, assinatura, certo
//      ou errado), não o texto inteiro da prova.
//
//   2. A prova de uma fase sem geradores — um método importado por arquivo —
//      é montada a partir das questões cadastradas. Antes, uma fase assim
//      simplesmente não tinha avaliação.

const R = __modulos['dados/repositorios'];
const { corrigir: corrigirProva, montarProva } = __modulos['quiz'];
const { criarAleatorio, embaralhar, novaSemente } = __modulos['aleatorio'];
const { geradoresDaFase, totalDeVariantes } = __modulos['conteudo/geradores'];
const { perguntasIneditas } = __modulos['quiz'];
const { notaMinimaDaFase } = __modulos['servicos/progresso'];
const eventos = __modulos['servicos/eventos'];

const temGeradores = (faseId, contexto = null) => geradoresDaFase(faseId, contexto).length > 0;

// Prova montada a partir das questões cadastradas. Serve para métodos que
// vieram de arquivo: não há código que gere perguntas, há um banco escrito.
function provaDeQuestoesCadastradas(fase, usadas, { quantidade, semente }) {
  const avaliacao = R.avaliacaoDaFase(fase.id);
  const banco = avaliacao ? R.questoesDaAvaliacao(avaliacao.id) : [];
  // Questão em rascunho não vai para prova: conteúdo gerado ou importado
  // espera revisão humana antes de valer nota.
  const aprovadas = banco.filter((q) => q.status !== 'rascunho');
  const rnd = criarAleatorio(semente);
  const jaVistas = new Set(usadas);

  let disponiveis = aprovadas.filter((q) => !jaVistas.has(q.id));
  let reciclou = false;
  if (disponiveis.length < quantidade) {
    reciclou = disponiveis.length < aprovadas.length;
    disponiveis = aprovadas;
  }

  const questoes = embaralhar(disponiveis, rnd).slice(0, quantidade).map((q, indice) => ({
    indice,
    assinatura: q.id,
    geradorId: `cadastrada:${fase.id}`,
    enunciado: q.enunciado,
    html: '',
    alternativas: embaralhar([...(q.alternativas || [])], rnd),
    correta: q.correta,
    explicacao: q.explicacao || '',
    referencia: q.origem || '',
  }));

  return {
    faseId: String(fase.id), semente, reciclou, questoes,
    ineditasRestantes: Math.max(0, aprovadas.length - jaVistas.size),
  };
}

// Monta a prova da fase, venha ela de gerador ou de banco cadastrado.
function montar(fase, usadas = [], { quantidade = null, semente = novaSemente() } = {}) {
  const avaliacao = R.avaliacaoDaFase(fase.id);
  const quantas = quantidade || (avaliacao ? avaliacao.quantidadeDeQuestoes : 10);
  if (temGeradores(fase.id, fase.contexto)) {
    return montarProva(fase.id, usadas, { quantidade: quantas, semente, contexto: fase.contexto });
  }
  return provaDeQuestoesCadastradas(fase, usadas, { quantidade: quantas, semente });
}

// Quantas questões a prova desta fase tem, e quantas ainda estão inéditas
// para este aluno. Serve à tela da fase, que antes anunciava sempre "10
// questões" e "70%" — números do MSA que não valem para um método importado.
function combinacaoDaFase(fase, usadas = [], alunoId = null) {
  const avaliacao = R.avaliacaoDaFase(fase.id);
  const quantidade = avaliacao ? avaliacao.quantidadeDeQuestoes : 10;

  if (temGeradores(fase.id, fase.contexto)) {
    return {
      quantidade,
      notaMinima: notaMinimaDaFase(fase, alunoId),
      total: totalDeVariantes(fase.id, fase.contexto),
      ineditas: perguntasIneditas(fase.id, usadas, fase.contexto),
      origem: 'geradores',
    };
  }

  const banco = avaliacao ? R.questoesDaAvaliacao(avaliacao.id).filter((q) => q.status !== 'rascunho') : [];
  const jaVistas = new Set(usadas);
  return {
    quantidade: Math.min(quantidade, banco.length) || quantidade,
    notaMinima: notaMinimaDaFase(fase, alunoId),
    total: banco.length,
    ineditas: banco.filter((q) => !jaVistas.has(q.id)).length,
    origem: 'cadastradas',

  const resultado = corrigirProva(prova, respostas);
  // A nota mínima é da turma do aluno, ou da fase: um método pode exigir mais
  // que o aplicativo, e uma turma pode exigir mais que o método.
  const minima = fase ? notaMinimaDaFase(fase, alunoId) : 70;
  return { ...resultado, notaMinima: minima, aprovado: resultado.nota >= minima };
}

// O detalhe guardado por questão. Compacto de propósito: é o suficiente para
// dizer ao aluno onde ele erra, sem encher o armazenamento do aparelho com o
// texto de todas as provas que ele já fez.
const detalhePorQuestao = (resultado) => resultado.detalhes.map((d) => ({
  gerador: d.questao.geradorId || '',
  assinatura: d.questao.assinatura || '',
  certa: Boolean(d.certa),
}));

// Registra a tentativa: o resultado, o histórico de perguntas usadas, o
// progresso da fase e o evento da linha do tempo. Um lugar só, para que
// nenhuma tela precise lembrar de fazer as cinco coisas.
function registrarTentativa({ alunoId, fase, prova, resultado, duracaoSegundos = 0, data = null }) {
  const matricula = R.matriculasDoAluno(alunoId).find((m) => m.metodoId === fase.metodoId) || null;
  // A data é a da tentativa, não a de quando o registro foi gravado. Importa
  // para o histórico: uma cópia importada meses depois não pode carimbar
  // todas as avaliações do aluno com a data da importação.
  const agora = data || new Date().toISOString();

  const registro = R.resultados.criar({
    alunoId,
    matriculaId: matricula ? matricula.id : null,
    faseId: String(fase.id),
    avaliacaoId: (R.avaliacaoDaFase(fase.id) || {}).id || `av-${fase.id}`,
    data: agora,
    nota: resultado.nota,
    acertos: resultado.acertos,
    total: resultado.total,
    aprovado: resultado.aprovado,
    respostas: detalhePorQuestao(resultado),
    duracaoSegundos,
  });

  const linha = R.progressoDoAluno(alunoId, fase.id);
  linha.matriculaId = linha.matriculaId || (matricula ? matricula.id : null);
  linha.usadas = [...linha.usadas, ...prova.questoes.map((q) => q.assinatura)];
  linha.melhorNota = Math.max(linha.melhorNota || 0, resultado.nota);
  linha.iniciadoEm = linha.iniciadoEm || agora;
  const primeiraAprovacao = resultado.aprovado && !linha.aprovadoEm;
  if (primeiraAprovacao) linha.aprovadoEm = agora;
  linha.xp = (linha.xp || 0) + resultado.acertos * 10 + (resultado.aprovado ? 50 : 0);
  linha.atualizadoEm = agora;
  R.progressos.salvar(linha);

  eventos.registrar({
    alunoId, matriculaId: linha.matriculaId, tipo: eventos.TIPOS.AVALIACAO,
    titulo: `Avaliação — Fase ${fase.numero}`,
    detalhe: `${resultado.nota}% · ${resultado.acertos} de ${resultado.total}`,
    faseId: fase.id, valor: resultado.nota, dataHora: agora,
  });

  if (primeiraAprovacao) {
    eventos.registrar({
      alunoId, matriculaId: linha.matriculaId, tipo: eventos.TIPOS.APROVACAO,
      titulo: `Aprovado na Fase ${fase.numero}`,
      detalhe: fase.titulo, faseId: fase.id, valor: resultado.nota, dataHora: agora,

  }

  return { registro, linha, primeiraAprovacao, matricula };

// há próxima, ela se conclui — e é isso que faz um certificado de conclusão
// de método fazer sentido mais adiante.
function avancarMatricula(matricula, fase) {
  if (!matricula) return;
  const fases = R.fasesDoMetodo(matricula.metodoId).filter((f) => f.ativo !== false);
  const aprovadas = new Set(R.progressoDeTodasAsFases(matricula.alunoId)
    .filter((p) => p.aprovadoEm).map((p) => p.faseId));
  const pendente = fases.find((f) => !aprovadas.has(f.id));

  const mudancas = { faseAtualId: pendente ? pendente.id : fase.id };

    mudancas.situacao = 'concluida';
    mudancas.dataFim = new Date().toISOString();
  }
  R.matriculas.atualizar(matricula.id, mudancas);
}

// Certificados.
//
// Um certificado é a única coisa que sai do aplicativo e vai para a mão de
// outra pessoa. Por isso ele precisa de duas propriedades que o resto não
// precisa:
//
//   Não mudar. O que está escrito nele foi verdade no dia em que foi emitido.
//   Se o método for corrigido no ano seguinte — outra ordem de fases, outro
//   título — o certificado de quem já concluiu continua dizendo o que ele
//   concluiu. Por isso ele guarda um RETRATO: cópia dos dados do momento da
//   emissão, e não referências ao cadastro vivo.
//

//   dizer se o papel corresponde ao registro do aparelho.
//
// Do que este resumo protege, com honestidade: de alteração acidental e de
// adulteração casual do arquivo exportado. Ele NÃO é assinatura digital —
// quem sabe abrir o código pode recalculá-lo. Vale como conferência, não como
// prova contra falsificação decidida.

const R = __modulos['dados/repositorios'];
const { sha256 } = __modulos['senha'];
const { montarCertificado } = __modulos['certificado'];
const eventos = __modulos['servicos/eventos'];
const auditoria = __modulos['servicos/auditoria'];

// Os campos que entram no resumo, na ordem — mudar esta lista invalida os
// resumos já emitidos, então ela é parte do formato.
const CAMPOS_DO_RESUMO = ['codigo', 'aluno', 'faseId', 'metodoId', 'versaoRotulo', 'nota', 'data'];

function calcularHash(certificado) {
  const partes = CAMPOS_DO_RESUMO.map((campo) => `${campo}=${certificado[campo] ?? ''}`);

// Emite o certificado de uma fase aprovada. Idempotente por fase: reaprovar a
// mesma fase com nota melhor atualiza a nota, mas não cria um segundo
// certificado nem muda o número do primeiro.
function emitir({ alunoId, fase, nota, acertos, total, responsavel = null, data = null }) {
  const aluno = R.alunos.buscar(alunoId);
  if (!aluno) throw new Error('Aluno não encontrado.');

  const matricula = R.matriculasDoAluno(alunoId).find((m) => m.metodoId === fase.metodoId) || null;
  const metodo = R.metodos.buscar(fase.metodoId);
  const versao = fase.versaoId ? R.versoes.buscar(fase.versaoId) : (metodo ? R.versaoVigente(metodo.id) : null);
  const instrumento = matricula && matricula.instrumentoId ? R.instrumentos.buscar(matricula.instrumentoId) : null;

    matriculaId: matricula ? matricula.id : null,

      metodo: metodo ? metodo.nome : '',

  const esperado = calcularHash(certificado);
  if (esperado !== certificado.hash) {
    return { valido: false, certificado, motivo: 'Os dados do certificado não correspondem ao resumo gravado.' };
  }
  return { valido: true, certificado };
}

const doAluno = (alunoId) => R.certificadosDoAluno(alunoId)
  .slice().sort((a, b) => (Number(a.numero) || 0) - (Number(b.numero) || 0));

__modulos['servicos/estudo'] = (function () {
// Estudo: o que o aluno faz e que precisa ficar registrado.
//
// Ler uma lição e jogar um exercício eram, até aqui, duas gravações soltas no
// armazenamento. Viraram serviço por um motivo prático: cada uma delas produz
// mais de um efeito — o progresso, o evento da linha do tempo, a conferência
// das conquistas. Espalhar isso pelas telas seria pedir que alguém esquecesse
// um dos três.

const R = __modulos['dados/repositorios'];
const eventos = __modulos['servicos/eventos'];
const gamificacao = __modulos['servicos/gamificacao'];

const matriculaDaFase = (alunoId, faseId) => {
  const fase = R.fases.buscar(String(faseId));
  if (!fase) return null;
  return R.matriculasDoAluno(alunoId).find((m) => m.metodoId === fase.metodoId) || null;
};

const tituloDaFase = (faseId) => {
  const fase = R.fases.buscar(String(faseId));
  return fase ? fase.titulo : `Fase ${faseId}`;
};

function marcarLicaoLida(alunoId, faseId, indice, { titulo = '' } = {}) {
  const linha = R.progressoDoAluno(alunoId, faseId);
  if (linha.licoesLidas.includes(indice)) return { linha, novidade: false, conquistas: [] };

  const matricula = matriculaDaFase(alunoId, faseId);
  const agora = new Date().toISOString();
  linha.matriculaId = linha.matriculaId || (matricula ? matricula.id : null);
  linha.licoesLidas.push(indice);
  linha.xp = (linha.xp || 0) + 5;
  linha.iniciadoEm = linha.iniciadoEm || agora;
  linha.atualizadoEm = agora;
  R.progressos.salvar(linha);

  eventos.registrar({
    alunoId, matriculaId: linha.matriculaId, tipo: eventos.TIPOS.LICAO_LIDA,
    titulo: `Lição ${indice + 1} — ${titulo || tituloDaFase(faseId)}`,
    detalhe: tituloDaFase(faseId), faseId: String(faseId), valor: 5, dataHora: agora,
  });

  return { linha, novidade: true, conquistas: gamificacao.conferir(alunoId) };
}

function registrarJogo(alunoId, faseId, tipo, pontos) {
  const linha = R.progressoDoAluno(alunoId, faseId);
  const anterior = linha.jogos[tipo] || 0;
  const recorde = pontos > anterior;
  const matricula = matriculaDaFase(alunoId, faseId);
  const agora = new Date().toISOString();

  linha.matriculaId = linha.matriculaId || (matricula ? matricula.id : null);
  if (recorde) {
    linha.jogos[tipo] = pontos;
    linha.xp = (linha.xp || 0) + Math.max(0, pontos - anterior);
  }
  linha.iniciadoEm = linha.iniciadoEm || agora;
  linha.atualizadoEm = agora;
  R.progressos.salvar(linha);

  eventos.registrar({
    alunoId, matriculaId: linha.matriculaId, tipo: eventos.TIPOS.JOGO,
    titulo: tipo, detalhe: `${pontos} pontos${recorde && anterior ? ' — novo recorde' : ''}`,
    faseId: String(faseId), valor: pontos, dataHora: agora,
  });

}

function registrarUsadas(alunoId, faseId, assinaturas) {
  const linha = R.progressoDoAluno(alunoId, faseId);
  linha.usadas = [...linha.usadas, ...assinaturas];
  R.progressos.salvar(linha);
  return linha;
}

return { marcarLicaoLida, registrarJogo, registrarUsadas };
})();

__modulos['servicos/recomendacao'] = (function () {
// Recomendação.
//
// Regras determinísticas e explicáveis, de propósito. Uma recomendação que o
// aluno não entende é indistinguível de um palpite, e num aplicativo de
// estudo isso corrói a confiança no que ele mostra. Aqui, toda recomendação
// vem com o motivo e com o número que a sustenta.
//
// A ordem também é deliberada: reforçar antes de avançar. Se há dificuldade
// medida em um assunto, revisar vem primeiro; só depois o próximo passo.

const desempenho = __modulos['servicos/desempenho'];
const { proximaAtividade } = __modulos['servicos/progresso'];
const R = __modulos['dados/repositorios'];
const catalogo = __modulos['servicos/catalogo'];

function recomendar(alunoId) {
  const { fracos } = desempenho.pontos(alunoId);
  const seguinte = proximaAtividade(alunoId);

  // 1. Dificuldade medida: revisar a fase onde ela está, antes de seguir.
  if (fracos.length) {
    const alvo = fracos[0];
    const aluno = R.alunos.buscar(alunoId);
    const fase = catalogo.faseDoAluno(alvo.faseId, aluno ? aluno.instrumentoId : '',
      { matriculas: R.matriculasDoAluno(alunoId) });
    const jogo = fase && (fase.jogos || [])[0];

    return {
      prioridade: 'reforco',
      titulo: `Revisar ${alvo.assunto}`,
      motivo: `Você acertou ${alvo.acerto}% das ${alvo.total} questões desta fase — abaixo do que costuma acertar nas outras.`,
      destino: jogo ? `#/fase/${alvo.faseId}/jogo/0` : `#/fase/${alvo.faseId}`,
      acao: jogo ? `Exercício: ${jogo.titulo}` : 'Rever as lições da fase',
      faseId: alvo.faseId,
      antesDe: seguinte,
    };
  }

  // 2. Sem dificuldade medida: o próximo passo do método.
  return {
    prioridade: 'seguir',
    titulo: seguinte.titulo,
    motivo: seguinte.motivo,
    destino: seguinte.destino,
    acao: { licao: 'Ler a lição', jogo: 'Jogar', avaliacao: 'Fazer a avaliação', nada: '' }[seguinte.tipo] || '',
    faseId: seguinte.fase ? seguinte.fase.id : null,
    antesDe: null,
  };
}

return { recomendar };
})();

__modulos['servicos/alertas'] = (function () {
// Alertas do instrutor.
//
// O painel de um instrutor com trinta alunos é inútil se ele tiver que
// procurar quem precisa de ajuda. O que ele precisa é da lista curta: quem
// parou, quem está travado, quem concluiu.
//
// Duas decisões que evitam que isto vire ruído:
//
//   Todo alerta tem um número por trás. "Está há 12 dias sem estudar", e não
//   "parece desmotivado" — o instrutor confere e decide.
//
//   Alerta de aluno que nunca começou não se repete todo dia como se fosse
//   novidade: ele é do tipo "nunca começou", que é um fato, e não um atraso.

const R = __modulos['dados/repositorios'];
const eventos = __modulos['servicos/eventos'];
const progresso = __modulos['servicos/progresso'];
const desempenho = __modulos['servicos/desempenho'];

const DIAS_PARADO = 7;
const TENTATIVAS_TRAVADO = 3;

const DIA = 86400000;
const diasDesde = (iso, agora) => (iso ? Math.floor((Date.parse(agora) - Date.parse(iso)) / DIA) : null);

const GRAVIDADE = { ATENCAO: 'atencao', AVISO: 'aviso', BOA: 'boa' };

function doAluno(alunoId, { agora = new Date().toISOString() } = {}) {
  const aluno = R.alunos.buscar(alunoId);
  if (!aluno) return [];
  const lista = [];
  const primeiroNome = String(aluno.nome).split(' ')[0];
  const ultima = eventos.ultimaAtividade(alunoId);

  // 1. Nunca começou.
  if (!ultima) {
    lista.push({
      alunoId, gravidade: GRAVIDADE.AVISO, chave: 'nunca-comecou',
      texto: `${primeiroNome} ainda não iniciou nenhuma atividade.`,
      desde: aluno.criadoEm,
    });
  } else {
    // 2. Parou de estudar.
    const dias = diasDesde(ultima, agora);
    if (dias >= DIAS_PARADO) {
      lista.push({
        alunoId, gravidade: dias >= DIAS_PARADO * 2 ? GRAVIDADE.ATENCAO : GRAVIDADE.AVISO,
        chave: 'parado',
        texto: `${primeiroNome} está há ${dias} dias sem estudar.`,
        desde: ultima, valor: dias,
      });
    }
  }

  // 3. Travado numa fase: tentou várias vezes e não passou.
  const situacao = progresso.situacaoDoAluno(alunoId);
  for (const matricula of situacao.matriculas) {
    const atual = matricula.situacaoDaFaseAtual;
    if (atual && !atual.aprovada && atual.tentativas >= TENTATIVAS_TRAVADO) {
      lista.push({
        alunoId, gravidade: GRAVIDADE.ATENCAO, chave: 'travado',
        texto: `${primeiroNome} tentou ${atual.tentativas} vezes a avaliação da Fase ${atual.fase.numero} (${atual.fase.titulo}); a melhor nota foi ${atual.melhorNota}%.`,
        faseId: atual.faseId, valor: atual.tentativas,
      });
    }
  }

  // 4. Dificuldade recorrente num assunto.
  for (const fraco of desempenho.pontos(alunoId).fracos) {
    lista.push({
      alunoId, gravidade: GRAVIDADE.ATENCAO, chave: 'dificuldade',
      texto: `${primeiroNome} acerta ${fraco.acerto}% em ${fraco.assunto} (${fraco.total} questões respondidas).`,
      faseId: fraco.faseId, valor: fraco.acerto,
    });
  }

  //    serve para o instrutor saber quem parabenizar.
  for (const evento of R.eventosDoAluno(alunoId, 30)) {
    if (evento.tipo !== eventos.TIPOS.APROVACAO) continue;
    if (diasDesde(evento.dataHora, agora) > 7) continue;
    lista.push({
      alunoId, gravidade: GRAVIDADE.BOA, chave: 'concluiu',
      texto: `${primeiroNome} concluiu a ${evento.titulo.replace('Aprovado na ', '')} — ${evento.detalhe}.`,
      faseId: evento.faseId, desde: evento.dataHora,
    });
  }

  // 6. Ficha incompleta atrapalha o acompanhamento.
  if (!aluno.instrumentoId && !aluno.instrumento) {
    lista.push({
      alunoId, gravidade: GRAVIDADE.AVISO, chave: 'sem-instrumento',
      texto: `${primeiroNome} está sem instrumento definido — a trilha do método do instrumento não abre.`,
    });

const ORDEM = { [GRAVIDADE.ATENCAO]: 0, [GRAVIDADE.AVISO]: 1, [GRAVIDADE.BOA]: 2 };

function doInstrutor({ agora = new Date().toISOString(), limite = 20 } = {}) {
  return R.alunos.listar()
    .flatMap((a) => doAluno(a.id, { agora }))
    .sort((a, b) => ORDEM[a.gravidade] - ORDEM[b.gravidade])
    .slice(0, limite);

// A situação de um aluno em uma palavra, para a lista do painel. Nunca só por

function situacaoDoAluno(alunoId, { agora = new Date().toISOString() } = {}) {
  const alertas = doAluno(alunoId, { agora });

    return { chave: 'atencao', texto: 'precisa de atenção', icone: '🔴' };

  if (alertas.some((a) => a.gravidade === GRAVIDADE.AVISO)) {
    return { chave: 'aviso', texto: 'acompanhar', icone: '🟡' };
  }
  const ultima = eventos.ultimaAtividade(alunoId);
  if (!ultima) return { chave: 'aviso', texto: 'não começou', icone: '🟡' };
  return { chave: 'em-dia', texto: 'em dia', icone: '🟢' };

__modulos['servicos/metodos'] = (function () {
// Cadastrar um método pela tela, sem arquivo nenhum.
//
// O aplicativo já sabia importar um método de um JSON com tudo dentro. Isso
// serve a quem tem o método já estruturado — e não serve a quem tem o método
// impresso na mão. Este arquivo é o outro caminho: o instrutor cria o método,
// anexa o PDF que os alunos vão ler, e escreve as fases e as lições dizendo
// em que página de cada uma está.
//
// O que este módulo NÃO faz, e é bom dizer: ele não lê o PDF. Transformar um
// livro em fases, lições e questões é trabalho de quem conhece o método — o
// aplicativo roda no aparelho, sem servidor e sem internet, e inventar esse
// conteúdo seria produzir método que ninguém escreveu.

const R = __modulos['dados/repositorios'];
const { novoId } = __modulos['dados/ids'];
const arquivos = __modulos['arquivos'];

const MATERIAL_MAXIMO = arquivos.TAMANHO_MAXIMO;
const NOTA_MINIMA_PADRAO = 70;

const metodos = () => R.metodos.listar().sort((a, b) => (a.ordem || 0) - (b.ordem || 0)
  || a.nome.localeCompare(b.nome, 'pt-BR'));

const metodoPorId = (id) => R.metodos.buscar(id);

// O MSA e o método do instrumento vêm com o aplicativo: o texto das lições
// deles é código que desenha pentagramas e monta tabelas, e a fase cadastrada
// só aponta para ele. Editar essas lições por aqui seria mentir — o que a tela
// mostraria não é o que o aluno leria. Daí a pergunta existir.
//
// A pergunta certa não é "tem conteudoRef?" — toda fase tem, porque o padrão é
// o próprio id. É "esse apelido encontra conteúdo no código?", e quem sabe
// responder é o catálogo.
const ehDoAplicativo = (metodoId) => R.fasesDoMetodo(metodoId)
  .some((f) => __modulos['servicos/catalogo'].temConteudoEmCodigo(f.conteudoRef));

// Quem já está estudando o método. Um método com gente dentro não é removido.
const alunosNoMetodo = (metodoId) => R.matriculas.listar((m) => m.metodoId === metodoId).length;

function criarMetodo(dados = {}) {
  const nome = String(dados.nome || '').trim();
  if (!nome) throw new Error('O método precisa de um nome.');
  const id = novoId('me');
  const metodo = R.metodos.criar({
    id,
    nome,
    descricao: dados.descricao,
    fonte: dados.fonte,
    instrumentoIds: dados.instrumentoIds || [],
    universal: dados.universal === undefined ? true : Boolean(dados.universal),
    porInstrumento: false,
    ordem: metodos().length + 1,
    materiais: [],
    ativo: true,
  });
  // Todo método precisa de uma versão publicada: é ela que congela o conteúdo
  // e para onde o histórico do aluno aponta.
  R.versoes.criar({
    id: `${id}-1`,
    metodoId: id,
    rotulo: '1.0',
    situacao: 'publicada',
    ordem: 1,
    publicadaEm: new Date().toISOString(),
    notas: dados.fonte || '',
  });
  return metodo;
}

const editarMetodo = (id, mudancas) => R.metodos.atualizar(id, mudancas);

/** Remove o método, as fases, as lições, as avaliações e o PDF. */
async function removerMetodo(id) {
  const metodo = metodoPorId(id);
  if (!metodo) return false;
  if (ehDoAplicativo(id)) throw new Error('Este método vem com o aplicativo e não pode ser removido.');
  const emUso = alunosNoMetodo(id);
  if (emUso) {
    throw new Error(`${emUso} ${emUso === 1 ? 'aluno está matriculado' : 'alunos estão matriculados'} neste método. Encerre as matrículas antes de removê-lo.`);
  }
  const turmas = R.turmas.listar((t) => t.metodoId === id).length;
  if (turmas) throw new Error(`${turmas} ${turmas === 1 ? 'turma usa' : 'turmas usam'} este método.`);

  for (const material of metodo.materiais) await arquivos.remover(material.id).catch(() => undefined);
  for (const fase of R.fasesDoMetodo(id)) removerFase(fase.id);
  for (const versao of R.versoesDoMetodo(id)) R.versoes.remover(versao.id);
  R.metodos.remover(id);
  return true;
}

/**
 * Matricula no método os alunos que ele serve e que ainda não estão nele.
 *
 * Um método criado hoje não alcança sozinho quem já estava cadastrado ontem:
 * a matrícula é feita quando o aluno entra. Isto é o botão que fecha essa
 * distância, e é explícito de propósito — matricular a turma inteira sem
 * ninguém pedir seria decidir pelo instrutor.
 */
function matricularAlunos(metodoId) {
  const metodo = metodoPorId(metodoId);
  if (!metodo) throw new Error('Método não encontrado.');
  const versao = R.versaoVigente(metodoId);
  let criadas = 0;
  for (const aluno of R.alunos.listar((a) => a.ativo !== false)) {
    const serve = metodo.universal || (metodo.instrumentoIds || []).includes(aluno.instrumentoId);
    if (!serve) continue;
    if (R.matriculasDoAluno(aluno.id).some((m) => m.metodoId === metodoId)) continue;
    R.matriculas.criar({
      id: novoId('mt'),
      alunoId: aluno.id,
      instrumentoId: aluno.instrumentoId || '',
      metodoId,
      versaoId: versao ? versao.id : null,
      dataInicio: new Date().toISOString(),
      situacao: 'em_curso',
    });
    criadas++;
  }
  return criadas;
}

// ------------------------------------------------------------------- fases

function criarFase(metodoId, dados = {}) {
  const metodo = metodoPorId(metodoId);
  if (!metodo) throw new Error('Método não encontrado.');
  if (ehDoAplicativo(metodoId)) throw new Error('As fases deste método vêm com o aplicativo.');
  const titulo = String(dados.titulo || '').trim();
  if (!titulo) throw new Error('A fase precisa de um título.');

  const existentes = R.fasesDoMetodo(metodoId);
  const anterior = existentes[existentes.length - 1] || null;
  const versao = R.versaoVigente(metodoId);
  const id = novoId('fa');

  const fase = R.fases.criar({
    id,
    metodoId,
    versaoId: versao ? versao.id : `${metodoId}-1`,
    ordem: existentes.length + 1,
    titulo,
    subtitulo: dados.subtitulo,
    resumo: dados.resumo,
    icone: dados.icone || '📘',
    cor: dados.cor || '#2f9e6b',
    paginas: dados.paginas || null,
    anteriorId: anterior ? anterior.id : null,
    conteudoRef: '',
    notaMinima: Number(dados.notaMinima) || NOTA_MINIMA_PADRAO,
    ativo: true,
  });
  // A avaliação nasce junto, vazia. Sem ela a fase não teria onde guardar as
  // questões que o instrutor escrever depois.
  R.avaliacoes.criar({
    id: `av-${id}`,
    faseId: id,
    titulo: `Avaliação — ${titulo}`,
    quantidadeDeQuestoes: 10,
    notaMinima: Number(dados.notaMinima) || NOTA_MINIMA_PADRAO,
    geradorRef: '',
  });

}

function editarFase(faseId, mudancas = {}) {
  const fase = R.fases.buscar(faseId);
  if (!fase) throw new Error('Fase não encontrada.');
  if (__modulos['servicos/catalogo'].temConteudoEmCodigo(fase.conteudoRef)) {
    throw new Error('Esta fase vem com o aplicativo.');
  }
  const atualizada = R.fases.atualizar(faseId, mudancas);
  const avaliacao = R.avaliacaoDaFase(faseId);
  if (avaliacao && mudancas.notaMinima !== undefined) {
    R.avaliacoes.atualizar(avaliacao.id, { notaMinima: atualizada.notaMinima });
  }
  return atualizada;
}

/**
 * Remove a fase, as lições e a avaliação dela, e costura a corrente: a fase
 * seguinte passa a apontar para a anterior da removida, senão ficaria trancada
 * atrás de uma fase que não existe mais.
 */
function removerFase(faseId) {
  const fase = R.fases.buscar(faseId);
  if (!fase) return false;
  const seguinte = R.fases.listar((f) => f.anteriorId === faseId);
  for (const licao of R.licoesDaFase(faseId)) R.licoes.remover(licao.id);
  const avaliacao = R.avaliacaoDaFase(faseId);
  if (avaliacao) {
    for (const questao of R.questoesDaAvaliacao(avaliacao.id)) R.questoes.remover(questao.id);
    R.avaliacoes.remover(avaliacao.id);
  }
  R.fases.remover(faseId);
  for (const f of seguinte) R.fases.atualizar(f.id, { anteriorId: fase.anteriorId });

  return true;

// A ordem é o número que o aluno vê ("Fase 3"). Depois de remover uma fase do
// meio, deixar um buraco na numeração confundiria a turma inteira.
function renumerar(metodoId) {
  R.fasesDoMetodo(metodoId).forEach((fase, i) => {
    if (fase.ordem !== i + 1) R.fases.atualizar(fase.id, { ordem: i + 1 });
  });
}

function criarLicao(faseId, dados = {}) {
  const fase = R.fases.buscar(faseId);
  if (!fase) throw new Error('Fase não encontrada.');
  if (__modulos['servicos/catalogo'].temConteudoEmCodigo(fase.conteudoRef)) {
    throw new Error('As lições desta fase vêm com o aplicativo.');
  }
  const titulo = String(dados.titulo || '').trim();
  if (!titulo) throw new Error('A lição precisa de um título.');
  const existentes = R.licoesDaFase(faseId);
  return R.licoes.criar({
    id: novoId('li'),
    faseId,
    ordem: existentes.length + 1,
    titulo,
    pagina: dados.pagina === undefined || dados.pagina === '' ? null : dados.pagina,
    corpo: dados.corpo || '',
    conteudoRef: '',
  });
}

const editarLicao = (licaoId, mudancas) => R.licoes.atualizar(licaoId, mudancas);

function removerLicao(licaoId) {
  const licao = R.licoes.buscar(licaoId);
  if (!licao) return false;
  R.licoes.remover(licaoId);
  R.licoesDaFase(licao.faseId).forEach((l, i) => {
    if (l.ordem !== i + 1) R.licoes.atualizar(l.id, { ordem: i + 1 });
  });
  return true;
}

// ---------------------------------------------------------------- o PDF

async function anexarMaterial(metodoId, arquivo, { adicionadoPor = '' } = {}) {
  const metodo = metodoPorId(metodoId);
  if (!metodo) throw new Error('Método não encontrado.');
  if (!arquivo) throw new Error('Escolha um arquivo.');
  if (arquivo.type !== 'application/pdf') throw new Error('O método precisa ser um arquivo PDF.');
  if (arquivo.size > MATERIAL_MAXIMO) {
    throw new Error(`O arquivo tem ${Math.round(arquivo.size / 1024 / 1024)} MB. O limite é ${MATERIAL_MAXIMO / 1024 / 1024} MB.`);
  }
  if (!arquivos.disponivel()) throw new Error('Este navegador não guarda arquivos neste aparelho.');

  const id = novoId('mat');
  await arquivos.guardar(id, arquivo);
  const ficha = {
    id, nome: arquivo.name, tipo: arquivo.type, tamanho: arquivo.size,
    adicionadoEm: new Date().toISOString(), adicionadoPor,
  };

async function removerMaterial(metodoId, idDoMaterial) {
  const metodo = metodoPorId(metodoId);
  if (!metodo) throw new Error('Método não encontrado.');
  await arquivos.remover(idDoMaterial).catch(() => undefined);
  return R.metodos.atualizar(metodoId, { materiais: metodo.materiais.filter((m) => m.id !== idDoMaterial) });

const materiaisEmUso = () => R.metodos.listar().flatMap((m) => (m.materiais || []).map((x) => x.id));

/** O PDF dos métodos em que o aluno está matriculado. */

  return R.questoesDaAvaliacao(avaliacao.id).filter((q) => q.status !== 'rascunho');

  criarMetodo, editarMetodo, removerMetodo, matricularAlunos,
  criarFase, editarFase, removerFase,
  criarLicao, editarLicao, removerLicao,

__modulos['servicos/turmas'] = (function () {
// A turma: um grupo de alunos estudando um método, com o material que o
// instrutor anexou e o critério pelo qual eles são aprovados.
//
// O critério é a parte que importa. Ele não é um bilhete que alguém escreve
// sobre o aluno: é conferido contra o que já está gravado — a nota de cada
// avaliação, as lições lidas, as fases concluídas. Mexeu no critério, a
// situação de todo mundo muda junto, e a escola sabe explicar por quê.

const R = __modulos['dados/repositorios'];
const { novoId } = __modulos['dados/ids'];
const { CRITERIO_PADRAO } = __modulos['dados/esquema'];
const arquivos = __modulos['arquivos'];

const MATERIAL_MAXIMO = arquivos.TAMANHO_MAXIMO;
const TIPOS_ACEITOS = ['application/pdf'];

const turmas = (filtro = null) => R.turmas.listar(filtro)
  .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));

const turmaPorId = (id) => R.turmas.buscar(id);

// A turma ativa de um aluno num método. É ela que manda na nota mínima das
// fases daquele método — e é por isso que a busca é por método, e não "a
// turma do aluno": um aluno pode estar na turma de teoria e na do instrumento.
function turmaDoAlunoNoMetodo(alunoId, metodoId) {
  return R.turmasDoAluno(alunoId)
    .find((t) => t.situacao === 'ativa' && t.metodoId === metodoId) || null;
}

function criarTurma(dados = {}) {
  const nome = String(dados.nome || '').trim();
  if (!nome) throw new Error('A turma precisa de um nome.');
  if (!String(dados.metodoId || '').trim()) throw new Error('Escolha o método da turma.');
  return R.turmas.criar({
    id: novoId('tu'),
    nome,
    metodoId: dados.metodoId,
    comum: dados.comum,
    responsavel: dados.responsavel,
    observacao: dados.observacao,
    alunoIds: dados.alunoIds || [],
    criterio: { ...CRITERIO_PADRAO, ...(dados.criterio || {}) },
    materiais: [],
    situacao: 'ativa',
    criadaEm: new Date().toISOString(),
  });
}

const atualizarTurma = (id, mudancas) => R.turmas.atualizar(id, mudancas);

function definirCriterio(id, criterio = {}) {
  const turma = turmaPorId(id);
  if (!turma) throw new Error('Turma não encontrada.');
  return R.turmas.atualizar(id, { criterio: { ...turma.criterio, ...criterio } });
}

function encerrarTurma(id) {
  return R.turmas.atualizar(id, { situacao: 'encerrada', encerradaEm: new Date().toISOString() });
}

const reabrirTurma = (id) => R.turmas.atualizar(id, { situacao: 'ativa', encerradaEm: null });

function matricular(id, alunoId) {
  const turma = turmaPorId(id);
  if (!turma) throw new Error('Turma não encontrada.');
  if (!R.alunos.buscar(alunoId)) throw new Error('Aluno não encontrado.');
  if (turma.alunoIds.includes(alunoId)) return turma;
  return R.turmas.atualizar(id, { alunoIds: [...turma.alunoIds, alunoId] });
}

function desmatricular(id, alunoId) {
  const turma = turmaPorId(id);
  if (!turma) throw new Error('Turma não encontrada.');
  return R.turmas.atualizar(id, { alunoIds: turma.alunoIds.filter((x) => x !== alunoId) });
}

// Remover a turma leva o material junto: os bytes ficam fora do cadastro, e
// sem esta linha eles continuariam ocupando espaço sem ninguém para apontá-los.
async function removerTurma(id) {
  const turma = turmaPorId(id);
  if (!turma) return false;
  for (const material of turma.materiais) await arquivos.remover(material.id).catch(() => undefined);
  R.turmas.remover(id);
  return true;
}

// ------------------------------------------------------------------ material

async function anexarMaterial(id, arquivo, { adicionadoPor = '' } = {}) {
  const turma = turmaPorId(id);
  if (!turma) throw new Error('Turma não encontrada.');
  if (!arquivo) throw new Error('Escolha um arquivo.');
  if (!TIPOS_ACEITOS.includes(arquivo.type)) throw new Error('O material precisa ser um arquivo PDF.');
  if (arquivo.size > MATERIAL_MAXIMO) {
    throw new Error(`O arquivo tem ${Math.round(arquivo.size / 1024 / 1024)} MB. O limite é ${MATERIAL_MAXIMO / 1024 / 1024} MB.`);
  }
  if (!arquivos.disponivel()) throw new Error('Este navegador não guarda arquivos neste aparelho.');

  const idDoMaterial = novoId('mat');
  await arquivos.guardar(idDoMaterial, arquivo);
  const ficha = {
    id: idDoMaterial,
    nome: arquivo.name,
    tipo: arquivo.type,
    tamanho: arquivo.size,
    adicionadoEm: new Date().toISOString(),
    adicionadoPor,
  };
  R.turmas.atualizar(id, { materiais: [...turma.materiais, ficha] });
  return ficha;
}

async function removerMaterial(id, idDoMaterial) {
  const turma = turmaPorId(id);
  if (!turma) throw new Error('Turma não encontrada.');
  await arquivos.remover(idDoMaterial).catch(() => undefined);
  return R.turmas.atualizar(id, { materiais: turma.materiais.filter((m) => m.id !== idDoMaterial) });
}

/** Todo material de todas as turmas — o material que um aluno pode abrir. */
const materiaisDoAluno = (alunoId) => R.turmasDoAluno(alunoId)
  .flatMap((turma) => turma.materiais.map((material) => ({ ...material, turma })));

// Os identificadores que ainda têm dono, para a faxina do guardador.
const materiaisEmUso = () => R.turmas.listar().flatMap((t) => t.materiais.map((m) => m.id));

// -------------------------------------------------------- critério e situação

/**
 * Como um aluno está diante do critério da turma. Cada linha diz o que se
 * pede, o que ele tem e se cumpre — para a tela poder mostrar o motivo, e não
 * só um carimbo de aprovado ou reprovado.
 */
function situacaoNaTurma(turma, alunoId) {
  const criterio = turma.criterio;
  const fases = R.fasesDoMetodo(turma.metodoId);
  const progresso = fases.map((fase) => ({
    fase,
    linha: R.progressoDoAluno(alunoId, fase.id),
  }));

  const aprovadas = progresso.filter(({ linha }) => Boolean(linha.aprovadoEm)
    && Number(linha.melhorNota || 0) >= criterio.notaMinima);
  const notas = aprovadas.map(({ linha }) => Number(linha.melhorNota || 0));
  const media = notas.length ? Math.round(notas.reduce((a, b) => a + b, 0) / notas.length) : 0;

  const exigidas = criterio.fasesParaConcluir > 0
    ? Math.min(criterio.fasesParaConcluir, fases.length)
    : fases.length;

  // Lições em dia: só se cobra das fases que contam para concluir a turma.
  const paraConferir = progresso.slice(0, exigidas);
  const licoesPendentes = criterio.licoesObrigatorias
    ? paraConferir.filter(({ fase, linha }) =>
      linha.licoesLidas.length < R.licoesDaFase(fase.id).length).length
    : 0;

  const itens = [
    {
      chave: 'fases',
      pede: `${exigidas} ${exigidas === 1 ? 'fase concluída' : 'fases concluídas'} com ${criterio.notaMinima}% ou mais`,
      tem: `${aprovadas.length} de ${exigidas}`,
      cumpre: aprovadas.length >= exigidas,
    },
  ];
  if (criterio.licoesObrigatorias) {
    itens.push({
      chave: 'licoes',
      pede: 'todas as lições dessas fases lidas',
      tem: licoesPendentes ? `${licoesPendentes} ${licoesPendentes === 1 ? 'fase' : 'fases'} com lição por ler` : 'em dia',
      cumpre: licoesPendentes === 0,
    });
  }
  if (criterio.mediaMinima > 0) {
    itens.push({
      chave: 'media',
      pede: `média de ${criterio.mediaMinima}% nas fases concluídas`,
      tem: notas.length ? `${media}%` : 'sem avaliação ainda',
      cumpre: notas.length > 0 && media >= criterio.mediaMinima,
    });
  }

  return {
    alunoId,
    aluno: R.alunos.buscar(alunoId),
    aprovado: itens.every((i) => i.cumpre),
    concluidas: aprovadas.length,
    exigidas,
    media,
    itens,
    percentual: exigidas > 0 ? Math.min(100, Math.round((aprovadas.length / exigidas) * 100)) : 0,
  };
}

const quadroDaTurma = (turma) => turma.alunoIds
