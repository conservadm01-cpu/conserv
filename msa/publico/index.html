<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f9e6b">
<meta name="description" content="Teoria do MSA e método do seu instrumento, fase a fase, com avaliação que nunca repete pergunta e certificado.">
<meta name="color-scheme" content="light dark">
<title>Estudo Musical — MSA</title>

<!-- Estes três arquivos só existem quando o app está hospedado. Aberto direto
     do aparelho (file://), o navegador não acha nenhum deles e nada quebra:
     o app é a página, e a página já está toda aqui. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone.svg">
<style>
/* Estudo Musical — MSA. Desenho pensado para o celular: alvo de toque grande,
   texto legível ao ar livre e contraste que sobrevive à tela do ônibus. */

:root {
  --fundo: #f6f4ef;
  --papel: #ffffff;
  --tinta: #23201c;
  --tinta-fraca: #6b6559;
  --linha: #e2ddd2;
  --marca: #2f9e6b;
  --marca-escura: #1f7350;
  --erro: #c62828;
  --acerto: #2e7d32;
  --sombra: 0 2px 10px rgba(35, 32, 28, .07);
  --raio: 14px;
  color-scheme: light dark;
}

/* Modo escuro: pela preferência do sistema e também quando o app está dentro
   de uma casca que marca o tema na raiz (data-theme). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo: #14161a;
    --papel: #1c1f25;
    --tinta: #eceae5;
    --tinta-fraca: #a09a90;
    --linha: #2c313a;
    --sombra: 0 2px 10px rgba(0, 0, 0, .35);
  }
}

:root[data-theme="dark"] {
  --fundo: #14161a;
  --papel: #1c1f25;
  --tinta: #eceae5;
  --tinta-fraca: #a09a90;
  --linha: #2c313a;
  --sombra: 0 2px 10px rgba(0, 0, 0, .35);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--fundo);
  color: var(--tinta);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}

#tela {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 16px 64px;
}

h1, h2, h3 { line-height: 1.25; }
a { color: inherit; text-decoration: none; }
p { margin: 0 0 12px; }

/* ------------------------------------------------------------------- topo */
.topo {
  display: flex; align-items: center; gap: 8px;
  margin: 4px 0 18px;
}
.topo h1 { font-size: 19px; margin: 0; flex: 1; text-align: center; }
.topo .espaco, .topo .voltar { width: 42px; }
.voltar {
  display: grid; place-items: center;
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--papel); box-shadow: var(--sombra);
  font-size: 26px; line-height: 1; padding-bottom: 4px;
}
.topo-inicial { justify-content: space-between; margin-bottom: 12px; }
.topo-inicial h1 { text-align: left; font-size: 26px; margin: 0; }
.ola { color: var(--tinta-fraca); font-size: 14px; }
.avatar {
  display: grid; place-items: center; width: 44px; height: 44px;
  border-radius: 50%; background: var(--papel); box-shadow: var(--sombra); font-size: 20px;
}

.titulo-secao { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--tinta-fraca); margin: 26px 0 10px; }

/* --------------------------------------------------------------- início */
.resumo-topo {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px;
  background: var(--papel); border-radius: var(--raio); padding: 14px; box-shadow: var(--sombra);
}
.resumo-topo div { text-align: center; }
.resumo-topo strong { display: block; font-size: 22px; }
.resumo-topo span { font-size: 12px; color: var(--tinta-fraca); }

.faixa-teste {
  margin: 12px 0 0; padding: 12px 14px; border-radius: 12px; font-size: 13px;
  background: color-mix(in srgb, var(--marca) 14%, transparent);
  border-left: 3px solid var(--marca); color: var(--tinta);
}
.faixa-teste a { text-decoration: underline; }

.atalhos { display: flex; gap: 10px; margin-top: 12px; }
.atalho { flex: 1; text-align: center; background: var(--papel); border-radius: var(--raio); padding: 12px 8px; box-shadow: var(--sombra); font-size: 14px; }

.lista-fases { display: grid; gap: 10px; }
.cartao-fase {
  position: relative; display: flex; gap: 12px; align-items: center;
  background: var(--papel); border-radius: var(--raio); padding: 14px;
  box-shadow: var(--sombra); border-left: 5px solid var(--cor, var(--marca));
}
.cartao-fase.trancada { opacity: .5; }
.cartao-fase.aprovada { border-left-width: 5px; }
.icone-fase { font-size: 28px; width: 42px; text-align: center; }
.corpo-fase { flex: 1; min-width: 0; display: grid; gap: 2px; }
.numero-fase { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--cor, var(--marca)); font-weight: 700; }
.corpo-fase strong { font-size: 16px; }
.sub-fase { font-size: 13px; color: var(--tinta-fraca); }
.mini { font-size: 12px; color: var(--tinta-fraca); }
.mini.centro { text-align: center; }
.barra { height: 5px; background: var(--linha); border-radius: 3px; overflow: hidden; margin: 6px 0 2px; }
.barra span { display: block; height: 100%; background: var(--cor, var(--marca)); }
.selo {
  position: absolute; top: 10px; right: 10px;
  background: var(--cor, var(--marca)); color: #fff; font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 999px;
}
.rodape { margin-top: 28px; font-size: 12px; color: var(--tinta-fraca); }

/* ---------------------------------------------------------- boas-vindas */
.boas-vindas { text-align: center; padding: 32px 4px; }
.boas-vindas .marca { font-size: 64px; }
.boas-vindas h1 { font-size: 32px; margin: 8px 0 16px; }
.boas-vindas h1 span { color: var(--marca); }
.boas-vindas p { text-align: left; }
.boas-vindas label { display: block; text-align: left; font-size: 13px; color: var(--tinta-fraca); margin: 22px 0 6px; }

input[type="text"] {
  width: 100%; padding: 14px; font-size: 16px; border-radius: 12px;
  border: 1.5px solid var(--linha); background: var(--papel); color: var(--tinta);
}
input[type="text"]:focus { outline: 2px solid var(--marca); border-color: transparent; }

/* -------------------------------------------------------------- botões */
.botao {
  display: inline-block; text-align: center; cursor: pointer;
  background: var(--marca); color: #fff; border: none; border-radius: 12px;
  padding: 14px 18px; font-size: 16px; font-weight: 600; font-family: inherit;
  box-shadow: var(--sombra);
}
.botao:active { transform: translateY(1px); }
.botao.grande { display: block; width: 100%; margin: 14px 0 8px; }
.botao.secundario { background: var(--papel); color: var(--tinta); border: 1.5px solid var(--linha); display: block; width: 100%; margin: 8px 0; }
.botao.perigo { background: var(--erro); color: #fff; }
.acoes { display: grid; gap: 8px; margin: 18px 0; }

/* ---------------------------------------------------------------- fase */
.capa-fase {
  background: var(--papel); border-radius: var(--raio); padding: 20px 16px;
  box-shadow: var(--sombra); border-top: 5px solid var(--cor, var(--marca)); text-align: center;
}
.capa-fase .icone-grande { font-size: 44px; }
.capa-fase h2 { margin: 6px 0 4px; font-size: 22px; }
.capa-fase .sub { color: var(--cor, var(--marca)); font-size: 13px; font-weight: 600; }
.capa-fase p { text-align: left; }

.lista-licoes { display: grid; gap: 8px; }
.item-licao {
  display: flex; align-items: center; gap: 12px;
  background: var(--papel); border-radius: 12px; padding: 12px 14px; box-shadow: var(--sombra);
}
.item-licao span { display: block; }
.item-licao small { display: block; color: var(--tinta-fraca); font-size: 12px; }
.item-licao .seta { margin-left: auto; color: var(--tinta-fraca); font-size: 22px; }
.marca-lida {
  width: 28px; height: 28px; flex: 0 0 28px; border-radius: 50%;
  display: grid !important; place-items: center;
  background: var(--linha); color: var(--tinta-fraca); font-size: 13px; font-weight: 700;
}
.item-licao.lida .marca-lida { background: var(--acerto); color: #fff; }

.lista-jogos { display: grid; gap: 8px; }
.item-jogo {
  display: block; background: var(--papel); border-radius: 12px; padding: 14px;
  box-shadow: var(--sombra); border-left: 4px solid var(--cor, var(--marca)); position: relative;
}
.item-jogo small { display: block; color: var(--tinta-fraca); font-size: 13px; margin-top: 2px; }
.recorde { position: absolute; top: 12px; right: 12px; font-size: 11px; color: var(--cor); font-weight: 700; }
.recorde.novo { color: var(--tinta-fraca); }

.caixa-prova { background: var(--papel); border-radius: var(--raio); padding: 16px; box-shadow: var(--sombra); }
.alerta { color: #b26a00; }
.aviso { background: var(--papel); border-radius: 12px; padding: 16px; box-shadow: var(--sombra); }
.aviso.leve { font-size: 13px; color: var(--tinta-fraca); }

.historico { margin-top: 22px; }
.linha-historico { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--linha); font-size: 14px; }
.ok { color: var(--acerto); font-weight: 600; }
.nao { color: var(--erro); font-weight: 600; }

/* --------------------------------------------------------------- lição */
.licao { background: var(--papel); border-radius: var(--raio); padding: 18px 16px; box-shadow: var(--sombra); }
.licao .etiqueta { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--cor, var(--marca)); }
.licao h2 { margin: 6px 0 14px; font-size: 23px; }
.licao b { color: var(--tinta); }
.lista-chave { padding-left: 20px; margin: 0 0 12px; }
.lista-chave li { margin-bottom: 6px; }
.dica {
  background: color-mix(in srgb, var(--cor, var(--marca)) 12%, transparent);
  border-left: 3px solid var(--cor, var(--marca));
  padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 14px;
}
blockquote { margin: 0 0 12px; padding: 10px 14px; border-left: 3px solid var(--linha); color: var(--tinta-fraca); font-style: italic; }
.padrao { text-align: center; font-size: 22px; font-weight: 700; letter-spacing: .05em; color: var(--cor, var(--marca)); }

.rolagem { overflow-x: auto; margin: 0 0 14px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--linha); }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--tinta-fraca); }

/* ------------------------------------------------------------- notação */
.pentagrama { display: block; width: 100%; max-width: 340px; margin: 10px auto; color: var(--tinta); }
.pentagrama .formula { font-size: 23px; font-weight: 700; font-family: Georgia, serif; fill: currentColor; }
.pentagrama .rotulo { font-size: 11px; fill: var(--tinta-fraca); }
.pentagrama .interrogacao { font-size: 26px; font-weight: 700; fill: var(--marca); }
.pentagrama .destacada { color: var(--marca); }
.tres-claves { display: grid; gap: 4px; }
.tira-figuras { display: flex; gap: 4px; justify-content: space-between; margin: 8px 0 14px; overflow-x: auto; }
.tira-figuras figure { margin: 0; text-align: center; flex: 1; min-width: 58px; }
.tira-figuras figcaption { font-size: 11px; color: var(--tinta-fraca); }
.figura { color: var(--tinta); }

.quadro-teclado { overflow-x: auto; margin: 12px 0; }
.teclado { min-width: 280px; width: 100%; max-width: 420px; display: block; margin: 0 auto; }
.tecla.branca { fill: #fbfbfb; stroke: #4a4a4a; stroke-width: 1; }
.tecla.preta { fill: #23201c; }
.tecla.marcada.tonica { fill: #f2a33c; }
.tecla.marcada.grau { fill: #8ecdb0; }
.tecla.marcada.alterada { fill: #7cb6f2; }
.tecla.certa { fill: #7bd18f; }
.tecla.errada { fill: #ef8a8a; }
.tecla.clicavel { cursor: pointer; }
.rotulo-tecla { font-size: 9px; fill: #666; pointer-events: none; }

/* ------------------------------------------------------------- questão */
.progresso-prova { height: 6px; background: var(--linha); border-radius: 3px; overflow: hidden; }
.progresso-prova span { display: block; height: 100%; background: var(--marca); transition: width .3s; }
.contador { font-size: 13px; color: var(--tinta-fraca); margin: 8px 0 4px; }
.questao { background: var(--papel); border-radius: var(--raio); padding: 18px 16px; box-shadow: var(--sombra); }
.questao h2 { font-size: 19px; margin: 0 0 12px; }
.ilustracao { margin: 0 0 14px; }
.alternativas { display: grid; gap: 8px; }
.alternativa {
  display: flex; gap: 12px; align-items: center; text-align: left; width: 100%;
  background: var(--fundo); border: 1.5px solid var(--linha); border-radius: 12px;
  padding: 13px 14px; font-size: 15px; font-family: inherit; color: inherit; cursor: pointer;
}
.alternativa .letra {
  width: 26px; height: 26px; flex: 0 0 26px; border-radius: 50%;
  display: grid; place-items: center; background: var(--papel);
  border: 1.5px solid var(--linha); font-size: 13px; font-weight: 700;
}
.alternativa.certa { border-color: var(--acerto); background: color-mix(in srgb, var(--acerto) 14%, transparent); }
.alternativa.errada { border-color: var(--erro); background: color-mix(in srgb, var(--erro) 14%, transparent); }
.alternativa:disabled { cursor: default; }
.retorno { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--linha); font-size: 15px; }

/* ----------------------------------------------------------- resultado */
.resultado { background: var(--papel); border-radius: var(--raio); padding: 24px 16px; box-shadow: var(--sombra); text-align: center; }
.resultado .nota { font-size: 52px; font-weight: 800; color: var(--cor, var(--marca)); line-height: 1; }
.resultado.reprovado .nota { color: var(--erro); }
.resultado strong { display: block; font-size: 20px; margin: 6px 0 4px; }
.revisao { display: grid; gap: 10px; }
.item-revisao { background: var(--papel); border-radius: 12px; padding: 14px; box-shadow: var(--sombra); font-size: 14px; }
.item-revisao .pergunta { font-weight: 600; }
.item-revisao .sua { color: var(--erro); }
.item-revisao .certa { color: var(--acerto); }

/* --------------------------------------------------------------- jogos */
.jogo { background: var(--papel); border-radius: var(--raio); padding: 16px; box-shadow: var(--sombra); }
.instrucao { font-size: 15px; }
.placar-jogo { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--cor, var(--marca)); margin-bottom: 10px; }
.palco { min-height: 130px; display: grid; place-items: center; }
.etiqueta-clave { font-size: 12px; color: var(--tinta-fraca); text-align: center; }
.grade-memoria { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.carta {
  position: relative; min-height: 92px; border-radius: 12px; border: 1.5px solid var(--linha);
  background: var(--fundo); cursor: pointer; padding: 8px; font-family: inherit; font-size: 13px; color: inherit;
}
.carta .verso { font-size: 26px; color: var(--tinta-fraca); }
.carta .frente { display: none; }
.carta.aberta .verso, .carta.achada .verso { display: none; }
.carta.aberta .frente, .carta.achada .frente { display: block; }
.carta.achada { border-color: var(--acerto); background: color-mix(in srgb, var(--acerto) 12%, transparent); }
.botoes-notas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.botao-nota {
  flex: 1 1 60px; padding: 14px 8px; border-radius: 12px; border: 1.5px solid var(--linha);
  background: var(--fundo); font-size: 16px; font-family: inherit; color: inherit; cursor: pointer;
}
.botao-nota.largo { flex-basis: 100%; }
.botao-nota.certo, .botao-figura.certo { border-color: var(--acerto); background: color-mix(in srgb, var(--acerto) 16%, transparent); }
.botao-nota.errado, .botao-figura.errado { border-color: var(--erro); background: color-mix(in srgb, var(--erro) 16%, transparent); }
.paleta-figuras { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
.botao-figura { border-radius: 12px; border: 1.5px solid var(--linha); background: var(--fundo); padding: 4px 8px; cursor: pointer; color: inherit; }
.acoes-jogo { display: flex; gap: 8px; margin-top: 12px; }
.acoes-jogo .botao { flex: 1; }
.alvo-pulso {
  display: block; width: 160px; height: 160px; margin: 18px auto 0; border-radius: 50%;
  border: 3px solid var(--linha); background: var(--fundo); font-size: 16px; font-weight: 700;
  font-family: inherit; color: var(--tinta-fraca); cursor: pointer;
}
.alvo-pulso span { font-weight: 400; font-size: 13px; }
.alvo-pulso.forte { border-color: var(--marca); background: color-mix(in srgb, var(--marca) 22%, transparent); }
.alvo-pulso.fraco { border-color: var(--marca); }
.resultado-jogo { margin-top: 16px; text-align: center; border-top: 1px solid var(--linha); padding-top: 14px; }
.resultado-jogo strong { font-size: 28px; color: var(--cor, var(--marca)); }

/* -------------------------------------------------------- certificados */
.lista-certificados { display: grid; gap: 10px; }
.cartao-certificado {
  display: grid; gap: 2px; background: var(--papel); border-radius: var(--raio);
  padding: 14px; box-shadow: var(--sombra); border-left: 5px solid var(--cor, var(--marca)); font-size: 14px;
}
.cartao-certificado .codigo { font-family: "Courier New", monospace; font-size: 12px; color: var(--tinta-fraca); }
.moldura-certificado { background: #fff; color: #23201c; border-radius: var(--raio); padding: 8px; box-shadow: var(--sombra); overflow-x: auto; }
.certificado-svg { display: block; min-width: 320px; }

.sobre { background: var(--papel); border-radius: var(--raio); padding: 18px 16px; box-shadow: var(--sombra); }
.sobre h3 { margin: 18px 0 6px; font-size: 16px; }
.sobre h3:first-child { margin-top: 0; }
.sobre label { display: block; font-size: 13px; color: var(--tinta-fraca); margin: 16px 0 6px; }


/* --------------------------------------------------- entrada e cadastro */
.entrada { text-align: center; padding: 28px 4px 8px; }
.entrada .marca { font-size: 60px; }
.entrada h1 { font-size: 30px; margin: 6px 0 12px; }
.entrada h1 span { color: var(--marca); }
.entrada .sub { text-align: left; }
.entrada .titulo-secao { text-align: left; }

.lista-alunos { display: grid; gap: 8px; }
.cartao-aluno {
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--papel); border-radius: 12px; padding: 12px 14px; box-shadow: var(--sombra);
}
.cartao-aluno .dados { flex: 1; min-width: 0; display: grid; gap: 1px; }
.cartao-aluno small { display: block; color: var(--tinta-fraca); font-size: 12px; }
.inicial {
  width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%;
  display: grid; place-items: center; background: var(--marca); color: #fff;
  font-size: 18px; font-weight: 700;
}
.login, .formulario { background: var(--papel); border-radius: var(--raio); padding: 20px 16px; box-shadow: var(--sombra); }
.login { text-align: center; }
.login h2 { margin: 0 0 2px; font-size: 22px; }
.entrada .login { margin-top: 18px; }
.entrada .login .botao { margin-top: 20px; }
.login label, .formulario label { display: block; text-align: left; font-size: 13px; color: var(--tinta-fraca); margin: 16px 0 6px; }
.login input, .campo {
  width: 100%; padding: 14px; font-size: 16px; border-radius: 12px;
  border: 1.5px solid var(--linha); background: var(--fundo); color: var(--tinta); font-family: inherit;
}
.login input:focus, .campo:focus { outline: 2px solid var(--marca); border-color: transparent; }
select.campo { appearance: none; background-image: linear-gradient(45deg, transparent 49%, var(--tinta-fraca) 50%), linear-gradient(135deg, var(--tinta-fraca) 50%, transparent 51%);
  background-position: calc(100% - 20px) 22px, calc(100% - 14px) 22px; background-size: 6px 6px; background-repeat: no-repeat; }
.opcao { display: flex !important; align-items: center; gap: 10px; margin: 18px 0 0 !important; font-size: 15px; color: var(--tinta) !important; }
.opcao input { width: 20px; height: 20px; accent-color: var(--marca); }

/* Escolher o perfil no primeiro acesso, e os pedidos esperando o master. */
.perfis { display: grid; gap: 8px; }
.perfil {
  display: flex; align-items: flex-start; gap: 12px; cursor: pointer;
  border: 1.5px solid var(--linha); border-radius: 12px; padding: 12px 14px; background: var(--fundo);
}
.perfil.escolhido { border-color: var(--marca); background: color-mix(in srgb, var(--marca) 10%, var(--fundo)); }
.perfil input { width: 20px; height: 20px; margin-top: 2px; flex: 0 0 20px; accent-color: var(--marca); }
.perfil span { display: grid; gap: 2px; }
.perfil small { color: var(--tinta-fraca); font-size: 12px; }

/* Turmas: a lista, o material anexado e a turma vista pelo aluno. */
.lista-turmas { display: grid; gap: 8px; }
.cartao-turma {
  display: flex; align-items: center; gap: 12px;
  background: var(--papel); border-radius: var(--raio); padding: 14px; box-shadow: var(--sombra);
}
.cartao-turma.encerrada { opacity: .62; }
.corpo-turma { flex: 1; min-width: 0; display: grid; gap: 2px; }
.corpo-turma strong { font-size: 17px; }
.corpo-turma .mini { margin: 0; }
.cartao-turma .seta { color: var(--tinta-fraca); font-size: 24px; }

.materiais { display: grid; gap: 8px; margin: 10px 0 4px; }
.material {
  display: flex; align-items: center; gap: 10px;
  background: var(--papel); border-radius: 12px; padding: 10px 12px; box-shadow: var(--sombra);
}
.icone-material { font-size: 22px; }
.dados-material { flex: 1; min-width: 0; display: grid; gap: 1px; }
.dados-material strong { font-size: 15px; word-break: break-word; }
.dados-material small { color: var(--tinta-fraca); font-size: 12px; }
.botao.estreito { width: auto; padding: 8px 12px; font-size: 13px; margin: 0; flex: 0 0 auto; }

.minha-turma {
  background: var(--papel); border-radius: var(--raio); padding: 14px; box-shadow: var(--sombra);
  margin-bottom: 14px; border-left: 4px solid var(--marca);
}
.minha-turma strong { display: block; font-size: 17px; margin-bottom: 8px; }
.selo-turma {
  flex: 0 0 auto; align-self: flex-start;
  background: var(--linha); color: var(--tinta-fraca); font-size: 11px; font-weight: 700;
  padding: 3px 9px; border-radius: 999px; white-space: nowrap;
}
.selo-turma.ok { background: var(--acerto); color: #fff; }

.pedidos { display: grid; gap: 10px; margin-bottom: 18px; }
.pedido {
  background: var(--papel); border-radius: var(--raio); padding: 14px; box-shadow: var(--sombra);
  border-left: 4px solid #e6a700;
}
.pedido strong { display: block; font-size: 17px; }
.pedido .acoes { margin-top: 12px; }
.etiqueta-perfil {
  display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: #b26a00;
}

.recado { border-radius: 12px; padding: 12px 14px; font-size: 14px; margin: 0 0 14px; }
.recado.ok { background: color-mix(in srgb, var(--acerto) 16%, transparent); color: var(--tinta); }
.recado.erro { background: color-mix(in srgb, var(--erro) 16%, transparent); color: var(--tinta); }
.recado.alerta { background: color-mix(in srgb, #e6a700 22%, transparent); color: var(--tinta); }
.recado a { text-decoration: underline; }

.titulo-grupo {
  font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--marca); margin: 24px 0 4px; border-top: 1px solid var(--linha); padding-top: 16px;
}
.titulo-grupo:first-child { border-top: none; padding-top: 0; margin-top: 4px; }
.campo.com-erro { border-color: var(--erro); }
.erro-campo { font-size: 12px; color: var(--erro); margin: 6px 0 0; }
.pendente { color: #b26a00 !important; font-weight: 600; }
.contatos { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.contato {
  flex: 1 1 46%; text-align: center; background: var(--papel); border-radius: 12px;
  padding: 12px 10px; box-shadow: var(--sombra); font-size: 14px; word-break: break-all;
}

.etiqueta-trilha {
  display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--cor, var(--marca));
}
.cartao-aluno.painel .dados small:last-child { font-size: 11px; }

/* ---------------------------------------------------------- impressão */
#area-impressao { display: none; }
@media print {
  body > *:not(#area-impressao) { display: none !important; }
  #area-impressao { display: block; }
  @page { size: A4 landscape; margin: 8mm; }
}

/* ===================================================================== */
/* Plataforma: painel do aluno, acompanhamento do instrutor, relatórios.  */
/* ===================================================================== */

/* Acessibilidade de base ---------------------------------------------- */

/* Rótulo que só o leitor de tela lê. Um campo de busca com ícone e sem
   rótulo visível continua precisando de rótulo. */
.oculto-visual {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* Foco visível em tudo o que recebe foco, e não só nos campos de texto.
   :focus-visible não aparece no clique de mouse, só na navegação por teclado. */
a:focus-visible, button:focus-visible, input:focus-visible,
select:focus-visible, textarea:focus-visible, summary:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid var(--marca);
  outline-offset: 2px;
  border-radius: 6px;
}

/* Quem pediu menos movimento no sistema recebe menos movimento. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}

.como-link {
  background: none; border: 0; padding: 0; font: inherit;
  color: var(--marca-escura); text-decoration: underline; cursor: pointer;
}

/* Painel do aluno ------------------------------------------------------ */

.painel-aluno {
  background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio);
  padding: 16px; margin: 12px 0; box-shadow: var(--sombra); display: grid; gap: 10px;
}

.onde-estou { display: grid; gap: 3px; }
.onde-estou span { font-size: 15px; }

.proxima-atividade {
  display: grid; gap: 3px; position: relative;
  background: color-mix(in srgb, var(--marca) 10%, var(--papel));
  border: 1px solid color-mix(in srgb, var(--marca) 35%, var(--linha));
  border-radius: var(--raio); padding: 14px 40px 14px 14px;
  color: inherit; text-decoration: none;
}
.proxima-atividade:hover { background: color-mix(in srgb, var(--marca) 16%, var(--papel)); }
.proxima-atividade strong { font-size: 17px; }
.proxima-atividade .etiqueta {
  font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--marca-escura); font-weight: 700;
}
.proxima-atividade .seta {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  font-size: 26px; color: var(--marca-escura);
}

.indicadores { display: flex; gap: 8px; text-align: center; }
.indicadores > div {
  flex: 1; background: var(--fundo); border-radius: 10px; padding: 10px 6px;
  display: grid; gap: 2px;
}
.indicadores strong { font-size: 20px; }
.indicadores span { font-size: 11px; color: var(--tinta-fraca); line-height: 1.25; }

/* Desempenho ----------------------------------------------------------- */

.recomendacao {
  background: var(--papel); border-left: 4px solid var(--marca);
  border-radius: var(--raio); padding: 14px; margin: 12px 0;
  display: grid; gap: 6px; box-shadow: var(--sombra);
}
.recomendacao .etiqueta {
  font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--marca-escura); font-weight: 700;
}
.recomendacao .botao { justify-self: start; margin-top: 4px; }

.lista-assuntos { display: grid; gap: 10px; margin: 8px 0; }
.linha-assunto {
  background: var(--papel); border: 1px solid var(--linha); border-radius: 10px;
  padding: 10px 12px; display: grid; gap: 6px;
}
.linha-assunto .rotulo { display: grid; gap: 1px; }
.linha-assunto .rotulo small { color: var(--tinta-fraca); font-size: 12px; }
.linha-assunto .numero { font-weight: 700; font-size: 15px; }
.linha-assunto .numero small { font-weight: 400; color: var(--tinta-fraca); font-size: 12px; }

.onde-errou { margin: 14px 0; }

/* Conquistas ----------------------------------------------------------- */

.lista-conquistas { display: grid; gap: 8px; margin: 8px 0; }
.cartao-conquista {
  display: flex; gap: 12px; align-items: center;
  background: var(--papel); border: 1px solid var(--linha);
  border-radius: 10px; padding: 12px;
}
.cartao-conquista.ganha { border-color: color-mix(in srgb, var(--acerto) 45%, var(--linha)); }
.cartao-conquista.pendente { opacity: .72; }
.cartao-conquista .icone { font-size: 26px; line-height: 1; }
.cartao-conquista div { display: grid; gap: 1px; }
.cartao-conquista small { color: var(--tinta-fraca); font-size: 12px; }
.cartao-conquista small.ok { color: var(--acerto); }
.conquistas-novas { margin: 14px 0; display: grid; gap: 8px; }

/* Linha do tempo ------------------------------------------------------- */

.linha-do-tempo { display: grid; gap: 16px; margin: 12px 0; }
.linha-do-tempo .dia h3 {
  font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--tinta-fraca); margin: 0 0 6px;
}
.linha-do-tempo .evento {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 8px 0; border-left: 2px solid var(--linha); padding-left: 12px; margin-left: 6px;
}
.linha-do-tempo .evento .icone { font-size: 17px; line-height: 1.3; }
.linha-do-tempo .evento div { display: grid; gap: 1px; }
.linha-do-tempo .evento small { color: var(--tinta-fraca); font-size: 12px; }

/* Alertas e lista do instrutor ----------------------------------------- */

.lista-alertas { display: grid; gap: 8px; margin: 8px 0; }
.cartao-alerta {
  display: grid; gap: 3px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--linha); border-left-width: 4px;
  background: var(--papel); color: inherit; text-decoration: none;
}
.cartao-alerta .etiqueta {
  font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700;
}
.cartao-alerta.atencao { border-left-color: var(--erro); }
.cartao-alerta.atencao .etiqueta { color: var(--erro); }
.cartao-alerta.aviso { border-left-color: #b8860b; }
.cartao-alerta.aviso .etiqueta { color: #8a6508; }
.cartao-alerta.boa { border-left-color: var(--acerto); }
.cartao-alerta.boa .etiqueta { color: var(--acerto); }

/* A situação nunca é dada só pela cor: o ícone vem acompanhado da palavra. */
.situacao { display: grid; gap: 2px; justify-items: center; min-width: 66px; text-align: center; }
.situacao span { font-size: 16px; }
.situacao small { font-size: 10px; line-height: 1.2; color: var(--tinta-fraca); }
.situacao.atencao small { color: var(--erro); font-weight: 600; }

.filtros { display: grid; gap: 8px; margin: 8px 0 12px; }
.fileira-filtros { display: flex; gap: 8px; }
.fileira-filtros select { flex: 1; min-width: 0; }

/* Relatórios ----------------------------------------------------------- */

.resumo-topo.largo { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }

.cartao-relatorio {
  background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio);
  padding: 14px; margin: 8px 0; display: grid; gap: 5px; box-shadow: var(--sombra);
}
.cartao-relatorio > small { color: var(--tinta-fraca); font-size: 12px; }
.alerta-texto { color: var(--erro); }

.mapa-fases { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.mapa-fases .celula {
  display: grid; place-items: center; min-width: 34px; padding: 4px 2px;
  border: 1px solid var(--linha); border-radius: 6px; background: var(--fundo); font-size: 11px;
}
.mapa-fases .celula.com-alunos {
  background: color-mix(in srgb, var(--marca) 22%, var(--papel));
  border-color: color-mix(in srgb, var(--marca) 45%, var(--linha)); font-weight: 700;
}
.mapa-fases .celula small { color: var(--tinta-fraca); font-size: 10px; }

/* Prévia da importação de método --------------------------------------- */

.previa {
  border: 2px solid var(--marca); border-radius: var(--raio); padding: 14px;
  margin: 12px 0; background: var(--papel); display: grid; gap: 10px;
}
.previa.com-erro { border-color: var(--erro); }
.previa h3 { margin: 0; }
.previa h4 { margin: 6px 0 0; font-size: 14px; }
.previa details summary { cursor: pointer; padding: 4px 0; }
.lista-chave.erros li { color: var(--erro); }

/* Responsividade ------------------------------------------------------- */

/* Até aqui o desenho era só para o celular. Em tela larga o conteúdo não
   deve virar uma coluna estreita perdida no meio: as listas ganham colunas
   e o painel aproveita a largura. */
/* Colunas que se ajustam à largura real, em vez de um número fixo por faixa.
   Assim um cartão nunca fica estreito demais para o seu conteúdo — foi o que
   aconteceu ao fixar três colunas: o nome do aluno quebrava em três linhas. */
@media (min-width: 640px) {
  .lista-alunos { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .lista-alertas { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .lista-conquistas { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .lista-assuntos { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .lista-fases { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
  .lista-certificados { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .fileira-filtros { max-width: 560px; }
}

@media (min-width: 1000px) {
  body { max-width: 1040px; }
  .painel-aluno { grid-template-columns: 1fr 1fr; align-items: start; }
  .painel-aluno .onde-estou,
  .painel-aluno .barra,
  .painel-aluno .proxima-atividade { grid-column: 1 / -1; }
}

/* O cartão do aluno na lista do instrutor: o nome respira, e a situação fica
   com largura própria em vez de espremer o resto. */
.cartao-aluno.painel { align-items: flex-start; gap: 10px; }
.cartao-aluno.painel .dados { min-width: 0; flex: 1; }
.cartao-aluno.painel .dados strong { line-height: 1.25; }
.cartao-aluno.painel .situacao { flex: 0 0 auto; min-width: 72px; }



/* Alvo de toque: nada clicável abaixo de 44px de altura no celular, que é o
   mínimo para o dedo acertar sem ampliar. */
@media (pointer: coarse) {
  .botao, .atalho, .alternativa, .item-licao, .item-jogo,
  .cartao-aluno, .cartao-alerta, select.campo, input.campo { min-height: 44px; }
}

/* O nível do título é decidido pela estrutura da página (para o leitor de
   tela), não pelo tamanho da letra: a aparência é a mesma em h2 e h3. */
h2.titulo-secao, h3.titulo-secao { font-size: 13px; }
h2.titulo-grupo, h3.titulo-grupo { font-size: 14px; }
.linha-do-tempo .dia h2 {
  font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--tinta-fraca); margin: 0 0 6px;
}

<main id="tela"><p class="aviso">Carregando…</p></main>

<script>
const __modulos = {};
__modulos['aleatorio'] = (function () {
// Sorteio com semente: a mesma semente devolve sempre a mesma prova, o que
// permite refazer uma avaliação exatamente como ela caiu (e conferir um
// certificado) sem guardar as perguntas inteiras.

function novaSemente() {
  const buffer = new Uint32Array(1);
  (globalThis.crypto || {}).getRandomValues?.(buffer);
  return buffer[0] || Math.floor(Math.random() * 4294967295);
}

function criarAleatorio(semente) {
  let estado = (semente >>> 0) || 1;
  return function aleatorio() {
    estado |= 0;
    estado = (estado + 0x6d2b79f5) | 0;
    let t = Math.imul(estado ^ (estado >>> 15), 1 | estado);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function inteiro(rnd, minimo, maximo) {
  return minimo + Math.floor(rnd() * (maximo - minimo + 1));
}

function sortear(lista, rnd) {
  return lista[Math.floor(rnd() * lista.length)];
}

function embaralhar(lista, rnd) {
  const copia = lista.slice();
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

// Sorteia n itens distintos, sem repetir.
function sortearVarios(lista, n, rnd) {
  return embaralhar(lista, rnd).slice(0, n);
}

// Hash estável de texto (assinatura de pergunta, código de certificado).
function hash(texto) {
  let h = 2166136261;
  for (let i = 0; i < texto.length; i++) {
    h ^= texto.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(36).toUpperCase();
}

return { novaSemente, criarAleatorio, inteiro, sortear, embaralhar, sortearVarios, hash };
})();

__modulos['senha'] = (function () {
// Guarda de senha do app. Importante saber o que isto é e o que não é:
// o app roda inteiro no aparelho, sem servidor, então esta é uma PORTARIA —
// separa o progresso de cada aluno e protege o painel do instrutor do uso
// casual. Não é segurança contra quem sabe abrir o código da página.
// Por isso a senha nunca é guardada em texto: fica só o resumo SHA-256 dela
// com um sal por usuário.

const K = [
  0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
  0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
  0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
  0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
  0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
  0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
  0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
];

const gira = (x, n) => (x >>> n) | (x << (32 - n));

// SHA-256 em JavaScript puro: funciona igual no https, no localhost e no
// arquivo aberto direto do celular (onde o crypto.subtle não existe).
function sha256(texto) {
  const bytes = new TextEncoder().encode(texto);
  const tamanho = bytes.length;
  const comPadding = new Uint8Array((((tamanho + 8) >> 6) + 1) * 64);
  comPadding.set(bytes);
  comPadding[tamanho] = 0x80;
  new DataView(comPadding.buffer).setUint32(comPadding.length - 4, tamanho * 8, false);

  const h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const w = new Uint32Array(64);
  const visao = new DataView(comPadding.buffer);

  for (let bloco = 0; bloco < comPadding.length; bloco += 64) {
    for (let i = 0; i < 16; i++) w[i] = visao.getUint32(bloco + i * 4, false);
    for (let i = 16; i < 64; i++) {
      const s0 = gira(w[i - 15], 7) ^ gira(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = gira(w[i - 2], 17) ^ gira(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i++) {
      const S1 = gira(e, 6) ^ gira(e, 11) ^ gira(e, 25);
      const escolha = (e & f) ^ (~e & g);
      const t1 = (hh + S1 + escolha + K[i] + w[i]) | 0;
      const S0 = gira(a, 2) ^ gira(a, 13) ^ gira(a, 22);
      const maioria = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maioria) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0;
      d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    [a, b, c, d, e, f, g, hh].forEach((valor, i) => { h[i] = (h[i] + valor) | 0; });
  }
  return h.map((x) => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

const criarHash = (senha, sal) => sha256(`msa|${sal}|${String(senha)}`);

const conferirSenha = (senha, sal, hash) => Boolean(hash) && criarHash(senha, sal) === hash;

// Regra mínima: nada de senha em branco, e pelo menos 4 caracteres.
function validarSenha(senha) {
  const limpa = String(senha || '').trim();
  if (limpa.length < 4) return 'A senha precisa ter pelo menos 4 caracteres.';
  return null;
}

return { sha256, criarHash, conferirSenha, validarSenha };
})();

__modulos['ficha'] = (function () {
// A ficha do aluno: o que ele informa no primeiro acesso e o que o instrutor
// precisa ter à mão — comum-congregação, instrumento, encarregados, ancião e

      : `<path d="M${x} ${y + deslocamento} C${x + 9} ${y - 6 + deslocamento}, ${x + 9} ${y - 14 + deslocamento}, ${x + 3} ${y - 20 + deslocamento}"
          fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>`;
  }
  return saida;
}

const BANDEIROLAS = { semibreve: 0, minima: 0, seminima: 0, colcheia: 1, semicolcheia: 2, fusa: 3, semifusa: 4 };
const ABERTAS = ['semibreve', 'minima'];

// Uma nota completa (cabeça + haste + bandeirolas + ponto), desenhada em torno
// de (x, y). hasteParaCima decide o lado.
function desenharNota(x, y, figura = 'seminima', { hasteParaCima = true, pontuada = false } = {}) {
  let saida = cabeca(x, y, ABERTAS.includes(figura));
  if (figura !== 'semibreve') {
    const xHaste = hasteParaCima ? x + 5.6 : x - 5.6;
    const yFim = hasteParaCima ? y - 32 : y + 32;
    saida += `<line x1="${xHaste}" y1="${y}" x2="${xHaste}" y2="${yFim}" stroke="currentColor" stroke-width="1.8"/>`;
    saida += bandeirola(xHaste, yFim, BANDEIROLAS[figura], hasteParaCima);
  }
  if (pontuada) saida += `<circle cx="${x + 11}" cy="${y - 5}" r="1.9" fill="currentColor"/>`;
  return saida;
}

// Pausas: cada figura tem o seu desenho próprio.
function desenharPausa(x, y, figura = 'seminima') {
  switch (figura) {
    case 'semibreve': // pendurada na 4ª linha
      return `<line x1="${x - 9}" y1="${y - 10}" x2="${x + 9}" y2="${y - 10}" stroke="currentColor" stroke-width="0.9" opacity="0.45"/>
              <rect x="${x - 6}" y="${y - 10}" width="12" height="5" fill="currentColor"/>`;
    case 'minima': // sentada na 3ª linha
      return `<line x1="${x - 9}" y1="${y}" x2="${x + 9}" y2="${y}" stroke="currentColor" stroke-width="0.9" opacity="0.45"/>
              <rect x="${x - 6}" y="${y - 5}" width="12" height="5" fill="currentColor"/>`;
    case 'seminima':
      return `<path d="M${x - 3} ${y - 14} C${x + 4} ${y - 8}, ${x - 4} ${y - 6}, ${x + 3} ${y}
                       C${x - 5} ${y - 3}, ${x + 1} ${y + 8}, ${x + 4} ${y + 12}
                       C${x - 2} ${y + 8}, ${x - 6} ${y + 4}, ${x - 1} ${y + 2}
                       C${x - 6} ${y - 2}, ${x - 6} ${y - 10}, ${x - 3} ${y - 14} Z" fill="currentColor"/>`;
    default: {
      const ganchos = { colcheia: 1, semicolcheia: 2, fusa: 3, semifusa: 4 }[figura] || 1;
      let saida = `<line x1="${x + 3}" y1="${y - 8}" x2="${x - 2}" y2="${y + 10}" stroke="currentColor" stroke-width="1.8"/>`;
      for (let i = 0; i < ganchos; i++) {
        const yg = y - 8 + i * 6;
        saida += `<circle cx="${x + 1}" cy="${yg}" r="2" fill="currentColor"/>
                  <path d="M${x + 1} ${yg} C${x - 2} ${yg + 3}, ${x - 4} ${yg + 3}, ${x - 5} ${yg + 1}"
                        fill="none" stroke="currentColor" stroke-width="1.6"/>`;
      }
      return saida;
    }
  }
}

function linhasSuplementares(x, posicao) {
  let saida = '';
  for (let p = 10; p <= posicao; p += 2) saida += `<line x1="${x - 11}" y1="${yDaPosicao(p)}" x2="${x + 11}" y2="${yDaPosicao(p)}" stroke="currentColor" stroke-width="1.3"/>`;
  for (let p = -2; p >= posicao; p -= 2) saida += `<line x1="${x - 11}" y1="${yDaPosicao(p)}" x2="${x + 11}" y2="${yDaPosicao(p)}" stroke="currentColor" stroke-width="1.3"/>`;
  return saida;
}

function desenharClave(claveId) {
  if (claveId === 'sol') return `<g transform="translate(12 ${yDaPosicao(2) - 50})" class="clave">${CLAVE_SOL}</g>`;
  if (claveId === 'fa') return `<g transform="translate(12 ${yDaPosicao(6) - 10})" class="clave">${CLAVE_FA}</g>`;
  return `<g transform="translate(12 ${yDaPosicao(8)})" class="clave">${CLAVE_DO}</g>`;
}

// Posição vertical de cada acidente da armadura, por clave. Os acidentes
// caminham sempre uma 4ª abaixo / uma 5ª acima (3 e 4 posições no pentagrama),
// que é a ordem gráfica clássica da armadura de clave.
const INICIO_DA_ARMADURA = {
  sol: { sustenido: 8, bemol: 4 },
  fa: { sustenido: 6, bemol: 2 },
  do: { sustenido: 7, bemol: 3 },
};
const PASSOS = { sustenido: [-3, 4, -3, -3, 4, -3], bemol: [3, -4, 3, -4, 3, -4] };

function posicoesDaArmadura(claveId, tipo, quantidade) {
  const posicoes = [INICIO_DA_ARMADURA[claveId][tipo]];
  for (let i = 0; i < quantidade - 1; i++) posicoes.push(posicoes[i] + PASSOS[tipo][i]);
  return posicoes.slice(0, quantidade);
}

function desenharArmadura(claveId, letras, tipo, xInicial) {
  const posicoes = posicoesDaArmadura(claveId, tipo, letras.length);
  let x = xInicial;
  let saida = '';
  letras.forEach((letra, i) => {
    const y = yDaPosicao(posicoes[i]);
    const glifo = tipo === 'bemol' ? BEMOL : SUSTENIDO;
    saida += `<g transform="translate(${x} ${y - ALTURA_ACIDENTE[tipo === 'bemol' ? -1 : 1]})">${glifo}</g>`;
    x += tipo === 'bemol' ? 9.5 : 11;
  });
  return { svg: saida, x };
}

/**
 * Pentagrama completo.
 * notas: [{ letra, oitava, alteracao, figura, pausa, pontuada }]
 */
function pentagrama({
  clave = 'sol', armadura = null, compasso = null, notas = [], largura = 320, rotulos = null, destaque = -1,
} = {}) {
  const altura = 130;
  let corpo = '';
  for (let i = 0; i < 5; i++) {
    const y = TOPO + i * ESPACO;
    corpo += `<line x1="6" y1="${y}" x2="${largura - 6}" y2="${y}" stroke="currentColor" stroke-width="1.2"/>`;
  }
  corpo += desenharClave(clave);
  let x = clave === 'do' ? 48 : 42;

  if (armadura && armadura.letras && armadura.letras.length) {
    const resultado = desenharArmadura(clave, armadura.letras, armadura.tipo, x);
    corpo += resultado.svg;
    x = resultado.x + 6;
  }
  if (compasso) {
    const [cima, baixo] = String(compasso).split('/');
    corpo += `<text x="${x + 10}" y="${yDaPosicao(6) + 7}" class="formula" text-anchor="middle">${escape(cima)}</text>
              <text x="${x + 10}" y="${yDaPosicao(2) + 7}" class="formula" text-anchor="middle">${escape(baixo)}</text>`;
    x += 26;
  }

  const passo = Math.max(30, (largura - x - 20) / Math.max(notas.length, 1));
  notas.forEach((n, i) => {
    const cx = x + 18 + i * passo;
    if (n.interrogacao) {
      corpo += `<text x="${cx}" y="${yDaPosicao(4) + 9}" class="interrogacao" text-anchor="middle">?</text>`;
    } else if (n.pausa) {
      corpo += `<g class="${i === destaque ? 'destacada' : ''}">${desenharPausa(cx, yDaPosicao(4), n.figura || 'seminima')}</g>`;
    } else {
      const posicao = posicaoDaNota(clave, n.letra, n.oitava);
      const y = yDaPosicao(posicao);
      corpo += linhasSuplementares(cx, posicao);
      if (n.alteracao) corpo += `<g transform="translate(${cx - 20} ${y - ALTURA_ACIDENTE[n.alteracao]})">${ACIDENTES[n.alteracao]}</g>`;
      corpo += `<g class="${i === destaque ? 'destacada' : ''}">${desenharNota(cx, y, n.figura || 'seminima', {
        hasteParaCima: posicao < 4, pontuada: n.pontuada,
      })}</g>`;
    }
    if (rotulos && rotulos[i]) corpo += `<text x="${cx}" y="${altura - 8}" class="rotulo" text-anchor="middle">${escape(rotulos[i])}</text>`;
  });

  return `<svg viewBox="0 0 ${largura} ${altura}" class="pentagrama" role="img" xmlns="http://www.w3.org/2000/svg">${corpo}</svg>`;
}

// Figura solta (usada nos exercícios de ritmo e nos jogos de memória).
function figuraSolta(figura, { pausa = false, pontuada = false, tamanho = 78 } = {}) {
  const corpo = pausa ? desenharPausa(30, 44, figura) : desenharNota(26, 56, figura, { hasteParaCima: true, pontuada });
  return `<svg viewBox="0 0 60 76" width="${tamanho * 0.79}" height="${tamanho}" class="figura" xmlns="http://www.w3.org/2000/svg">${corpo}</svg>`;
}

// Um compasso com uma sequência de figuras, para leitura rítmica.
function compassoRitmico(sequencia, { formula = '4/4', largura = 320, destaque = -1 } = {}) {
  return pentagrama({
    clave: 'sol',
    compasso: formula,
    largura,
    destaque,
    notas: sequencia.map((item) => ({ letra: 'Si', oitava: 4, figura: item.figura, pausa: item.pausa, pontuada: item.pontuada })),
  });
}

// ------------------------------------------------------------------ teclado

const BRANCAS = ['Dó', 'Ré', 'Mi', 'Fá', 'Sol', 'Lá', 'Si'];
const PRETAS = [0, 1, 3, 4, 5]; // depois de Dó, Ré, Fá, Sol, Lá

function teclado({ oitavas = 1, marcadas = {}, rotulos = true, interativo = false, larguraTecla = 30 } = {}) {
  const alturaBranca = 110;
  const total = oitavas * 7 + 1;
  const largura = total * larguraTecla;
  let corpo = '';
  for (let i = 0; i < total; i++) {
    const letra = BRANCAS[i % 7];
    const oitava = 4 + Math.floor(i / 7);
    const chave = `${letra}${oitava}`;
    const cor = marcadas[chave];
    corpo += `<rect data-tecla="${chave}" x="${i * larguraTecla}" y="0" width="${larguraTecla - 1}" height="${alturaBranca}"
      rx="3" class="tecla branca ${cor ? 'marcada ' + cor : ''} ${interativo ? 'clicavel' : ''}"/>`;
    if (rotulos) corpo += `<text x="${i * larguraTecla + larguraTecla / 2 - 0.5}" y="${alturaBranca - 8}" class="rotulo-tecla" text-anchor="middle">${letra}</text>`;
  }
  for (let i = 0; i < total - 1; i++) {
    if (!PRETAS.includes(i % 7)) continue;
    const letra = BRANCAS[i % 7];
    const oitava = 4 + Math.floor(i / 7);
    const chave = `${letra}#${oitava}`;
    const cor = marcadas[chave];
    corpo += `<rect data-tecla="${chave}" x="${i * larguraTecla + larguraTecla * 0.66}" y="0"
      width="${larguraTecla * 0.62}" height="${alturaBranca * 0.62}" rx="2"
      class="tecla preta ${cor ? 'marcada ' + cor : ''} ${interativo ? 'clicavel' : ''}"/>`;
  }
  return `<svg viewBox="0 0 ${largura} ${alturaBranca}" class="teclado" xmlns="http://www.w3.org/2000/svg">${corpo}</svg>`;
}

return { desenharNota, desenharPausa, posicoesDaArmadura, desenharArmadura, pentagrama, figuraSolta, compassoRitmico, teclado };

__modulos['audio'] = (function () {
// Som do app: notas, metrônomo e efeitos, feitos na hora com Web Audio.
// Sem arquivos de áudio, para o app continuar leve e funcionar offline.

let contexto = null;

function contextoDeAudio() {
  if (!contexto) {
    const Classe = window.AudioContext || window.webkitAudioContext;
    if (!Classe) return null;
    contexto = new Classe();
  }
  if (contexto.state === 'suspended') contexto.resume();
  return contexto;
}

const audioDisponivel = () => Boolean(window.AudioContext || window.webkitAudioContext);

const SEMITONS = { 'Dó': 0, 'Ré': 2, 'Mi': 4, 'Fá': 5, 'Sol': 7, 'Lá': 9, 'Si': 11 };

function frequencia(letra, oitava = 4, alteracao = 0) {
  const semitom = SEMITONS[letra] + alteracao + (oitava - 4) * 12;
  // Lá4 = 440 Hz e está 9 semitons acima do Dó4.
  return 440 * Math.pow(2, (semitom - 9) / 12);
}

function tocarFrequencia(hz, { duracao = 0.6, volume = 0.25, timbre = 'triangle', atraso = 0 } = {}) {
  const ctx = contextoDeAudio();
  if (!ctx) return;
  const inicio = ctx.currentTime + atraso;
  const oscilador = ctx.createOscillator();
  const ganho = ctx.createGain();
  oscilador.type = timbre;
  oscilador.frequency.value = hz;
  ganho.gain.setValueAtTime(0.0001, inicio);
  ganho.gain.exponentialRampToValueAtTime(volume, inicio + 0.02);
  ganho.gain.exponentialRampToValueAtTime(0.0001, inicio + duracao);
  oscilador.connect(ganho).connect(ctx.destination);
  oscilador.start(inicio);
  oscilador.stop(inicio + duracao + 0.05);
}

const tocarNota = (letra, oitava = 4, opcoes = {}) => tocarFrequencia(frequencia(letra, oitava, opcoes.alteracao || 0), opcoes);

function tocarSequencia(notas, { intervalo = 0.55, duracao = 0.5, volume = 0.25 } = {}) {
  notas.forEach((n, i) => tocarFrequencia(
    typeof n === 'number' ? n : frequencia(n.letra, n.oitava ?? 4, n.alteracao || 0),
    { duracao, volume, atraso: i * intervalo },
  ));
}

function efeito(tipo) {
  if (tipo === 'acerto') tocarSequencia([frequencia('Dó', 5), frequencia('Mi', 5), frequencia('Sol', 5)], { intervalo: 0.09, duracao: 0.18, volume: 0.2 });
  else if (tipo === 'erro') tocarSequencia([frequencia('Si', 3), frequencia('Fá', 3)], { intervalo: 0.13, duracao: 0.25, volume: 0.18 });
  else if (tipo === 'vitoria') tocarSequencia([frequencia('Dó', 5), frequencia('Mi', 5), frequencia('Sol', 5), frequencia('Dó', 6)], { intervalo: 0.14, duracao: 0.3, volume: 0.22 });
}

// Metrônomo agendado no relógio do áudio, que não escorrega como o setInterval.
class Metronomo {
  constructor({ bpm = 80, porCompasso = 4, aoBater = null } = {}) {
    this.bpm = bpm;
    this.porCompasso = porCompasso;
    this.aoBater = aoBater;
    this.tocando = false;
    this.batida = 0;
    this.proxima = 0;
    this.timer = null;
  }

  clique(forte, quando) {
    const ctx = contextoDeAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const ganho = ctx.createGain();
    osc.frequency.value = forte ? 1600 : 1000;
    ganho.gain.setValueAtTime(forte ? 0.35 : 0.2, quando);
    ganho.gain.exponentialRampToValueAtTime(0.0001, quando + 0.06);
    osc.connect(ganho).connect(ctx.destination);
    osc.start(quando);
    osc.stop(quando + 0.08);
  }

  comecar() {
    const ctx = contextoDeAudio();
    if (!ctx || this.tocando) return;
    this.tocando = true;
    this.batida = 0;
    this.proxima = ctx.currentTime + 0.12;
    const agendar = () => {
      if (!this.tocando) return;
      while (this.proxima < ctx.currentTime + 0.2) {
        const forte = this.batida % this.porCompasso === 0;
        this.clique(forte, this.proxima);
        if (this.aoBater) this.aoBater(this.batida, forte, this.proxima);
        this.batida++;
        this.proxima += 60 / this.bpm;
      }
      this.timer = setTimeout(agendar, 60);
    };
    agendar();
  }

  parar() {
    this.tocando = false;
    clearTimeout(this.timer);
  }

  ajustar(bpm) {
    this.bpm = bpm;
  }
}

return { contextoDeAudio, audioDisponivel, frequencia, tocarFrequencia, tocarNota, tocarSequencia, efeito, Metronomo };
})();

__modulos['download'] = (function () {
// Entrega de arquivo ao aluno (certificado em PNG, cópia do progresso).
// Quando o app está rodando dentro de uma casca que controla os downloads,
// pede por ela; fora disso, usa o link de download do próprio navegador.

async function viaPlataforma(nomeArquivo, dados) {
  const casca = window.claude;
  if (!casca || typeof casca.use !== 'function') return false;
  const downloads = await casca.use('downloads');
  if (!downloads) return false;
  await downloads.save({ filename: nomeArquivo, data: dados });
  return true;
}

function viaNavegador(nomeArquivo, dados) {
  const url = URL.createObjectURL(dados);
  const link = document.createElement('a');
  link.href = url;
  link.download = nomeArquivo;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function salvarArquivo(nomeArquivo, dados) {
  try {
    if (await viaPlataforma(nomeArquivo, dados)) return 'salvo';
  } catch (erro) {
    // O aluno recusou a gravação, ou a casca não deixou: não há o que fazer.
    if (erro && erro.code === 'declined') return 'recusado';
  }
  viaNavegador(nomeArquivo, dados);
  return 'salvo';
}

return { salvarArquivo };
})();

// Ferramentas comuns aos geradores de pergunta (MSA e instrumento).

const { embaralhar } = __modulos['aleatorio'];

// Monta as alternativas: a certa e as erradas tiradas do repertório do assunto.
function alternativas(correta, repertorio, rnd, quantidade = 4) {
  const vistas = new Set([String(correta)]);
  const distratores = [];
  for (const item of embaralhar(repertorio, rnd)) {
    const texto = String(item);
    if (vistas.has(texto)) continue;
    vistas.add(texto);
    distratores.push(texto);
    if (distratores.length === quantidade - 1) break;
  }
  return embaralhar([String(correta), ...distratores], rnd);
}

const pares = (lista) => lista.flatMap((a, i) => lista.slice(i + 1).map((b) => [a, b]));

const maiuscula = (texto) => String(texto).charAt(0).toUpperCase() + String(texto).slice(1);

const ORDINAIS = ['', '1º', '2º', '3º', '4º', '5º', '6º', '7º', '8º'];

return { alternativas, pares, maiuscula, ORDINAIS };
})();

  familia, nome: FAMILIAS[familia].nome, lista: INSTRUMENTOS.filter((i) => i.familia === familia),
}));

/**
 * Que som sai quando o instrumento toca uma nota escrita.
 * O nome da nota vem do grau (quantas letras desce) e o acidente sai da conta
 * de semitons, que é o que faz Dó escrito soar Si♭ no clarinete.
 */
function somReal(instrumento, notaEscrita) {
  const { grau, semitons } = instrumento.transposicao;
  if (!semitons) return { ...notaEscrita };
  const indice = T.LETRAS.indexOf(notaEscrita.letra);
  const letra = T.LETRAS[((indice + grau) % 7 + 7) % 7];
  const alvo = ((T.semitomDaNota(notaEscrita) + semitons) % 12 + 12) % 12;
  const natural = T.SEMITONS_DA_LETRA[T.LETRAS.indexOf(letra)];
  let alteracao = ((alvo - natural + 18) % 12) - 6;
  if (alteracao > 2) alteracao -= 12;
  if (alteracao < -2) alteracao += 12;
  return T.nota(letra, alteracao);
}

// O caminho contrário: que nota o instrumento precisa ler para soar a nota
// pedida — é a conta que o instrutor faz ao passar um hino de tom.
function notaParaSoar(instrumento, notaDesejada) {
  const { grau, semitons } = instrumento.transposicao;
  if (!semitons) return { ...notaDesejada };
  const indice = T.LETRAS.indexOf(notaDesejada.letra);
  const letra = T.LETRAS[((indice - grau) % 7 + 7) % 7];
  const alvo = ((T.semitomDaNota(notaDesejada) - semitons) % 12 + 12) % 12;
  const natural = T.SEMITONS_DA_LETRA[T.LETRAS.indexOf(letra)];
  let alteracao = ((alvo - natural + 18) % 12) - 6;
  if (alteracao > 2) alteracao -= 12;
  if (alteracao < -2) alteracao += 12;
  return T.nota(letra, alteracao);
}

      return {
        enunciado: `Para tocar um hino em ${v.t} Maior, que acidentes você precisa fazer na sua escala?`,

  id: 'f3.quantas-figuras',
  fase: 3,
  variantes: () => T.COMPASSOS_SIMPLES.flatMap((c) => ['semibreve', 'minima', 'seminima', 'colcheia', 'semicolcheia']
    .map((f) => ({ c: c.formula, f }))
    .filter(({ c: formula, f }) => {
      const comp = T.COMPASSOS_SIMPLES.find((x) => x.formula === formula);
      const total = comp.tempos * T.figuraPorId(comp.unidade).duracao;
      const q = total / T.figuraPorId(f).duracao;
      return Number.isInteger(q) && q > 0 && q <= 32;
    })),
  chave: (v) => `${v.c}-${v.f}`,
  montar(v, rnd) {
    const c = T.COMPASSOS_SIMPLES.find((x) => x.formula === v.c);
    const figura = T.figuraPorId(v.f);
    const total = c.tempos * T.figuraPorId(c.unidade).duracao;
    const quantidade = Math.round(total / figura.duracao);
    return {
      enunciado: `Quantas ${figura.nome}s são necessárias para completar um compasso ${c.formula}?`,
      alternativas: alternativas(String(quantidade), ['1', '2', '3', '4', '6', '8', '12', '16', '24', '32'], rnd),
      correta: String(quantidade),
      explicacao: `O compasso ${c.formula} tem ${c.tempos} × ${T.figuraPorId(c.unidade).nome} = ${T.fracaoBonita(total)} tempos de semínima; cabem ${quantidade} ${figura.nome}s.`,

});

registrar({
  id: 'f3.completa-compasso',
  fase: 3,
  variantes: () => ['2/4', '3/4', '4/4'].flatMap((f) => ['seminima', 'minima', 'colcheia', 'semicolcheia'].flatMap((falta) =>
    [0, 1].map((arranjo) => ({ f, falta, arranjo })))),
  chave: (v) => `${v.f}-${v.falta}-${v.arranjo}`,
  montar(v, rnd) {
    const c = T.COMPASSOS_SIMPLES.find((x) => x.formula === v.f);
    const faltante = T.figuraPorId(v.falta);
    const restante = c.tempos - faltante.duracao;
    if (restante <= 0) {
      return {
        enunciado: `Uma única figura preenche sozinha o compasso ${c.formula}. Qual é ela?`,
        alternativas: alternativas(T.FIGURAS.find((f) => f.duracao === c.tempos)?.nome || 'semibreve', T.FIGURAS.map((f) => f.nome), rnd),
        correta: T.FIGURAS.find((f) => f.duracao === c.tempos)?.nome || 'semibreve',
        explicacao: `Em ${c.formula} cabem ${c.tempos} tempos.`,
        referencia: 'MSA, pág. 24',
      };
    }
    // Escreve o que já está no compasso e pergunta o que falta.
    const escrito = [];
    let sobra = restante;
    const paleta = v.arranjo === 0 ? ['seminima', 'colcheia'] : ['minima', 'seminima'];
    for (const id of paleta) {
      const f = T.figuraPorId(id);
      while (sobra - f.duracao >= -1e-9 && escrito.length < 6) { escrito.push(id); sobra = +(sobra - f.duracao).toFixed(4); }
    }
    while (sobra > 1e-9) { escrito.push('semicolcheia'); sobra = +(sobra - 0.25).toFixed(4); }
    return {
      enunciado: `Que figura falta para completar este compasso ${c.formula}?`,
      html: pentagrama({
        clave: 'sol', compasso: c.formula, largura: 320,
        notas: escrito.map((id) => ({ letra: 'Si', oitava: 4, figura: id })).concat([{ letra: 'Si', oitava: 4, figura: 'seminima', pausa: true, interrogacao: true }]),
      }),
      alternativas: alternativas(faltante.nome, T.FIGURAS.map((f) => f.nome), rnd),
      correta: faltante.nome,
      explicacao: `O compasso ${c.formula} tem ${c.tempos} tempos; o que está escrito soma ${T.fracaoBonita(restante)}. Falta ${T.fracaoBonita(faltante.duracao)} tempo(s): uma ${faltante.nome}.`,
      referencia: 'MSA, pág. 24',
    };
  },
});

registrar({
  id: 'f5.altera-nota',
  fase: 5,
  variantes: () => T.LETRAS.flatMap((l) => [
    { l, op: 'sobe-semitom' }, { l, op: 'desce-semitom' }, { l, op: 'sobe-tom' }, { l, op: 'desce-tom' },
  ]),
  chave: (v) => `${v.l}-${v.op}`,
  montar(v, rnd) {
    const mapa = {
      'sobe-semitom': { texto: 'um semitom acima', alt: 1 }, 'desce-semitom': { texto: 'um semitom abaixo', alt: -1 },
      'sobe-tom': { texto: 'um tom acima', alt: 2 }, 'desce-tom': { texto: 'um tom abaixo', alt: -2 },
    }[v.op];
    const base = T.nota(v.l);
    const alvo = (T.semitomDaNota(base) + mapa.alt + 12) % 12;
    // Mantém o nome da letra quando cabe (alteração cromática); senão usa a vizinha natural.
    let resposta = null;
    for (const alteracao of [0, 1, -1, 2, -2]) {
      const candidata = T.nota(v.l, alteracao);
      if (T.semitomDaNota(candidata) === alvo && Math.abs(alteracao) <= 2) { resposta = candidata; break; }
    }
    if (!resposta || Math.abs(resposta.alteracao) > 1) {
      const vizinha = T.LETRAS.find((l) => T.SEMITONS_DA_LETRA[T.LETRAS.indexOf(l)] === alvo);
      if (vizinha) resposta = T.nota(vizinha);
    }
    const nome = T.nomeDaNota(resposta);

registrar({
  id: 'f8.figuras-no-composto',
  fase: 8,
  variantes: () => T.COMPASSOS_COMPOSTOS.flatMap((c) => ['colcheia', 'semicolcheia', 'seminima'].map((f) => ({ c: c.formula, f })))

      const comp = T.COMPASSOS_COMPOSTOS.find((x) => x.formula === c);
      const [cima, baixo] = comp.formula.split('/').map(Number);
      const total = cima * T.FIGURAS.find((x) => x.equivalencia === baixo).duracao;

      return Number.isInteger(q) && q <= 48;

    const figura = T.figuraPorId(v.f);

});

// ------------------------------------------------------- consultas do motor

// A fase do MSA é identificada por número ('1' a '10'); a do instrumento, por
// 'inst1' a 'inst4'. O contexto é o instrumento do aluno, usado só na segunda.
function geradoresDaFase(faseId, contexto = null) {
  const chave = String(faseId);
  if (/^\d+$/.test(chave)) return GERADORES.filter((g) => String(g.fase) === chave);
  return contexto ? GERADORES_INSTRUMENTO.filter((g) => g.fase === chave) : [];
}

// Universo completo de perguntas possíveis de uma fase: cada item é uma
// pergunta distinta que ainda pode ser sorteada.
function universoDaFase(faseId, contexto = null) {
  const itens = [];
  for (const gerador of geradoresDaFase(faseId, contexto)) {
    for (const variante of gerador.variantes(contexto)) {
      itens.push({ gerador, variante, contexto, assinatura: `${gerador.id}#${gerador.chave(variante)}` });
    }
  }
  return itens;
}

const totalDeVariantes = (faseId, contexto = null) => universoDaFase(faseId, contexto).length;

return { GERADORES, geradoresDaFase, universoDaFase, totalDeVariantes };
})();

__modulos['quiz'] = (function () {
// Motor da avaliação. A regra da casa: a mesma pergunta nunca cai duas vezes
// para o mesmo aluno. Cada pergunta gerada tem uma assinatura; as assinaturas
// já usadas ficam guardadas e são descontadas do sorteio seguinte.

const { criarAleatorio, embaralhar, novaSemente } = __modulos['aleatorio'];
const { universoDaFase } = __modulos['conteudo/geradores'];

const QUESTOES_POR_PROVA = 10;
const NOTA_MINIMA = 70;

function perguntasIneditas(faseId, usadas, contexto = null) {
  const jaVistas = new Set(usadas);
  return universoDaFase(faseId, contexto).filter((item) => !jaVistas.has(item.assinatura)).length;
}

/**
 * Monta uma prova espalhando as perguntas entre os geradores da fase, para
 * que a avaliação cubra assuntos diferentes e não caia tudo no mesmo ponto.
 */
function montarProva(faseId, usadas = [], { quantidade = QUESTOES_POR_PROVA, semente = novaSemente(), contexto = null } = {}) {
  const rnd = criarAleatorio(semente);
  const universo = universoDaFase(faseId, contexto);
  const jaVistas = new Set(usadas);
  let disponiveis = universo.filter((item) => !jaVistas.has(item.assinatura));
  let reciclou = false;

  // Só quando o aluno já esgotou o repertório inédito da fase é que voltamos
  // a usar as perguntas mais antigas — e o app avisa isso na tela.
  if (disponiveis.length < quantidade) {
    reciclou = true;
    const antigas = usadas.slice(0, Math.max(0, quantidade - disponiveis.length) + 20);
    const conjunto = new Set(antigas);
    disponiveis = disponiveis.concat(universo.filter((item) => conjunto.has(item.assinatura)));
  }

  // Agrupa por gerador e vai pegando um de cada, em rodadas.
  const porGerador = new Map();
  for (const item of embaralhar(disponiveis, rnd)) {
    if (!porGerador.has(item.gerador.id)) porGerador.set(item.gerador.id, []);
    porGerador.get(item.gerador.id).push(item);
  }
  const filas = embaralhar([...porGerador.values()], rnd);
  const escolhidos = [];
  let rodada = 0;
  while (escolhidos.length < quantidade && rodada < 200) {
    let pegouAlgum = false;
    for (const fila of filas) {
      if (escolhidos.length >= quantidade) break;
      if (fila.length > rodada) { escolhidos.push(fila[rodada]); pegouAlgum = true; }
    }
    if (!pegouAlgum) break;
    rodada++;
  }

  const questoes = embaralhar(escolhidos, rnd).slice(0, quantidade).map((item, indice) => {
    const montada = item.gerador.montar(item.variante, rnd, contexto);
    return {
      indice,
      assinatura: item.assinatura,
      geradorId: item.gerador.id,
      enunciado: montada.enunciado,
      html: montada.html || '',
      alternativas: montada.alternativas,
      correta: montada.correta,
      explicacao: montada.explicacao,
      referencia: montada.referencia,
    };
  });

  return { faseId: String(faseId), semente, reciclou, questoes, ineditasRestantes: universo.length - jaVistas.size };
}

function corrigir(prova, respostas) {
  const detalhes = prova.questoes.map((q, i) => ({
    questao: q,
    resposta: respostas[i] ?? null,
    certa: respostas[i] === q.correta,
  }));
  const acertos = detalhes.filter((d) => d.certa).length;
  const nota = Math.round((acertos / prova.questoes.length) * 100);
  return { detalhes, acertos, total: prova.questoes.length, nota, aprovado: nota >= NOTA_MINIMA };
}

return { QUESTOES_POR_PROVA, NOTA_MINIMA, perguntasIneditas, montarProva, corrigir };

__modulos['arquivos'] = (function () {
// Onde os PDFs ficam.
//
// O resto do aplicativo mora no localStorage, e é o lugar certo para o que
// ele guarda: texto pequeno, lido inteiro a cada abertura. Um método em PDF
// não é nada disso. O localStorage do navegador tem por volta de 5 MB para
// TUDO, e guarda texto — um PDF entraria em base64, um terço maior do que já
// é. Um método de 8 MB não caberia; e, ao tentar, derrubaria a gravação do
// progresso de todo mundo junto, porque o depósito grava o estado inteiro de
// uma vez. Dado grande e dado pequeno com ciclos de vida diferentes não
// dividem gaveta.
//
// Então os bytes ficam no IndexedDB, que guarda Blob de verdade e tem espaço
// na casa das centenas de MB, e o cadastro da turma guarda só a ficha do
// arquivo: nome, tipo, tamanho e o identificador daqui.

const BANCO = 'msa.arquivos';
const LOJA = 'materiais';

// O tamanho máximo de um arquivo guardado. Fica aqui, no módulo que guarda,
// e não em cada serviço que anexa: dois limites com o mesmo nome em lugares
// diferentes é questão de tempo até um deles ser esquecido numa mudança.
const TAMANHO_MAXIMO = 65 * 1024 * 1024; // 65 MB
const emMB = (bytes) => Math.round(bytes / 1024 / 1024);

const indexado = () => (typeof indexedDB === 'undefined' ? null : indexedDB);

function abrir() {
  return new Promise((pronto, falhou) => {
    const idb = indexado();
    if (!idb) { falhou(new Error('Este navegador não guarda arquivos.')); return; }
    const pedido = idb.open(BANCO, 1);
    pedido.onupgradeneeded = () => {
      const bd = pedido.result;
      if (!bd.objectStoreNames.contains(LOJA)) bd.createObjectStore(LOJA);
    };
    pedido.onsuccess = () => pronto(pedido.result);
    pedido.onerror = () => falhou(pedido.error || new Error('Não foi possível abrir o guardador de arquivos.'));
  });
}

function transacao(modo, trabalho) {
  return abrir().then((bd) => new Promise((pronto, falhou) => {
    const t = bd.transaction(LOJA, modo);
    const pedido = trabalho(t.objectStore(LOJA));
    pedido.onsuccess = () => pronto(pedido.result);
    pedido.onerror = () => falhou(pedido.error || new Error('Não foi possível ler ou gravar o arquivo.'));
    t.oncomplete = () => bd.close();
  }));
}

const disponivel = () => Boolean(indexado());

/**
 * Guarda o conteúdo de um arquivo sob um identificador.
 *
 * O erro que o navegador devolve quando o espaço acaba ("The quota has been
 * exceeded") não diz à pessoa o que fazer, e nem está na língua dela. Aqui ele
 * vira uma frase que diz o tamanho, o limite e a saída.
 */
async function guardar(id, blob) {
  if (blob && blob.size > TAMANHO_MAXIMO) {
    throw new Error(`O arquivo tem ${emMB(blob.size)} MB e o limite é ${emMB(TAMANHO_MAXIMO)} MB.`);
  }
  try {
    return await transacao('readwrite', (loja) => loja.put(blob, id));
  } catch (erro) {
    const semEspaco = erro && (erro.name === 'QuotaExceededError' || /quota/i.test(String(erro.message)));
    if (!semEspaco) throw erro;
    throw new Error(`Não coube: este aparelho ficou sem espaço para guardar ${emMB(blob.size)} MB. `
      + 'Remova um material que não seja mais usado, ou libere espaço no navegador, e tente de novo.');
  }
}

/** Devolve o conteúdo guardado, ou null quando não há nada com esse id. */
const ler = (id) => transacao('readonly', (loja) => loja.get(id)).then((v) => v || null);

const remover = (id) => transacao('readwrite', (loja) => loja.delete(id));

const identificadores = () => transacao('readonly', (loja) => loja.getAllKeys());

/**
 * Apaga tudo o que não estiver mais na lista de arquivos em uso. É o que
 * impede o guardador de virar um sótão: remover a turma remove o material
 * do cadastro, e a faxina leva os bytes junto.
 */
async function faxina(emUso = []) {
  const usados = new Set(emUso);
  const guardados = await identificadores();
  const sobrando = guardados.filter((id) => !usados.has(id));
  for (const id of sobrando) await remover(id);
  return sobrando.length;
}

/** Um endereço temporário para abrir o arquivo numa aba ou num visualizador. */
async function endereco(id) {
  const blob = await ler(id);
  return blob ? URL.createObjectURL(blob) : null;
}

const apagarTudo = () => transacao('readwrite', (loja) => loja.clear());

return { TAMANHO_MAXIMO, disponivel, guardar, ler, remover, identificadores, faxina, endereco, apagarTudo };
})();

__modulos['dados/deposito'] = (function () {
// Depósito: a única porta por onde os dados entram e saem.
//
// Hoje o aplicativo guarda tudo no localStorage do aparelho. Amanhã pode ser
// Supabase, PostgreSQL, Firebase ou uma API REST. Para que essa troca não
// obrigue a mexer nas telas, ninguém fora daqui chama localStorage: as telas
// falam com os repositórios, os repositórios falam com o depósito, e o
// depósito é a peça trocável.
//
// Um depósito precisa saber fazer quatro coisas:
//   ler()        -> o estado guardado, ou null se não houver nada
//   gravar(e)    -> guarda o estado; devolve true se conseguiu
//   remover()    -> apaga o que está guardado
//   disponivel() -> diz se dá para guardar neste ambiente

const CHAVE_V2 = 'msa.escola.v2';
const CHAVE_V1 = 'msa.escola.v1';
const CHAVE_V0 = 'msa.progresso.v1';
const PREFIXO_DE_BACKUP = 'msa.backup.';

const armazenamentoDoNavegador = () => {
  try {
    return typeof localStorage !== 'undefined' ? localStorage : null;
  } catch (erro) {
    // Navegador com armazenamento bloqueado: o app roda só nesta sessão.
    return null;
  }
};

// ---------------------------------------------------- depósito no aparelho

function criarDepositoLocal(chave = CHAVE_V2) {
  return {
    tipo: 'local',
    chave,
    disponivel() {
      const loja = armazenamentoDoNavegador();
      if (!loja) return false;
      try {
        loja.setItem('msa.teste', '1');
        loja.removeItem('msa.teste');
        return true;
      } catch (erro) {
        return false;
      }
    },
    ler() {
      const loja = armazenamentoDoNavegador();
      if (!loja) return null;
      try {
        const bruto = loja.getItem(chave);
        return bruto ? JSON.parse(bruto) : null;
      } catch (erro) {
        console.warn(`Não foi possível ler "${chave}":`, erro);
        return null;
      }
    },
    gravar(estado) {
      const loja = armazenamentoDoNavegador();
      if (!loja) return false;
      try {
        loja.setItem(chave, JSON.stringify(estado));
        return true;
      } catch (erro) {
        // Aparelho sem espaço: o app continua funcionando nesta sessão,
        // só não guarda o que foi feito.
        console.warn('Não foi possível guardar os dados:', erro);
        return false;
      }
    },
    remover() {
      const loja = armazenamentoDoNavegador();
      if (!loja) return false;
      try {
        loja.removeItem(chave);
        return true;
      } catch (erro) {
        return false;
      }
    },
    // Usado pela migração: ler e escrever chaves vizinhas (V1, backups)
    // sem que o resto do aplicativo precise conhecer o localStorage.
    lerChave(outra) {
      const loja = armazenamentoDoNavegador();
      if (!loja) return null;
      try {
        const bruto = loja.getItem(outra);
        return bruto ? JSON.parse(bruto) : null;
      } catch (erro) {
        return null;
      }
    },
    gravarChave(outra, valor) {
      const loja = armazenamentoDoNavegador();
      if (!loja) return false;
      try {
        loja.setItem(outra, JSON.stringify(valor));
        return true;
      } catch (erro) {
        console.warn(`Não foi possível guardar "${outra}":`, erro);
        return false;
      }
    },
    removerChave(outra) {
      const loja = armazenamentoDoNavegador();
      if (!loja) return false;
      try {
        loja.removeItem(outra);
        return true;
      } catch (erro) {
        return false;
      }
    },
    chaves() {
      const loja = armazenamentoDoNavegador();
      if (!loja) return [];
      try {
        const lista = [];
        for (let i = 0; i < loja.length; i++) lista.push(loja.key(i));
        return lista.filter(Boolean);
      } catch (erro) {
        return [];
      }
    },
  };
}

// ------------------------------------------------- depósito só na memória

// Serve para os testes e para quando o navegador bloqueia o armazenamento:
// o app funciona, mas o que foi feito não sobrevive ao fechar a página.
function criarDepositoEmMemoria(inicial = null) {
  const memoria = new Map();
  const guardar = (c, v) => memoria.set(c, JSON.stringify(v));
  const buscar = (c) => (memoria.has(c) ? JSON.parse(memoria.get(c)) : null);
  if (inicial) guardar(CHAVE_V2, inicial);
  return {
    tipo: 'memoria',
    chave: CHAVE_V2,
    disponivel: () => true,
    ler: () => buscar(CHAVE_V2),
    gravar: (estado) => { guardar(CHAVE_V2, estado); return true; },
    remover: () => { memoria.delete(CHAVE_V2); return true; },
    lerChave: buscar,
    gravarChave: (c, v) => { guardar(c, v); return true; },
    removerChave: (c) => { memoria.delete(c); return true; },
    chaves: () => [...memoria.keys()],
  };
}

// ------------------------------------------- depósito remoto (para depois)

// Esqueleto do dia em que os dados forem para um servidor. Fica aqui para
// deixar explícito o contrato que qualquer depósito precisa cumprir: quem
// escrever o adaptador de Supabase, Firebase ou API REST implementa estas
// mesmas funções e o resto do aplicativo não muda uma linha.
function criarDepositoRemoto({ carregar, salvar, apagar } = {}) {
  const exigir = (funcao, nome) => {
    if (typeof funcao !== 'function') throw new Error(`Depósito remoto sem a função "${nome}".`);
    return funcao;
  };
  return {
    tipo: 'remoto',
    chave: CHAVE_V2,
    disponivel: () => true,
    ler: () => exigir(carregar, 'carregar')(),
    gravar: (estado) => exigir(salvar, 'salvar')(estado),
    remover: () => exigir(apagar, 'apagar')(),
    lerChave: () => null,
    gravarChave: () => false,
    removerChave: () => false,
    chaves: () => [],
  };
}

// ------------------------------------------------------- depósito em uso

let atual = null;

function depositoAtual() {
  if (!atual) atual = criarDepositoLocal();
  return atual;
}

function definirDeposito(deposito) {
  atual = deposito;
  return atual;
}

return { CHAVE_V2, CHAVE_V1, CHAVE_V0, PREFIXO_DE_BACKUP, criarDepositoLocal, criarDepositoEmMemoria, criarDepositoRemoto, depositoAtual, definirDeposito };
})();
